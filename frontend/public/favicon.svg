<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="宿舍打印">
  <!-- 品牌黄底 + 深色打印机图标。图标用固定色而不是跟随主题：favicon 在浏览器
       标签栏里不受页面明暗影响，亮黄在浅色和深色标签栏上都清楚。 -->
  <rect width="24" height="24" rx="5.5" fill="#ffd000" />
  <g
    transform="translate(12 12) scale(0.66) translate(-12 -12)"
    fill="none"
    stroke="#111111"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
    <path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6" />
    <rect x="6" y="14" width="12" height="8" rx="1" />
  </g>
</svg>
