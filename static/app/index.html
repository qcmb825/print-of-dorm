<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 界面锁定亮色（业主的要求，2026-09-21）：声明成 light，浏览器自带的控件
         （滚动条、表单、日期选择器）才跟着亮，否则系统是暗色时它们会自己变暗，
         在一片浅色里格外突兀。 -->
    <meta name="color-scheme" content="light" />
    <!-- 地址栏/状态栏的颜色跟着**开屏层**走（那一层是刻意的恒暗设计），
         不是跟主题走 —— 开屏结束时它已经被浏览器取过一次了。 -->
    <meta name="theme-color" content="#050505" />
    <!-- 有图标之后浏览器就不会再去请求 /favicon.ico 了。
         少了这一行，每次整页加载都会留下一条 404（被打成 WARNING 记进访问日志）。 -->
    <link rel="icon" type="image/svg+xml" href="/static/app/favicon.svg" />
    <title>猫娘打印服务</title>
    <script>
      // 界面**锁定亮色**（2026-09-21，业主的要求：网页一律亮色，不跟系统走）。
      // 这一段必须在 CSS 之前跑：它的活儿是防 FOUC —— 以前读的是
      // 「localStorage 的 pod-theme，没有就跟随系统」，现在两边都不读了，
      // 只做一件事：把可能残留在 HTML 上的 dark 类摘掉、把 color-scheme 钉成 light。
      // 摘 class 而不是什么都不做：老用户浏览器里可能还留着上个版本写下的
      // `html.dark`（那是当时 toggle 落下的），不摘就是一块黑底配浅色令牌。
      try {
        document.documentElement.classList.remove('dark')
        document.documentElement.style.colorScheme = 'light'
      } catch (e) {}
    </script>

    <!-- ══ 开屏层 ══════════════════════════════════════════════════════════════
         整站启动时盖住屏幕的那一块：把首屏盖住、把启动进度读出来，最后像换场那样
         用一块斜切面板扫开，把页面让出来。

         **为什么它写在 index.html 里，而不是做成 Vue 组件**
         它要盖住的正是「CSS 与 JS 产物还没到」的那一段 —— 宿舍 wifi 上这段是整次加载
         里最长的一截。做成组件的话，它只能在应用挂载之后才出现，那之前屏幕仍然是白的，
         等于没盖。
         代价是这一层读不到 tokens.css / base.css（那时还没解析到），所以下面这段自带
         排版与颜色，**与样式表无关地自成一体的**；只有出场那一下例外 —— 那时样式表一定
         已经装上了，于是它交给 base.css 去写，好与换场面板共用同一套几何与时长
         （见 base.css 的 .boot__*）。

         几条与站内一致的纪律：
         · 会动的读数不进朗读流（视觉部分整块 aria-hidden），只留一句 sr-only 给读屏；
         · 读数**必须是真的**：下面三行里程碑各自对应一件真实发生过的事
           （产物执行完 / 字体就位 / 应用报出第一帧），没有一行是定时器编出来的；
         · 参考站那一屏的语汇是"仪表在自检"，本站的对应物是刻度、机读读数、
           一条竖着的进度柱与右下的三角阵列；
         · 减少动效下不做横扫（与换场同一个判断，理由见 base.css）。
    ═══════════════════════════════════════════════════════════════════════ -->
    <style>.boot{z-index:200;touch-action:none;-webkit-font-smoothing:antialiased;width:100%;height:100dvh;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace;position:fixed;top:0;left:0;overflow:hidden}.boot__mat,.boot__under{width:124%;position:absolute;top:0;bottom:0;left:-12%}.boot__mat{background-color:#050505}.boot__under{background-color:#fffa00}.boot__hud{color:#fff;font-family:system-ui,-apple-system,Segoe UI,Microsoft YaHei,sans-serif;position:absolute;inset:0}.boot__frame{border:1px solid #ffffff1a;position:absolute;inset:14px}.boot__top,.boot__band{letter-spacing:.16em;text-transform:uppercase;color:#fff6;flex-wrap:wrap;align-items:baseline;gap:4px 14px;font-size:11px;display:flex;position:absolute;left:26px;right:26px}.boot__top{top:26px}.boot__band{bottom:22px}.boot__cn{letter-spacing:.06em;color:#ffffffc7;font-size:13px}.boot__right{margin-left:auto}.boot__foot{position:absolute;bottom:54px;left:26px}.boot__tri{gap:5px;margin-bottom:12px;display:flex}.boot__tri>i{clip-path:polygon(0 100%,0 0,100% 100%);background-color:#fffa00;width:9px;height:9px}.boot__tri>.is-blank{background-color:#0000}.boot__num{letter-spacing:-.02em;color:#fffa00;font-variant-numeric:tabular-nums;align-items:baseline;font-size:clamp(44px,7vw,76px);font-weight:700;line-height:.9;display:flex}.boot__num>span{text-align:right;min-width:3ch;display:inline-block}.boot__num>b{letter-spacing:.06em;font-size:.34em;font-weight:700}.boot__cap{margin-top:10px;display:block}.boot__fill{width:6px;height:100%;transform:scaleY(var(--boot-p,0));transform-origin:top;background-color:#fffa00;position:absolute;top:0;left:0}.boot__log{letter-spacing:.16em;text-transform:uppercase;flex-direction:column;gap:7px;margin:0;padding:0;font-size:11px;list-style:none;display:flex;position:absolute;bottom:54px;right:26px}.boot__row{color:#ffffff5c;align-items:center;gap:8px;display:flex}.boot__row>i{border:1px solid #ffffff52;width:5px;height:5px}.boot__row>b{font-weight:600}.boot__row>span{margin-left:auto}.boot__row[data-state=ok]{color:#ffffffa8}.boot__row[data-state=ok]>i{background-color:#fffa00;border-color:#fffa00}.boot__row[data-state=ok]>span{color:#fffa00}@keyframes boot-in{0%{opacity:0;transform:translateY(8px)}}.boot__in{animation:.24s cubic-bezier(.23,1,.32,1) both boot-in;animation-delay:var(--d,0s)}.boot__sr{clip:rect(0 0 0 0);white-space:nowrap;width:1px;height:1px;position:absolute;overflow:hidden}@media (prefers-reduced-motion:reduce){.boot__in{animation:none}}</style>
    <script type="module" crossorigin src="/static/app/assets/index-C68jqRF6.js"></script>
    <link rel="modulepreload" crossorigin href="/static/app/assets/endpoints-ENJhMWK2.js">
    <link rel="modulepreload" crossorigin href="/static/app/assets/createLucideIcon-BuHP6xwY.js">
    <link rel="modulepreload" crossorigin href="/static/app/assets/pinia-DtTDOAon.js">
    <link rel="modulepreload" crossorigin href="/static/app/assets/light-D5Skne_7.js">
    <link rel="modulepreload" crossorigin href="/static/app/assets/preload-helper-BVe9q52S.js">
    <link rel="stylesheet" crossorigin href="/static/app/assets/index-ZIMN6Y2p.css">
  </head>
  <body>
    <div id="boot" class="boot" role="status">
      <span class="boot__sr">正在接入服务</span>

      <!-- 黄层写在**前**：同一层叠层下 DOM 顺序就是绘制顺序，它必须垫在黑层下面。 -->
      <i class="boot__under" aria-hidden="true"></i>
      <i class="boot__mat" aria-hidden="true"></i>

      <div class="boot__hud" aria-hidden="true">
        <i class="boot__frame boot__in" style="--d: 0ms"></i>
        <i class="boot__fill boot__in" style="--d: 120ms"></i>

        <div class="boot__top boot__in" style="--d: 40ms">
          <span class="boot__cn">正在接入</span>
          <span>NEKO PRINT SERVICE</span>
          <span class="boot__right">SEC 00</span>
        </div>

        <ul class="boot__log boot__in" style="--d: 160ms">
          <li class="boot__row" data-step="bundle"><i></i><b>BUNDLE</b><span>--</span></li>
          <li class="boot__row" data-step="fonts"><i></i><b>FONTS</b><span>--</span></li>
          <li class="boot__row" data-step="session"><i></i><b>SESSION</b><span>--</span></li>
        </ul>

        <div class="boot__foot boot__in" style="--d: 80ms">
          <span class="boot__tri"><i></i><i class="is-blank"></i><i></i></span>
          <div class="boot__num"><span id="boot-pct">0</span><b>%</b></div>
          <span class="boot__cap" id="boot-cap">LOADING</span>
        </div>

        <div class="boot__band boot__in" style="--d: 200ms">
          <span>猫娘打印服务 · NEKO PRINT SERVICE</span>
          <span class="boot__right">SEC 00</span>
        </div>
      </div>

      <noscript>
        <style>#boot{display:none}</style>
      </noscript>
    </div>

    <div id="app"></div>

    <script>
      /* 开屏层的控制器。三件事：把真实里程碑换算成进度、把读数画出来、到点出场。
       *
       * 进度不是定时器编的：四个目标值各自对应一件真的发生过的事。所以"卡在 60%"
       * 是个有意义的状态（产物到了、应用还没起来），而不是一句安慰。
       *
       * 出场由应用放行：App.vue 在第一帧内容真的画出来之后往 <html> 上写
       * data-boot="ready"（与 data-veil-phase / data-receipt 同一套跨层通信），
       * 这里轮询它 —— 开屏层在应用之前执行，改成事件就得反过来依赖加载顺序。 */
      ;(function () {
        var boot = document.getElementById('boot')
        if (!boot) return

        var num = document.getElementById('boot-pct')
        var cap = document.getElementById('boot-cap')
        var root = document.documentElement

        var START = 6
        // 开屏层的**最短播放时长**。业主的要求：加载快（本机常常几百毫秒就起来了）
        // 也要把这段动画播完，否则那一眼只是"闪了一下黑"；加载真的慢时不受它影响，
        // 按真实进度走（下面 frame 里那条 timeCurve 只负责"托底"，不负责"催"）。
        // 取 1500ms：六块读数 240ms 落位之后，还剩一秒多由进度柱和读数在走 ——
        // 那段不是空转，--boot-p 一直在动，看着就是"在读盘"。
        var MIN_MS = 1500
        var WATCHDOG_MS = 8000 // 产物 404 / 脚本挂了时，用户不能被锁在开屏层里
        var EXIT_FALLBACK_MS = 1200 // 出场动画的兜底时长（那份样式没到时也要能摘掉这一层）

        var t0 = performance.now()
        var target = START
        var shown = START
        var last = t0
        var lastInt = -1
        var ready = false
        var exiting = false

        function mark(name, ok) {
          var row = boot.querySelector('[data-step="' + name + '"]')
          if (!row) return
          row.setAttribute('data-state', ok ? 'ok' : 'wait')
          row.lastElementChild.textContent = ok ? 'OK' : '--'
        }

        function bump(to) {
          if (to > target) target = to
        }

        // 1. 产物执行完（type=module 一定在 DOMContentLoaded 之前跑完）—— 应用该挂上了
        function onBundle() {
          mark('bundle', true)
          bump(35)
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', onBundle)
        else onBundle()

        // 2. 所有子资源到齐
        window.addEventListener('load', function () {
          bump(60)
        })

        // 3. 字体就位（中文字体是分片的，窄带上这一段并不短）
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            mark('fonts', true)
            bump(85)
          })
        } else {
          mark('fonts', true)
          bump(85)
        }

        function exit() {
          if (exiting) return
          exiting = true
          boot.setAttribute('data-phase', 'exit')
          cap.textContent = 'READY'

          // 摘除时机：面板扫完的那一刻。**听 transitionend 而不是定时器** ——
          // 定时器要猜一个时长，而那个时长归 base.css 的令牌管；猜短了会把还在扫的面板
          // 掐掉（露一半），猜长了这一层会在页面上多留一会儿。
          var mat = boot.querySelector('.boot__mat')
          var removed = false
          function finish() {
            if (removed) return
            removed = true
            boot.style.transition = 'opacity 160ms linear'
            boot.style.opacity = '0'
            window.setTimeout(function () {
              boot.remove()
            }, 200)
          }
          if (mat) {
            mat.addEventListener('transitionend', function (event) {
              if (event.propertyName === 'transform') finish()
            })
          }
          // 兜底：出场那几条规则在 base.css 里，万一那份样式没到（或者被拦了），
          // 上面那个事件永远不会来，这里也得把这一层收掉 —— 否则就是一块永远盖着的黑。
          window.setTimeout(finish, EXIT_FALLBACK_MS)
        }

        function frame(now) {
          if (exiting) return
          var elapsed = now - t0

          // 应用放行（见上面注释）。轮询而不是监听事件：开屏层先于应用执行，
          // 事件可能在我们挂上监听之前就已经发过了。
          if (!ready && elapsed > 120 && root.dataset.boot === 'ready') {
            ready = true
            mark('session', true)
            bump(100)
          }

          // 指数逼近：每帧吃掉剩余距离的一部分。与站内视差的平滑同一个手法 ——
          // 帧率无关，也不会像线性插值那样"匀速跳到目标值"。
          var dt = Math.min(now - last, 64)
          last = now
          shown += (target - shown) * (1 - Math.pow(0.001, dt / 420))
          if (target - shown < 0.4) shown = target

          // 「最短播放时长」就靠这一条实现：另画一条**按时间走**的曲线
          // （START → 100，线性，正好在 MIN_MS 那一刻到顶），显示值取它与真实进度的
          // **较小者**。
          //   · 加载快（target 早早到 100）：时间曲线压着走 → 整整 1.5 秒播满；
          //   · 加载慢（target 卡在 60）：min 取的是真实进度 → 跟着加载走，不虚报。
          // 注意是 min 不是 max —— 写成 max 就成了"最慢也要 1.5 秒"，
          // 而慢加载会被硬拉到 100，那是编数，不是读盘。
          var timeCurve = START + (100 - START) * Math.min(1, elapsed / MIN_MS)
          // 加载已经完成（target 到 100）且时间也走满了：直接落到 100。
          // 不这一下的话，指数逼近还差最后几个点（1500ms 时约 97），
          // 于是"最短 1.5 秒"实际会拖成 1.7 秒 —— 而那一秒里数字是不动的，
          // 读起来像卡住了，不像读完。
          if (target >= 100 && elapsed >= MIN_MS) shown = 100
          var display = Math.min(shown, timeCurve)

          var value = Math.floor(display)
          if (value !== lastInt) {
            lastInt = value
            num.textContent = String(value)
          }
          boot.style.setProperty('--boot-p', String(display / 100))

          // 出场等读数真的落在 100 上（而不是等目标值）：否则面板会在数字还停在 93 的
          // 时候就扫开 —— 那一眼就是整屏唯一的破绽。
          if (display >= 100 && elapsed >= MIN_MS) {
            exit()
            return
          }
          if (elapsed > WATCHDOG_MS) {
            exit()
            return
          }
          requestAnimationFrame(frame)
        }

        requestAnimationFrame(frame)
      })()
    </script>

  </body>
</html>
