<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#050505" />
    <!-- 有图标之后浏览器就不会再去请求 /favicon.ico 了。
         少了这一行，每次整页加载都会留下一条 404（被打成 WARNING 记进访问日志）。 -->
    <link rel="icon" type="image/svg+xml" href="/static/app/favicon.svg" />
    <title>小猫娘打印服务</title>
    <script>
      // 在首屏绘制前定好主题，避免刷新时闪一下白底（FOUC）。
      try {
        var saved = localStorage.getItem('pod-theme')
        var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/static/app/assets/index-BMaEOz3J.js"></script>
    <link rel="modulepreload" crossorigin href="/static/app/assets/endpoints-BvEVWgoh.js">
    <link rel="modulepreload" crossorigin href="/static/app/assets/light-DD61Rr_I.js">
    <link rel="modulepreload" crossorigin href="/static/app/assets/fade-in-scale-up.cssr-Bwy9Q-pZ.js">
    <link rel="stylesheet" crossorigin href="/static/app/assets/index-CkyYGugZ.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
