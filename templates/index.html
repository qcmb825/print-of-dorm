            const msg = el('div', { class: 'msg span-all', id: 'registerMsg' });
            const btn = el('button', { type: 'submit', class: 'span-all', text: '注册并登录', style: 'width:100%;margin-top:10px;' });
            form.appendChild(btn);
            form.appendChild(msg);

            const fields = [nickname, realName, studentId, dorm, contactType, contact, password, confirm];
            // 报错同时做三件事：写进统一提示条、把错误挂到具体字段上、把光标送过去
            const warn = (text, focusEl) => {
                msg.className = 'msg err';
                msg.textContent = '❌ ' + text;
                fields.forEach(f => f.removeAttribute('aria-invalid'));
                markInvalid(focusEl || contact, 'registerMsg');
                if (focusEl) focusEl.focus();   // 光标直接跳到出错的那一栏，不用自己找
            };
            // 提交期间锁住整张表单，避免连点两次重复提交
            const setBusy = (busy) => {
                fields.forEach(f => { f.disabled = busy; });
                btn.disabled = busy;
                if (!busy) applyContactHint();  // 解锁后由它把联系方式输入框恢复成正确状态
            };
            fields.forEach(f => f.addEventListener('input', () => {
                if (msg.classList.contains('err')) {
                    msg.className = 'msg';
                    msg.textContent = '';
                    clearInvalid(form);
                }
            }));

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                // 先在本地把能查出来的问题查掉，少一次往返；后端还会再校验一遍
                const info = CONTACT_HINTS[contactType.value];
                if (!info) {
                    warn('请选择联系方式类型', contactType);
                    return;
                }
                if (!contact.value.trim()) {
                    warn('请填写' + info.label, contact);
                    return;
                }
                if (!info.re.test(contact.value.trim())) {
                    warn(info.reMsg, contact);
                    return;
                }
                if (password.value !== confirm.value) {
                    warn('两次输入的密码不一致', confirm);
                    return;
                }
                setBusy(true);
                msg.className = 'msg';
                msg.textContent = '⏳ 提交中…';
                const data = await api('/api/register', {
                    method: 'POST',
                    body: JSON.stringify({
                        nickname: nickname.value.trim(),
                        real_name: realName.value.trim(),
                        student_id: studentId.value.trim(),
                        dorm: dorm.value.trim(),
                        contact_type: contactType.value,
                        contact: contact.value.trim(),
                        password: password.value,
                        confirm_password: confirm.value,
                    }),
                });
                if (data.code === 0) {
                    state.user = data.user;
                    msg.textContent = '';
                    loadNoticePrefs();
                    await refreshAll();
                } else {
                    msg.className = 'msg err';
                    msg.textContent = '❌ ' + (data.msg || '注册失败');
                }
                setBusy(false);
            });
            return form;
        }

        // ==== 主界面：侧边栏 + 单页内容 ====
        // 页面清单写成一张表，而不是一串 if：
        //   「谁能看到哪些页」一眼能看完，加一页只改这一处；
        //   导航栏和内容区读的是同一份数据，也就不可能出现
        //   「导航里有一项、点进去却是空白」这种最让人恼火的不一致。
        const PAGES = {
            user: [
                { key: 'upload', icon: '📤', label: '上传下单',
                  desc: '选文件、挑颜色和单双面，提交后等取件通知。',
                  render: uploadCard },
                { key: 'myorders', icon: '📋', label: '我的订单',
                  desc: '自己提交过的订单和单号。',
                  render: myOrdersCard, load: loadMyOrders },
                { key: 'mystats', icon: '📊', label: '我的数据',
                  desc: '自己一共打了多少、取件进度，还有全站的累计数字。',
                  render: myStatsCard, load: loadMyStats },
                { key: 'tickets', icon: '💬', label: '工单',
                  desc: '文件有问题、取件找不到，在这里和客服沟通。',
                  render: () => ticketsCard(false), load: loadTickets },
                { key: 'notice', icon: '📢', label: '公告',
                  desc: '全部公告，最新的在最上面。弹窗提醒最多 3 次，之后只在这里更新。',
                  render: noticeFeedCard, load: loadNoticeFeed },
            ],
            staff: [
                // 概览排第一位，不是随手放的：currentPage() 找不到 section 时会退回第一页，
                // 所以列表里的顺序 = 登录后先看到什么。而「先看数字、再决定做什么」
                // 本来就是管理这边更自然的顺序 —— 一眼扫到待接单还积着几单，
                // 才会想到去订单页；直接把人丢进订单表，他要先自己从表里数。
                { key: 'overview', icon: '📊', label: '数据概览',
                  desc: '近两周的下单走势、账号增长和两个排行榜。',
                  render: overviewPage, load: loadOverview },
                { key: 'orders', icon: '🖨️', label: '订单管理',
                  desc: '接单、改状态、下载文件。',
                  render: ordersPage, load: loadOrdersPage },
                { key: 'users', icon: '👥', label: '账号管理',
                  desc: '全部注册账号，以及他们各自的下单和接单情况。',
                  render: usersCard, load: loadUsers },
                { key: 'tickets', icon: '💬', label: '工单',
                  desc: '用户发来的工单，在这里回复和关闭。',
                  render: () => ticketsCard(true), load: loadTickets },
                { key: 'notice', icon: '📢', label: '公告管理',
                  desc: '发布、修改、停用公告。',
                  render: announcementAdminCard, load: loadAnnouncementsAdmin },
            ],
        };

        function pagesFor() {
            // 用「不等于 user」判断，而不是「等于 admin」：
            // 万一以后真加了第三种角色，默认落到管理侧只是多一页，
            // 而默认落到用户侧意味着普通用户可能看到不该看的。
            // 默认值往保守的方向偏，是权限相关代码的通用习惯。
            return state.user && state.user.role !== 'user' ? PAGES.staff : PAGES.user;
        }

        // 当前该显示哪一页。section 为空、或对不上任何一页（换了角色、页面被删掉）时
        // 退回第一页，保证「当前页」永远有一个有效落点，不会渲染出空白主区。
        function currentPage() {
            const pages = pagesFor();
            return pages.find(p => p.key === state.section) || pages[0];
        }

        function switchSection(key) {
            if (state.section === key) return;   // 点当前页不重绘，避免白闪一下
            state.section = key;
            redraw();
        }

        function sidebar() {
            const page = currentPage();
            const nav = el('nav', { class: 'side', 'aria-label': '主导航' });
            const list = el('div', { class: 'side-nav' });
            pagesFor().forEach(p => {
                list.appendChild(el('button', {
                    type: 'button', class: 'hit', 'data-fk': 'nav-' + p.key,
                    // aria-current="page" 是「当前页」的标准说法：读屏软件会念「当前页」，
                    // 视觉上我们也拿它当选中的钩子。同一个属性同时驱动「看」和「听」，
                    // 就不会出现「看着是选中、读出来不是」的错位 —— 这也是不另设
                    // .is-active 类的原因，两种真相迟早会打架。
                    'aria-current': p.key === page.key ? 'page' : false,
                    onclick: () => switchSection(p.key),
                }, [
                    el('span', { class: 'si', 'aria-hidden': 'true', text: p.icon }),
                    el('span', { text: p.label }),
                ]));
            });
            nav.appendChild(list);
            // 版本号。id 只发给带高级视图的账号 —— 没有 id，绑定的代码就找不到挂点。
            //
            // 用「干脆不设这个 id」而不是在事件里判一下再 return：
            // 事件判早退的话，那一串 pointerdown / pointerup / dblclick 监听照样挂在元素上，
            // 「按了没用」和「根本没接上」在行为上一样，但后者不需要再想
            // 「有没有哪种输入方式绕过某个分支」。能靠结构解决的事，就别交给分支。
            //
            // 挑这个位置的原因没变：在导航最底部、字号全站最小、内容最没有信息量。
            // 正常使用谁都不会去碰它，但真要用的时候又不至于藏到自己都找不到。
            nav.appendChild(el('p', {
                id: canUseAdvanced() ? 'sideFoot' : null,
                class: 'muted',
                style: 'margin:var(--sp-2) 0 0; padding:2px 10px; font-size:var(--fs-xs);' +
                       'cursor:default; user-select:none; -webkit-user-select:none;',
                text: 'v1.0',
            }));
            return nav;
        }

        // 订单管理页 = 只有订单表格。
        // 统计原来挂在这一页下面，现在挪去独立的「数据概览」：
        // 两件事的节奏不一样。看订单是「处理某一单」，动作密集、页面在不停重建；
        // 看统计是「扫一眼整体情况」，安静、不需要点任何东西。
        // 挤在一页里，每接一单都要把整块图表重算重画一遍，白费力气还闪。
        function ordersPage() {
            return orderAdminCard();
        }

        async function loadOrdersPage() {
            await loadOrders();
        }

        // 写完一条数据之后，把「当前这一页」重新拉一遍。
        // 以前这里是挨个点名要刷新的几个接口：
        // 页面一挪位置，就得把所有调用点翻出来改一遍，漏一个就是「改完没反应」。
        // 统一走 currentPage().load 之后，加页减页都不用再碰这些函数。
        // （load 是可选的：纯静态页没有它，所以要先判一下。）
        async function reloadCurrent() {
            const page = currentPage();
            if (page && page.load) await page.load();
        }

        function renderApp() {
            const app = $('app');
            app.textContent = '';
            const u = state.user;

            // 顺手把不符合条件的高级视图状态清掉。
            // 为什么放在这里：state.advanced 只活在内存里，而 state.user 会变
            // （退出再登另一个账号、换账号刷新）。要是上一个人留下了 true，
            // 下一个人虽然拿不到入口，却会直接把高级视图的成果渲染出来 ——
            // 入口藏了、东西还在，等于白藏。
            // 放在 renderApp 开头，是因为下面 page.render() 马上就要读它。
            if (!canUseAdvanced()) {
                state.advanced = false;
                state.showDetails = false;
            }

            const bar = el('div', { class: 'topbar' });
            bar.appendChild(el('h1', { text: '🖨️ 小猫娘打印服务' }));
            // 徽章的角色值走 publicRole()：服务端的 /api/me 只回 user / admin 两种，
            // 这里再兜一层底 —— 万一以后哪个接口漏出了意外的角色值，
            // 界面也只会显示「管理员」，而不是老老实实把那个词印在屏幕上。
            bar.appendChild(el('span', {
                class: 'role-badge role-' + publicRole(u.role), text: roleLabel(u.role),
            }));
            // 姓名 / 宿舍都允许留空（内置账号就是空的），空的部分直接不显示，
            // 否则会渲染成 qcmb（）· 这种悬空括号加悬空分隔符
            const info = (u.real_name ? '（' + u.real_name + '）' : '') + (u.dorm ? ' · ' + u.dorm : '');
            bar.appendChild(el('span', { class: 'muted', text: u.nickname + info }));
            bar.appendChild(el('div', { class: 'spacer' }));
            // 换一套界面。必须是整页跳转：两套界面是两份完全不同的代码
            // （这一份是 Jinja 渲染出来的单文件，另一份是 Vue 打包产物），
            // 靠改 DOM 切不过去，只能带上 ?ui= 让后端重新发一次页面。
            // 后端看到参数会把它写进 pod-ui Cookie，后续请求就跟着走了。
            bar.appendChild(el('button', {
                class: 'ghost',
                text: '🎨 换个界面',
                title: '切换到新版界面',
                onclick: () => { location.href = '/?ui=vue'; },
            }));
            bar.appendChild(el('button', { class: 'ghost', text: '退出登录', onclick: logout }));
            app.appendChild(bar);

            const layout = el('div', { class: 'layout' });
            layout.appendChild(sidebar());

            const content = el('div', { class: 'content' });
            const page = currentPage();
            const head = el('div', { class: 'page-head' });
            // 页面标题用 h2：顶栏的品牌名是 h1，一页里只应该有一个 h1。
            // 有了这行标题，切页之后「我现在在哪」不需要靠侧边栏的高亮去猜。
            head.appendChild(el('h2', { class: 'page-title', text: page.icon + ' ' + page.label }));
            if (page.desc) head.appendChild(el('p', { class: 'muted page-desc', text: page.desc }));
            content.appendChild(head);
            content.appendChild(page.render());
            layout.appendChild(content);
            app.appendChild(layout);

            bindHiddenEntry();
        }

        // ==== 高级视图的入口 =====
        // 判断依据是 user.advanced 这个布尔值 —— 它描述的是「这个账号的界面
        // 多不多一个开关」，不是「这个人有多大权限」。
        //
        // 为什么不换成角色判断：前端从头到尾只认识 user / admin 两种角色，
        // 一旦按角色分叉，两套界面之间的差异就得一直手动对齐；
        // 而高级视图本来就只是同一套界面多两列数据。
        //
        // 另外，这个入口是「少给一个按钮」，不是「安全措施」。代码跟着页面一起发到浏览器，
        // 按 F12 都能读到。真正拦住人的是服务端的 @roles_required：
        // 账号没有这个入口却硬把界面调出来，点下去也只会收到 403。
        // 把「看不见」和「做不了」当成两件事，才不会哪天误以为藏起来就等于安全了。
        function canUseAdvanced() {
            return !!(state.user && state.user.advanced);
        }

        // 「现在到底要不要显示高级视图」的唯一判断点：账号本身带这个入口，而且这一趟已经打开了。
        // 集中成一个函数，是为了避免以后有人在别处直接读 state.advanced ——
        // 那样就会漏掉前半个条件，让没有入口的账号也被渲染出高级视图。
        function advancedUI() {
            return canUseAdvanced() && state.advanced;
        }

        // ==== 高级视图的开关：绑在侧边栏底部那行版本号上（具体按法见下面的监听器）====
        // 打开之后，账号管理页才会多出操作列和明细开关。
        //
        // 为什么选长按而不是快捷键：Windows 上连按 Shift 五次会触发粘滞键，
        // Alt+Shift 会切输入法，Ctrl+Alt 等于 AltGr —— 键盘组合几乎都被人占了。
        // 长按不跟任何人抢，而且必须停在一段毫不起眼的文字上不动一秒半，
        // 正常操作不可能误触。
        const HIDDEN_HOLD_MS = 1500;
        let hiddenHoldTimer = null;

        function bindHiddenEntry() {
            const foot = $('sideFoot');
            // 没有这个 id 的账号走到这里就结束了：入口等于不存在，一个监听器也不用挂。
            // 这是整个「不设 id」方案的关键一步 —— 判断只发生在要不要生成元素的时候，
            // 之后的事件代码完全不知道有这回事，也就不需要处处防守
            if (!foot) return;
            const cancel = () => { clearTimeout(hiddenHoldTimer); hiddenHoldTimer = null; };
            const arm = () => {
                cancel();
                // 计时器而不是 pointerdown 立刻触发：必须「按住不动」，
                // 拖着鼠标划过这段文字不会把它碰开
                hiddenHoldTimer = window.setTimeout(() => { hiddenHoldTimer = null; toggleAdvanced(); }, HIDDEN_HOLD_MS);
            };
            foot.addEventListener('pointerdown', arm);
            foot.addEventListener('pointerup', cancel);
            foot.addEventListener('pointerleave', cancel);
            foot.addEventListener('pointercancel', cancel);
            // 触屏长按和右键都会顺带弹系统菜单，先按住，不然会盖在页面上
            foot.addEventListener('contextmenu', e => e.preventDefault());
            // 再加上双击：比长按好按，两者都是「刻意做才会发生」的动作。
            // 留两条路是因为这个入口没有任何提示，万一某台设备的长按被系统吃掉，
            // 你至少还有另一种按法能进去。
            foot.addEventListener('dblclick', toggleAdvanced);
        }

        function toggleAdvanced() {
            // 守卫放在函数里面，而不是只靠「没绑事件就没人调」。
            // 绑定是可以绕过的（控制台里直接敲一遍 toggleAdvanced() 就行），
            // 判断放在这里，「按了也没用」就是唯一可能的行为，
            // 不需要再去数有几种绕过去的姿势。
            if (!canUseAdvanced()) return;
            state.advanced = !state.advanced;
            // 关掉高级模式时顺手把明细列也收起来。
            // 不然「明细」开关会随着人一起消失，可那一列的数据还留在屏幕上。
            if (!state.advanced) state.showDetails = false;
            toast(state.advanced ? '已切换到高级视图' : '已退出高级视图', 'ok');
            redraw();
        }

        function orderRow(o) {
            const tr = el('tr');
            tr.appendChild(td(o.id));
            // 归属为空和「已注销」是两回事，别写成同一句话：
            // 注销的账号名字还在（后端会加后缀），这里为空只意味着这条订单
            // 找不到对应的账号行（历史数据里 user_id 指向的账号已经没了）。
            // 写成「账号已注销」会把数据缺失说成一次正常操作，查起来就被带偏了。
            tr.appendChild(td(o.owner_nickname || '（无归属）'));
            tr.appendChild(td(o.owner_dorm || '-'));
            tr.appendChild(td(o.filename));
            tr.appendChild(td(colorLabel(o.color_type) + ' / ' + duplexLabel(o.duplex)));
            tr.appendChild(td(o.remark || '-'));
            tr.appendChild(el('td', {}, [statusBadge(o.status)]));
            tr.appendChild(td(o.claimer_nickname || '待接单'));
            tr.appendChild(td(o.create_time || ''));

            const actions = el('div', { class: 'row-actions' });
            // 行内按钮的视觉保持紧凑，热区由 .hit 撑到 44×44。
            // aria-label 补上订单号：读屏软件念到一排「接单」时分不清是哪一单。
            if (o.claimed_by == null) {
                actions.appendChild(el('button', { class: 'hit', text: '✋ 接单', 'aria-label': '接单，订单 ' + o.id,
                    onclick: () => claimOrder(o.id) }));
            } else if (o.status !== '已取件' && (o.is_mine || advancedUI())) {
                // 别人的单能不能释放，前端不靠角色判断，靠的是「当前是不是高级视图」。
                // 账号没带这个入口、或者硬把界面调出来，点下去也只会拿到服务端的 403 ——
                // 界面上多不多一个按钮，和这一步能不能做成，是两件事。
                //
                // 已取件是终态，不摆释放按钮：这单已经打完也被取走了，
                // 再退回待接单池就成了「已完成的单又等人来接」。服务端也拦着。
                actions.appendChild(el('button', { class: 'ghost hit', text: '释放', 'aria-label': '释放订单 ' + o.id,
                    onclick: () => releaseOrder(o.id) }));
            }
            if (o.can_manage) {
                STATUSES.forEach(s => {
                    if (s === o.status) return;
                    actions.appendChild(el('button', { class: 'soft hit', text: '→ ' + s,
                        'aria-label': '把订单 ' + o.id + ' 改为' + s, onclick: () => updateStatus(o.id, s) }));
                });
                actions.appendChild(el('button', { class: 'ghost hit', text: '⬇ 下载',
                    'aria-label': '下载订单 ' + o.id + ' 的文件', onclick: () => downloadOrder(o.id) }));
            } else if (o.claimed_by != null) {
                actions.appendChild(el('span', { class: 'muted', text: '已被他人接单，无权操作' }));
            }
            tr.appendChild(el('td', { class: 'col-actions' }, [actions]));
            return tr;
        }

        // 翻页控件。只有一页的时候整个不出现：一页装得下还给两个按不动的按钮，
        // 只会让人多疑心一下「是不是还有下一页」。
        function renderOrderPager(total, size) {
            const box = $('orderPager');
            if (!box) return;
            const sig = total + '/' + size + '/' + state.orderPage;
            // 数字没变就不重建：列表每 10 秒自动刷一次，每次都把按钮换成新的，
            // 手指刚好落上去就会点空。
            if (box.dataset.sig === sig) return;
            box.dataset.sig = sig;
            box.textContent = '';
            if (!total || !size || total <= size) return;
            const pages = Math.ceil(total / size);
            box.appendChild(el('button', { class: 'ghost', text: '← 上一页', disabled: state.orderPage <= 1,
                onclick: () => { state.orderPage -= 1; loadOrders(); } }));
            box.appendChild(el('span', { class: 'muted', text: '第 ' + state.orderPage + ' / ' + pages + ' 页' }));
            box.appendChild(el('button', { class: 'ghost', text: '下一页 →', disabled: state.orderPage >= pages,
                onclick: () => { state.orderPage += 1; loadOrders(); } }));
        }

        async function loadOrders() {
            const tbody = $('orderBody');
            if (!tbody) return;
            tbody.setAttribute('aria-busy', 'true');
            // 只在第一次（或筛选后列表变空）时摆加载提示；10 秒一次的自动刷新不再闪
            showLoading(tbody, () => tableLoadingRow(10, '订单加载中'));
            const params = new URLSearchParams({
                size: String(ORDER_PAGE_SIZE), page: String(state.orderPage), scope: state.orderScope,
            });
            if (state.orderStatus) params.set('status', state.orderStatus);
            const data = await api('/api/orders?' + params.toString());
            tbody.textContent = '';
            tbody.removeAttribute('aria-busy');
            if (data.code !== 0) {
                setMsg('orderMsg', '❌ ' + (data.msg || '加载失败'), 'err');
                tbody.appendChild(tableEmptyRow(10, '加载失败', '⚠️'));
            } else if (data.total > 0 && !data.orders.length && state.orderPage > 1) {
                // 当前页被刷空了。数据变少不会自动把页码改小，state.orderPage 还停在旧值上，
                // 界面就会顶着「共 8 条订单」显示一张空表。退回最后一页再拉一次。
                state.orderPage = Math.max(1, Math.ceil(data.total / data.size));
                return loadOrders();
            } else {
                const pages = Math.max(1, Math.ceil(data.total / data.size));
                // 「共 N 条」是中性状态，不是成功消息，别用绿色
                setMsg('orderMsg', data.total > data.size
                    ? '共 ' + data.total + ' 条订单·第 ' + data.page + '/' + pages + ' 页'
                    : '共 ' + data.total + ' 条订单', '');
                if (!data.orders.length) {
                    tbody.appendChild(tableEmptyRow(10, '没有符合条件的订单', '📭'));
                } else {
                    data.orders.forEach(o => tbody.appendChild(orderRow(o)));
                }
            }
            renderOrderPager(data.total, data.size);
            annotateTable(tbody.closest('table'));
            syncTableScrollers();
        }

        async function claimOrder(id) {
            const data = await api('/api/order/' + id + '/claim', { method: 'POST' });
            if (!reportResult('orderMsg', data)) return;
            await reloadCurrent();
        }

        async function releaseOrder(id) {
            if (!window.confirm('确定释放订单 #' + id + ' 吗？释放后其他管理员可以接单。')) return;
            const data = await api('/api/order/' + id + '/release', { method: 'POST' });
            if (!reportResult('orderMsg', data)) return;
            await reloadCurrent();
        }

        // 撤单：撤掉的是自己下的、还没人接的单。
        // 服务端还会再查一次「是不是本人的单、是不是没人接」——
        // 和别处一样，界面上有没有这个按钮，和这一步能不能做成，是两件事。
        async function withdrawOrder(id) {
            if (!window.confirm('确定撤回订单 #' + id + ' 吗？\n订单和已上传的文件会一起删除，不能恢复。')) return;
            const data = await api('/api/order/' + id + '/withdraw', { method: 'POST' });
            if (!reportResult('myOrderMsg', data)) return;

        }

        async function updateStatus(id, status) {
            const data = await api('/api/order/' + id + '/status', {
                method: 'PUT', body: JSON.stringify({ status: status }),
            });
            if (!reportResult('orderMsg', data)) return;
            await reloadCurrent();
        }

        function filenameFromDisposition(cd) {
            if (!cd) return null;
            let m = /filename\*=UTF-8''([^;]+)/i.exec(cd);
            if (m) { try { return decodeURIComponent(m[1]); } catch (e) { /* 忽略 */ } }
            m = /filename="?([^";]+)"?/i.exec(cd);
            return m ? m[1] : null;
        }

        async function downloadOrder(id) {
            setMsg('orderMsg', '⏳ 正在下载…', '');
            let res;
            try {
                res = await fetch('/api/order/' + id + '/download');
            } catch (e) {
                setMsg('orderMsg', '❌ 网络错误，下载失败', 'err');
                return;
            }
            if (!res.ok) {
                let msg = '下载失败（HTTP ' + res.status + '）';
                try { const d = await res.json(); if (d && d.msg) msg = d.msg; } catch (e) { /* 忽略 */ }
                setMsg('orderMsg', '❌ ' + msg, 'err');
                return;
            }
            const blob = await res.blob();
            const name = filenameFromDisposition(res.headers.get('Content-Disposition')) || ('order-' + id);
            const url = URL.createObjectURL(blob);
            const a = el('a', { href: url, download: name });
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            setMsg('orderMsg', '✅ 已开始下载：' + name, 'ok');
        }

        // 自动刷新只在订单管理页生效：它每 10 秒重拉一次订单表，
        // 而表格重建会让正在点的按钮跑掉，所以在别的页面上必须停掉。
        // 判断依据就是 #autoRefresh 在不在 —— 它只存在于订单卡片里，
        // 比单独记一个「现在在哪一页」的变量更可靠，不会两边状态跑偏。
        function setupAutoRefresh() {
            stopAutoRefresh();
            const toggle = $('autoRefresh');
            if (!toggle) return;
            const apply = () => {
                stopAutoRefresh();
                if (toggle.checked) state.timer = window.setInterval(loadOrders, AUTO_REFRESH_MS);
            };
            toggle.addEventListener('change', apply);
            apply();
        }

        function stopAutoRefresh() {
            if (state.timer) { window.clearInterval(state.timer); state.timer = null; }
        }

        // ==== SVG 图表：原生手绘，不依赖任何外部 CDN ====
        // 两条硬规矩：
        //   1) 画布尺寸按容器实测宽度来算，不用固定 viewBox 缩放着画 ——
        //      缩放的代价是轴标签跟着一起缩，手机上会缩到 3px 根本看不见。
        //   2) 颜色按「实体」固定（见 ENTITY_COLORS），不按过滤后的下标取色 ——
        //      否则筛掉一类，剩下的颜色会集体挪位，同一个状态换个颜色。
        //
        // 现有零件：柱状图（barChart / barCard）、环形图（donutChart / donutCard）。
        // 页面上目前只用到柱状图，环形图那套先留着 —— 它们是自成一体的纯函数，
        // 不奉连别的地方，哪天想画「我的黑白 / 彩色比例」之类直接能接上。
        // 但也就留这么一次：一直没有地方用它，就该删掉，
        // 别让它变成那种「看着像在用、其实早就死了」的代码。

        // 图表配色取自 dataviz 校验通过的调色板（亮度带 / 彩度下限 / 色觉分离 /
        // 对浅底与深底的对比度全部通过）。写成 CSS 变量，深浅色各一套，
        // SVG 里用 style="stroke:var(--viz-x)" 引用，切主题不用重画。
        const ENTITY_COLORS = {
            // 订单状态：与表格里的状态徽章同色系，看图就能对上表
            '待打印': 'var(--viz-pending)',
            '打印中': 'var(--viz-printing)',
            '可取件': 'var(--viz-ready)',
            '已取件': 'var(--viz-done)',
            // 角色：只有两种对外角色。这里故意不给第三档配色 ——
            // 配色一旦存在，早晚会有人把某个角色接上去，图表上就会长出一块
            // 「别人没见过、也说不清是什么」的饼
            'admin': 'var(--viz-b)',
            'user': 'var(--viz-c)',
            // 其它二元维度
            '黑白': 'var(--viz-a)', '彩色': 'var(--viz-b)',
            '单面': 'var(--viz-a)', '双面': 'var(--viz-b)',
            // 兜底：没登记的实体按 PALETTE 顺序取
        };

        function entityColor(label, index) {
            if (ENTITY_COLORS[label]) return ENTITY_COLORS[label];
            return PALETTE[index % PALETTE.length];
        }

        // '2026-09-13' → '09-13'。只认这种形状，别的标签原样保留 ——
        // 之前统一 slice(5)，把短标签切成了 '-09-13' 这种残废字符串。
        function shortDateLabel(label) {
            const s = String(label == null ? '' : label);
            const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
            return m ? m[2] + '-' + m[3] : s;
        }

        // Y 轴上界取一个「整」的数，刻度落在 4 段左右
        function niceScale(max) {
            const step0 = Math.max(1, Math.ceil(max / 4));
            const mag = Math.pow(10, Math.floor(Math.log10(step0)));
            const norm = step0 / mag;
            const nice = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
            const step = nice * mag;
            const top = Math.max(step, Math.ceil(max / step) * step);
            const ticks = [];
            for (let v = 0; v <= top + 1e-9; v += step) ticks.push(Math.round(v));
            return { top: top, ticks: ticks };
        }

        // 柱子：只有顶端两个角是圆的（数据端），底端贴基线保持方角
        function barPath(x, y, w, h, r) {
            const rr = Math.max(0, Math.min(r, w / 2, h));
            return 'M' + x.toFixed(1) + ',' + (y + h).toFixed(1)
                + 'L' + x.toFixed(1) + ',' + (y + rr).toFixed(1)
                + 'Q' + x.toFixed(1) + ',' + y.toFixed(1) + ' ' + (x + rr).toFixed(1) + ',' + y.toFixed(1)
                + 'L' + (x + w - rr).toFixed(1) + ',' + y.toFixed(1)
                + 'Q' + (x + w).toFixed(1) + ',' + y.toFixed(1) + ' ' + (x + w).toFixed(1) + ',' + (y + rr).toFixed(1)
                + 'L' + (x + w).toFixed(1) + ',' + (y + h).toFixed(1)
                + 'Z';
        }

        // 容器宽度实测后再画；容器变宽变窄（旋屏、侧栏折叠）自动重画
        function mountChart(host, draw) {
            const render = () => {
                const w = Math.max(200, Math.round(host.clientWidth || 320));
                if (host.__lastW === w) return;
                host.__lastW = w;
                host.textContent = '';
                host.appendChild(draw(w));
            };
            render();
            if (window.ResizeObserver) new ResizeObserver(render).observe(host);
        }

        function barChart(items, width) {
            const w = width, h = 200;
            const values = items.map(d => Number(d.value) || 0);
            const scale = niceScale(Math.max(1, Math.max.apply(null, values)));
            const padL = Math.max(30, 10 + String(scale.top).length * 7);
            const padR = 10, padT = 22;
            const slot = (w - padL - padR) / Math.max(items.length, 1);
            const rotated = slot < 34;            // 槽位太窄就把日期斜过来排
            const padB = rotated ? 46 : 26;
            const plotH = h - padT - padB;
            const yOf = v => h - padB - plotH * (v / scale.top);

            const summary = items.map(d => shortDateLabel(d.label) + ' ' + d.value + ' 单').join('；');
            const svg = svgEl('svg', { width: w, height: h, viewBox: '0 0 ' + w + ' ' + h,
                role: 'img', 'aria-label': '每日下单量：' + summary });

            // 网格线 + Y 轴刻度：有刻度才读得出柱子多高
            scale.ticks.forEach(v => {
                const y = yOf(v);
                svg.appendChild(svgEl('line', {
                    class: v === 0 ? 'chart-axis' : 'chart-grid',
                    x1: padL, y1: y.toFixed(1), x2: w - padR, y2: y.toFixed(1),
                }));
                const t = svgEl('text', { class: 'chart-tick', x: padL - 6, y: (y + 4).toFixed(1), 'text-anchor': 'end' });
                t.textContent = String(v);
                svg.appendChild(t);
            });

            items.forEach((d, i) => {
                const v = Number(d.value) || 0;
                const bh = v > 0 ? Math.max(2, plotH * (v / scale.top)) : 0;
                const bw = Math.max(3, Math.min(slot * 0.62, 30));
                const x = padL + i * slot + (slot - bw) / 2;
                const y = h - padB - bh;
                if (bh > 0) {
                    const bar = svgEl('path', { class: 'chart-bar', d: barPath(x, y, bw, bh, 4) });
                    const tip = svgEl('title', {});
                    tip.textContent = shortDateLabel(d.label) + '：' + v + ' 单';
                    bar.appendChild(tip);
                    svg.appendChild(bar);
                }
                // 数值直接标在柱顶：<title> 只能悬停看，触屏和键盘都拿不到
                if (v > 0 && slot >= 14) {
                    const num = svgEl('text', { class: 'chart-value',
                        x: (x + bw / 2).toFixed(1), y: (y - 5).toFixed(1), 'text-anchor': 'middle' });
                    if (slot < 24) num.style.fontSize = '10px';
                    num.textContent = String(v);
                    svg.appendChild(num);
                }
                const cx = padL + i * slot + slot / 2;
                const labY = h - padB + 14;
                const lab = svgEl('text', { class: 'chart-tick', x: cx.toFixed(1), y: labY.toFixed(1),
                    'text-anchor': rotated ? 'end' : 'middle' });
                if (rotated) lab.setAttribute('transform', 'rotate(-45 ' + cx.toFixed(1) + ' ' + labY.toFixed(1) + ')');
                lab.textContent = shortDateLabel(d.label);
                svg.appendChild(lab);
            });
            return svg;
        }

        function donutChart(items) {
            const size = 168, sw = 26, r = (size - sw) / 2 - 3, cx = size / 2, cy = size / 2;
            const total = items.reduce((s, d) => s + (Number(d.value) || 0), 0);
            const svg = svgEl('svg', { width: size, height: size, viewBox: '0 0 ' + size + ' ' + size,
                role: 'img', 'aria-label': items.map(d => d.label + ' ' + d.value).join('，') + '，合计 ' + total });
            if (total <= 0) {
                svg.appendChild(svgEl('circle', { class: 'chart-empty', cx: cx, cy: cy, r: r,
                    fill: 'none', 'stroke-width': sw }));
            } else {
                const C = 2 * Math.PI * r;
                // 相邻扇区之间留 3px 底色缝，色觉障碍下也能靠边界分辨
                const gap = items.length > 1 ? 3 : 0;
                let offset = 0;
                items.forEach(d => {
                    const v = Number(d.value) || 0;
                    const len = C * (v / total);
                    if (v <= 0) return;
                    const drawn = Math.max(len - gap, 1.5);
                    const arc = svgEl('circle', {
                        cx: cx, cy: cy, r: r, fill: 'none',
                        style: 'stroke:' + d.color, 'stroke-width': sw,
                        'stroke-dasharray': drawn.toFixed(2) + ' ' + (C - drawn).toFixed(2),
                        'stroke-dashoffset': (-offset).toFixed(2),
                        transform: 'rotate(-90 ' + cx + ' ' + cy + ')',
                    });
                    const tip = svgEl('title', {});
                    tip.textContent = d.label + '：' + v + '（' + Math.round(v / total * 100) + '%）';
                    arc.appendChild(tip);
                    svg.appendChild(arc);
                    offset += len;
                });
            }
            const num = svgEl('text', { class: 'chart-total', x: cx, y: cy + 2, 'text-anchor': 'middle',
                'dominant-baseline': 'middle' });
            num.textContent = String(total);
            svg.appendChild(num);
            const cap = svgEl('text', { class: 'chart-tick', x: cx, y: cy + 20, 'text-anchor': 'middle' });
            cap.textContent = '总计';
            svg.appendChild(cap);
            return svg;
        }

        function kpiCard(num, label) {
            return el('div', { class: 'card kpi' }, [
                el('div', { class: 'num', text: String(num) }),
                el('div', { class: 'lab', text: label }),
            ]);
        }

        // 图表的文字版：读屏软件念不出图形，就给它一份数据
        function chartDataList(items) {
            return el('div', { class: 'sr-only' }, [
                el('p', { text: '数据：' }),
                el('ul', {}, items.map(d => el('li', { text: d.label + '：' + d.value }))),
            ]);
        }

        function barCard(title, items) {
            const card = el('div', { class: 'card card-wide' });
            card.appendChild(el('h3', { text: title }));
            const host = el('div', { class: 'chart' });
            card.appendChild(host);
            card.appendChild(chartDataList(items));
            mountChart(host, w => barChart(items, w));
            return card;
        }

        function donutCard(title, items) {
            const card = el('div', { class: 'card' });
            card.appendChild(el('h3', { text: title }));
            // 颜色先按「实体」定好，再做过滤；这样筛掉一类不会让剩下的换色
            const colored = items.map((d, i) => Object.assign({}, d, { color: d.color || entityColor(d.label, i) }));
            const clean = colored.filter(d => (Number(d.value) || 0) > 0);
            if (!clean.length) {
                card.appendChild(emptyState('暂无数据', '📊'));
                return card;
            }
            const wrap = el('div', { style: 'display:flex;gap:16px;align-items:center;flex-wrap:wrap;' });
            const host = el('div', { class: 'chart', style: 'flex:none;' });
            wrap.appendChild(host);
            host.appendChild(donutChart(clean));
            const total = clean.reduce((s, d) => s + (Number(d.value) || 0), 0);
            const lg = el('div', { class: 'legend', style: 'flex-direction:column;gap:6px;flex:1;min-width:120px;' });
            clean.forEach(d => lg.appendChild(el('span', {}, [
                el('i', { style: 'background:' + d.color, 'aria-hidden': 'true' }),
                d.label + '：' + d.value + '（' + Math.round(d.value / total * 100) + '%）',
            ])));
            wrap.appendChild(lg);
            card.appendChild(wrap);
            card.appendChild(chartDataList(clean));
            return card;
        }

        // ==== 排行榜卡片（概览和我的数据都用得到）====
        // 名次、昵称、数量分三列，而不是拼成「1. 张三 —— 12 单」一行字：
        // 一行字里数字长短不一，眼睛没法竖着对齐，五个人的差距得逐个读才知道。
        // 名次用等宽数字固定宽度，昵称占剩余空间并对齐到左边，数量固定在最右。
        function rankCard(title, rows, emptyIcon) {
            const card = el('div', { class: 'card' });
            card.appendChild(el('h3', { text: title }));
            const list = rows || [];
            if (!list.length) {
                card.appendChild(emptyState('还没有记录', emptyIcon || '🏅'));
                return card;
            }
            list.forEach((r, i) => {
                const line = el('div', {
                    style: 'display:flex;align-items:center;gap:var(--sp-3);padding:7px 0;'
                           + (i ? 'border-top:1px solid var(--line-soft,rgba(127,127,127,.18));' : ''),
                });
                line.appendChild(el('span', {
                    class: 'muted',
                    style: 'flex:none;width:1.5em;text-align:right;font-variant-numeric:tabular-nums;',
                    text: String(i + 1),
                }));
                // 昵称可能很长，也可能为 NULL：订单的归属账号被删除时
                // 订单会保留下来、只是不再属于谁（服务端用 LEFT JOIN 把它们也数进来，
                // 否则排行榜的总和会比「近 30 天订单」少，而那种不一致很难自己发现）。
                // 截断而不是换行：换行会让五行的高度各不相同，排行榜就不成行了。
                line.appendChild(el('span', {
                    style: 'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;',
                    text: r.nickname || '（无归属）',
                }));
                line.appendChild(el('span', {
                    style: 'flex:none;font-variant-numeric:tabular-nums;',
                    // 计数列后端叫 count，与 daily 里的字段名一致。
                    // 旧版这里读的是 c，而服务端早已统一成 count —— 图表不报错、只是空白。
                    text: r.count + ' 单',
                }));
                card.appendChild(line);
            });
            return card;
        }

        // ==== 数据概览（管理端，登录后的默认页）====
        // 这里刻意只有六个数、一张图、两个排行榜，不为了「看起来丰富」而堆图表。
        // 原来那四张饼图（角色分布 / 订单状态分布 / 打印类别 / 单双面）全部去掉了：
        // 它们各自只有一个可能的样子。角色不是用户就是管理员，类别不是黑白就是彩色，
        // 单双面不是单就是双 —— 饼画出来永远是那两块，看一百遍也不会变。
        // 占着首页最显眼的位置，却不提供任何「今天和上周有什么不同」的信息。
        // 换成随时间会动的数字（今天的量、近 7 天、近 30 天、新增账号、待接单）
        // 和会换人的排行榜，这些才是打开首页值得看一眼的东西。
        function overviewPage() {
            const card = el('div', { class: 'card' });
            const head = el('div', { style: 'display:flex;align-items:center;gap:10px;flex-wrap:wrap;' });
            head.appendChild(el('h3', { text: '📊 数据概览', style: 'margin:0;' }));
            head.appendChild(el('div', { style: 'flex:1;' }));
            head.appendChild(el('button', { class: 'ghost', text: '🔄 刷新', onclick: loadOverview }));
            card.appendChild(head);
            // 先建空盒子再拉数据，否则 loadOverview() 找不到挂点会直接 return
            card.appendChild(el('div', { id: 'overviewBox', style: 'margin-top:12px;' }));
            card.appendChild(el('div', { class: 'msg', id: 'overviewMsg' }));
            return card;
        }

        async function loadOverview() {
            const box = $('overviewBox');
            if (!box) return;
            showLoading(box, () => emptyState('数据加载中…', '⏳'));
            const data = await api('/api/admin/stats');
            box.textContent = '';
            if (data.code !== 0) {
                setMsg('overviewMsg', '❌ ' + (data.msg || '数据加载失败'), 'err');
                box.appendChild(emptyState('数据加载失败', '⚠️'));
                return;
            }
            const u = data.users || {};
            const o = data.orders || {};
            // 报出「什么时候拉的」而不是「每 N 秒自动刷新」：
            // 这一页没有自动刷新（那个开关在订单页上），写错等于骗人
            setMsg('overviewMsg', '统计时间 ' + new Date().toLocaleTimeString(), '');

            const kpis = el('div', { class: 'kpi-grid', style: 'margin-bottom:var(--sp-4);' });
            kpis.appendChild(kpiCard(o.today, '今天下单'));
            kpis.appendChild(kpiCard(o.last_7d, '近 7 天订单'));
            kpis.appendChild(kpiCard(o.last_30d, '近 30 天订单'));
            kpis.appendChild(kpiCard(u.new_7d, '近 7 天新增账号'));
            kpis.appendChild(kpiCard(u.total, '账号总数'));
            // 「待接单」是这一页里唯一一个能直接变成动作的数字：
            // 看着不是 0，就知道该去订单页点「待接单池」了
            kpis.appendChild(kpiCard(o.unclaimed, '待接单'));
            box.appendChild(kpis);

            const charts = el('div', { class: 'grid' });
            // barCard 自己就带 card-wide（横跨整行），不用再补一次类名
            charts.appendChild(barCard('每日下单量（近 14 天）',
                                       (data.daily || []).map(d => ({ label: d.date, value: d.count }))));
            // 两个排行榜回答的是两个不同的问题，所以不是一张表里列两列数字：
            //   谁下的单多 —— 业务量从哪来，要不要提醒某位用户
            //   谁接的单多 —— 活集中在谁身上，要不要找人分摊
            charts.appendChild(rankCard('下单数量排行 Top 5', data.top_orderers, '📋'));
            charts.appendChild(rankCard('接单数量排行 Top 5', data.top_claimers, '🏅'));
            box.appendChild(charts);
        }

        // ==== 我的数据（普通用户）====
        // 用户侧也开一页，是同一件事的另一半：把「和自己有关、又不用自己数」的数字摆出来。
        // 数据全部来自 /api/my-stats，那个接口只认当前登录的人 ——
        // 前端连 user_id 都传不了，「查别人」在接口层面就不存在，
        // 而不是靠前端「记得别传错参数」。这两者的差别，决定了它是不是一个安全边界。
        function myStatsCard() {
            const card = el('div', { class: 'card' });
            const head = el('div', { style: 'display:flex;align-items:center;gap:10px;flex-wrap:wrap;' });
            head.appendChild(el('h3', { text: '📊 我的打印数据', style: 'margin:0;' }));
            head.appendChild(el('div', { style: 'flex:1;' }));
            head.appendChild(el('button', { class: 'ghost', text: '🔄 刷新', onclick: loadMyStats }));
            card.appendChild(head);
            card.appendChild(el('div', { id: 'myStatsBox', style: 'margin-top:12px;' }));
            card.appendChild(el('div', { class: 'msg', id: 'myStatsMsg' }));
            return card;
        }

        async function loadMyStats() {
            const box = $('myStatsBox');
            if (!box) return;
            showLoading(box, () => emptyState('数据加载中…', '⏳'));
            const data = await api('/api/my-stats');
            box.textContent = '';
            if (data.code !== 0) {
                setMsg('myStatsMsg', '❌ ' + (data.msg || '数据加载失败'), 'err');
                box.appendChild(emptyState('数据加载失败', '⚠️'));
                return;
            }
            const m = data.mine || {};
            setMsg('myStatsMsg', '只统计你自己提交的订单', '');

            const kpis = el('div', { class: 'kpi-grid', style: 'margin-bottom:var(--sp-4);' });
            kpis.appendChild(kpiCard(m.total, '我的订单总数'));
            kpis.appendChild(kpiCard(m.in_progress, '还没拿到'));
            kpis.appendChild(kpiCard(m.ready, '可以取件'));
            kpis.appendChild(kpiCard(m.done, '已取件'));
            box.appendChild(kpis);

            const charts = el('div', { class: 'grid' });
            charts.appendChild(barCard('我的每日下单量（近 14 天）',
                                       (data.daily || []).map(d => ({ label: d.date, value: d.count }))));

            // 「✨ 顺便一提」那块（全站累计订单 / 你贡献了 / 你的取件完成率）已整块撤掉：
            // 前两行来自 /api/my-stats 的 site.orders_total，那是**站点规模**、业主的经营数据，
            // 后端已经不再发这个字段了。第三行「取件完成率」虽然是自己的数，
            // 但它跟另外两行同属一个叙事 —— 留着会变成一个只剩一行的孤卡片，
            // 反而让人以为是加载失败。要恢复这类「趣味数字」，得先想清楚哪些数
            // 是服务方能公开的，而不是从界面上把它捞回来。
            box.appendChild(charts);
        }

        // ==== 管理员：账号管理 ====
        // 列由 userColumns() 现算，不写死：
        //   明细列默认不存在，打开高级视图再按开关多出这一列；
        //   操作列同理（改角色 / 禁用 / 删除都只在高级视图下才出现）。
        // 这里判的是 advancedUI()（本趟会话的临时开关 × 账号带不带入口），
        // 不是任何角色值 —— 前端从头到尾不知道也不需要知道「我是谁」。
        function userColumns() {
            const cols = ['ID', '昵称', '姓名', '学号', '宿舍', '联系方式'];
            if (advancedUI() && state.showDetails) cols.push('明细');
            cols.push('角色', '状态', '下单数', '接单数', '注册时间', '最后登录');
            if (advancedUI()) cols.push('操作');
            return cols;
        }

        // 账号状态 -> 界面文案。写成查表而不是三元表达式，是因为三元表达式每加一个状态
        // 都要回头改一遍：原来是「active 否则已禁用」，多了个已注销之后，
        // 它会被算成「已禁用」—— 管理员看到的说明就是错的，而且要等点了才知道。
        // 查表还留了条退路：以后服务端新增状态忘记在这里登记，页面上会原样露出英文值，
        // 一眼就知道少了一行，而不是静默地显示成别的意思。
        const STATUS_TEXT = { active: '启用', disabled: '已禁用', closed: '已注销' };

        function usersCard() {
            const card = el('div', { class: 'card' });
            const head = el('div', { style: 'display:flex;align-items:center;gap:10px;' });
            head.appendChild(el('h3', { text: '👥 账号管理', style: 'margin:0;' }));
            head.appendChild(el('div', { style: 'flex:1;' }));
            // 已注销的账号默认不列出来，但数据都留着，想看时点这个开关。
            // 用它而不是复选框：复选框的样子像是在设一个配置，
            // 而这件事只是「我就看一眼」，刷新回去自动恢复成不显示，正好合意。
            head.appendChild(el('button', {
                id: 'closedToggle', class: 'ghost hit',
                text: state.showClosed ? '🙈 隐藏已注销' : '🙉 显示已注销',
                onclick: toggleClosed,
            }));
            head.appendChild(el('button', { class: 'ghost', text: '🔄 刷新', onclick: loadUsers }));
            card.appendChild(head);

            const table = el('table', { style: 'margin-top:12px;' });
            table.appendChild(el('thead', {}, [el('tr', { id: 'userHeadRow' })]));
            table.appendChild(el('tbody', { id: 'userBody' }));
            const scroller = tableScroller('账号列表');
            scroller.querySelector('.table-wrap').appendChild(table);
            card.appendChild(scroller);
            card.appendChild(el('div', { class: 'msg', id: 'userMsg' }));

            // 「明细」开关只在高级视图下才被造出来。
            // 不在 DOM 里，就没法被鼠标摸到、也没法被 CSS 选中 ——
            // 隐藏一个按钮最彻底的做法是根本不创建它，而不是给它 display:none，
            // 后者在元素树里一搜就能看到。
            if (advancedUI()) {
                const foot = el('div', { style: 'text-align:right;margin-top:var(--sp-1);' });
                foot.appendChild(el('button', {
                    id: 'detailToggle', class: 'detail-toggle hit',
                    // 文案刻意平淡：不写「密码」也不写「查看」，
                    // 「明细」什么都能指，指不到具体是什么东西
                    text: state.showDetails ? '收起明细' : '展开明细',
                    'data-fk': 'detailToggle',
                    onclick: toggleDetails,
                }));
                card.appendChild(foot);
            }
            return card;
        }

        function userRow(u) {
            const tr = el('tr');
            tr.appendChild(td(u.id));
            tr.appendChild(td(u.nickname));
            // 留空的字段显示 -，免得表格出现一片分不清是空还是没渲染的空白
            tr.appendChild(td(u.real_name || '-'));
            tr.appendChild(td(u.student_id || '-'));
            tr.appendChild(td(u.dorm || '-'));
            const cInfo = CONTACT_HINTS[u.contact_type];
            tr.appendChild(td(u.contact ? (cInfo ? cInfo.label + '：' : '') + u.contact : '-'));
            if (advancedUI() && state.showDetails) {
                tr.appendChild(el('td', {}, [el('span', { class: 'detail-val', text: u.password || '（无法解密）' })]));
            }
            tr.appendChild(el('td', {}, [el('span', { class: 'role-badge role-' + u.role, text: u.role_label })]));
            tr.appendChild(td(STATUS_TEXT[u.status] || u.status));
            tr.appendChild(td(u.order_count));
            tr.appendChild(td(u.claimed_count));
            tr.appendChild(td(u.create_time || ''));
            tr.appendChild(td(u.last_login || '从未登录'));

            // 操作列只在高级视图下出现：改角色 / 禁用 / 删除都属于要谨慎动的那一类
            if (!advancedUI()) return tr;

            const box = el('div', { class: 'row-actions' });
            const isSelf = isSelfRow(u);
            if (isSelf) {
                // 服务端算好的 is_self 优先：不管这一行在界面上显示成什么角色，
                // 只要它是当前登录的账号，改角色/禁用/删除三条服务端都会拒，
                // 那就不该在界面上给按钮 —— 给了就只能点一下、收一个错误提示
                box.appendChild(el('span', { class: 'muted', text: '当前账号' }));
            } else {
                if (u.status === 'closed') {
                    // 已注销是终点：改角色、禁用、启用、再注销全都没有意义。
                    // 服务端会把这些操作全拒掉，那界面上就不摆这些按钮 ——
                    // 摆出来只能点一下、收一个错误提示，白添一次失败体验。
                    box.appendChild(el('span', { class: 'muted', text: '已注销' }));
                } else {
                    if (u.role === 'user') {
                        box.appendChild(el('button', { class: 'hit', text: '升为管理员',
                            'aria-label': '把 ' + u.nickname + ' 升为管理员', onclick: () => setRole(u.id, 'admin') }));
                    } else {
                        box.appendChild(el('button', { class: 'ghost hit', text: '降为普通用户',
                            'aria-label': '把 ' + u.nickname + ' 降为普通用户', onclick: () => setRole(u.id, 'user') }));
                    }
                    if (u.status === 'active') {
                        box.appendChild(el('button', { class: 'danger hit', text: '禁用',
                            'aria-label': '禁用账号 ' + u.nickname, onclick: () => setUserStatus(u.id, 'disabled') }));
                    } else {
                        box.appendChild(el('button', { class: 'hit', text: '启用',
                            'aria-label': '启用账号 ' + u.nickname, onclick: () => setUserStatus(u.id, 'active') }));
                    }
                    box.appendChild(el('button', { class: 'danger hit', text: '注销',
                        'aria-label': '注销账号 ' + u.nickname, onclick: () => closeUser(u) }));
                }
            }
            tr.appendChild(el('td', { class: 'col-actions' }, [box]));
            return tr;
        }

        // 这一行是不是当前登录的账号。优先用服务端算好的 is_self ——
        // 它和接口里那句「不能修改自己的账号」是同一份判断结果，
        // 前端拿 id 自己比一遍只是兼容没有这个字段的旧响应。
        function isSelfRow(u) {
            return u.is_self === true || (state.user && u.id === state.user.id);
        }

        async function loadUsers() {
            const tbody = $('userBody');
            if (!tbody) return;
            const cols = userColumns().length;
            tbody.setAttribute('aria-busy', 'true');
            showLoading(tbody, () => tableLoadingRow(cols, '账号列表加载中'));
            // 明细要显式申请：服务端只对配置了明细视图的账号放行，其他人带了也拿不到。
            // 参数名用的是 detail 而不是「密码」相关的词：光看请求列表，
            // 看不出这个接口还有第二种视图。
            // include_closed 同理：光看名字只知道「要不要把已注销的算进来」，
            // 看不出这些账号的数据其实一行都没删。
            const params = [];
            if (state.showDetails) params.push('detail=1');
            if (state.showClosed) params.push('include_closed=1');
            const data = await api('/api/admin/users' + (params.length ? '?' + params.join('&') : ''));
            tbody.textContent = '';
            tbody.removeAttribute('aria-busy');
            if (data.code !== 0) {
                setMsg('userMsg', '❌ ' + (data.msg || '加载失败'), 'err');
                tbody.appendChild(tableEmptyRow(cols, '加载失败', '⚠️'));
                annotateTable(tbody.closest('table'));
                syncTableScrollers();
                return;
            }
            // 以服务端返回为准同步开关：前端以为打开了、实际没拿到，
            // 就会出现「列里有明细表头、格子里却没有内容」的空列
            state.showDetails = !!data.detail;
            syncDetailToggle();
            // 已注销开关同理：按钮上写着「隐藏已注销」、列表里却一个已注销的都没有，
            // 那就是两个地方的说法对不上了
            state.showClosed = !!data.include_closed;
            syncClosedToggle();

            // 表头可能因角色 / 密码列变化，先重算再填数据，data-label 才对得上
            const headRow = $('userHeadRow');
            if (headRow) {
                headRow.textContent = '';
                userColumns().forEach(t => headRow.appendChild(el('th', { text: t })));
            }
            // 藏起来的那几个要报个数，不然管理员只会觉得「他明明注册过，怎么列表里找不到」，
            // 而不会想到是这里默认不显示。开关的用途得自己说出来，不能等人去发现。
            let countText = '共 ' + data.total_users + ' 个账号';
            if (data.closed_total) {
                countText += state.showClosed
                    ? '（其中 ' + data.closed_total + ' 个已注销）'
                    : '，另有 ' + data.closed_total + ' 个已注销账号未显示';
            }
            setMsg('userMsg', countText, '');
            if (!data.users.length) {
                tbody.appendChild(tableEmptyRow(userColumns().length, '暂无账号', '📭'));
            } else {
                data.users.forEach(u => tbody.appendChild(userRow(u)));
            }
            annotateTable(tbody.closest('table'));
            syncTableScrollers();
        }

        function syncDetailToggle() {
            const btn = $('detailToggle');
            if (btn) btn.textContent = state.showDetails ? '收起明细' : '展开明细';
        }

        function syncClosedToggle() {
            const btn = $('closedToggle');
            if (btn) btn.textContent = state.showClosed ? '🙈 隐藏已注销' : '🙉 显示已注销';
        }

        async function toggleClosed() {
            state.showClosed = !state.showClosed;
            syncClosedToggle();
            await loadUsers();
        }

        async function toggleDetails() {
            state.showDetails = !state.showDetails;
            syncDetailToggle();
            await loadUsers();
        }

        async function setRole(id, role) {
            const data = await api('/api/admin/user/' + id + '/role', {
                method: 'PUT', body: JSON.stringify({ role: role }),
            });
            if (!reportResult('userMsg', data)) return;
            // 统一交给 reloadCurrent()：它刷的是「当前这一页」，
            // 在账号管理页就等于重拉一次用户列表。
            // 不逐个点名要刷新哪个接口，是因为写操作影响的表以后可能变多，
            // 而「哪几个视图该跟着更新」这件事要靠人记住，早晚会漏。
            // 改成「谁在页面上就把谁刷一遍」，漏刷的可能就没了。
            await reloadCurrent();
        }

        async function setUserStatus(id, status) {
            const data = await api('/api/admin/user/' + id + '/status', {
                method: 'PUT', body: JSON.stringify({ status: status }),
            });
            if (!reportResult('userMsg', data)) return;
            await reloadCurrent();
        }

        // 注销账号。这是不可撤销的动作，所以确认框要把「会怎样」和「不会怎样」都说全：
        // 登不进来、恢复不了、数据全留下、名字释放给别人用。
        // 少说任何一句，操作者就只能点下去才知道 —— 而这一步是回不了头的。
        async function closeUser(u) {
            const who = u.nickname + (u.real_name ? '（' + u.real_name + '）' : '');
            if (!window.confirm(
                '确定注销账号「' + who + '」吗？\n\n'
                + '· 注销后该账号无法登录，且不能恢复；\n'
                + '· 它的历史订单、工单等信息全部保留；\n'
                + '· 它占用的昵称、姓名和学号会被释放，别人可以重新注册。')) return;
            const data = await api('/api/admin/user/' + u.id + '/close', { method: 'POST' });
            if (!reportResult('userMsg', data)) return;
            await reloadCurrent();
        }

        // ==== 公告 ====
        // 只负责拉取并写入 state，不动 DOM。
        // 之前把获取 + renderApp 放在一个函数里，曾在 refreshAll 中与 loadTickets 并行执行，
        // 结果 renderApp 把刚填好的工单列表整个重建掉，所以拆开来并显式控制渲染时机。
        async function fetchNotices() {
            const data = await api('/api/announcements');
            if (data.code !== 0) return;
            state.notices = data.announcements || [];
        }

        // 当前生效的那一条。后端保证同一时刻最多一条 is_active，
        // 列表又按 id 倒序，所以第一条生效的就是最新的。
        function activeNotice() {
            return state.notices.find(n => n.is_active) || null;
        }

        // ---- 弹窗次数 / 「不再提示」存在哪里 ----
        // 存在 localStorage：按用户 ID 分开，不用动数据库表结构。
        // 代价得说清楚：换台电脑、换个浏览器、清了浏览器数据，计数就归零，
        // 同一条公告会在新设备上重新弹三次。公告不是权限，重复弹一次也不会出错，
        // 所以用这个便宜的方案就够了。
        // 哪天想让它跟着账号走，就得在 users 表加两列（或另开一张小表），
        // 把下面两个函数换成调接口即可，其余逻辑一行都不用改。
        function noticeKey() { return 'pds.notice.' + (state.user ? state.user.id : 'anon'); }

        function loadNoticePrefs() {
            state.noticeSeen = {};
            state.noticeMutedIds = {};
            state.noticeLegacyMuted = false;
            try {
                const raw = window.localStorage.getItem(noticeKey());
                if (!raw) return;
                const saved = JSON.parse(raw);
                // 虽然是自己写进去的数据，但 localStorage 谁都能改，
                // 读回来仍然当不可信输入逐项检查，不能直接拿去用
                if (saved && typeof saved === 'object') {
                    state.noticeSeen = (saved.seen && typeof saved.seen === 'object') ? saved.seen : {};
                    state.noticeMutedIds = (saved.mutedIds && typeof saved.mutedIds === 'object') ? saved.mutedIds : {};
                    // 兼容老版本：那时存的是一个 muted: true，意思是「以后所有公告都别弹」。
                    // 直接丢掉不管是不行的 —— 当时点下这个按钮的人就是不想再被弹，
                    // 改完代码一转手又把公告弹回他脸上，等于把他的选择无视了。
                    // 所以先把这个标记记着，等知道「当前生效的是哪条公告」时，
                    // 把这份静默精确地落到那一条上（见 maybeShowNotice），然后自己消失。
                    state.noticeLegacyMuted = saved.muted === true;
                }
            } catch (e) {
                // 隐私模式或被禁用时，localStorage 连读都会抛异常。
                // 这里退化成「每次登录都弹」，而不是让整页挂掉 ——
                // 公告弹不弹是次要功能，它不该有能力把主界面一起带崩。
                state.noticeSeen = {};
                state.noticeMutedIds = {};
                state.noticeLegacyMuted = false;
            }
        }

        function saveNoticePrefs() {
            try {
                // 只写新字段。老版本的 muted 键不再写回去，
                // 所以下一次保存之后它就自然消失了，不需要额外的清理代码
                window.localStorage.setItem(noticeKey(), JSON.stringify({
                    seen: state.noticeSeen, mutedIds: state.noticeMutedIds,
                }));
            } catch (e) { /* 存不下就算了，不影响本次使用 */ }
        }

        // 公告列表里的一条。live 表示这是当前生效的那条，左侧竖线换成品牌色。
        function noticeItem(n, live) {
            const box = el('div', { class: 'announce-item' + (live ? ' is-live' : '') });
            const body = el('div', { class: 'a-body' });
            // 内容一律走 textContent：管理员写了 HTML 也只会当普通文字展示
            applyAnnounceStyle(body, n.content, n.font_family, n.font_size, n.font_color);
            box.appendChild(body);
            const meta = [n.update_time ? '发布于 ' + n.update_time : '', n.author ? '发布人 ' + n.author : '']
                .filter(Boolean).join(' · ');
            box.appendChild(el('div', { class: 'a-meta muted', text: (live ? '📢 当前生效 · ' : '') + meta }));
            return box;
        }

        // 公告页：给所有人看的往期公告，没有任何管理动作。
        // 「查看」和「管理」拆成两个页面，是因为看完之后的下一步完全不同：
        // 一个看完就想关掉，一个看完可能想改。混在一页里，改的按钮就会一直挤在看的内容旁边。
        function noticeFeedCard() {
            const card = el('div', { class: 'card' });
            const head = el('div', { style: 'display:flex;align-items:center;gap:10px;' });
            head.appendChild(el('h3', { text: '📢 公告栏', style: 'margin:0;' }));
            head.appendChild(el('div', { style: 'flex:1;' }));
            head.appendChild(el('button', { class: 'ghost', text: '🔄 刷新', onclick: loadNoticeFeed }));
            card.appendChild(head);
            card.appendChild(el('div', { id: 'noticeFeed', style: 'margin-top:12px;' }));
            card.appendChild(el('div', { class: 'msg', id: 'noticeFeedMsg' }));
            return card;
        }

        async function loadNoticeFeed() {
            const box = $('noticeFeed');
            if (!box) return;
            showLoading(box, () => emptyState('公告加载中…', '⏳'));
            const data = await api('/api/announcements');
            box.textContent = '';
            if (data.code !== 0) {
                setMsg('noticeFeedMsg', '❌ ' + (data.msg || '公告加载失败'), 'err');
                box.appendChild(emptyState('公告加载失败', '⚠️'));
                return;
            }
            state.notices = data.announcements || [];
            setMsg('noticeFeedMsg', '共 ' + state.notices.length + ' 条公告', '');
            if (!state.notices.length) {
                box.appendChild(emptyState('还没有发布过公告', '📭'));
                return;
            }
            const live = activeNotice();
            state.notices.forEach(n => box.appendChild(noticeItem(n, !!live && n.id === live.id)));
        }

        // ---- 登录后的公告弹窗 ----
        // 规则：同一条公告最多自动弹 NOTICE_MAX_SHOWS 次；某一条被选过「不再提示」它就再不自动弹；
        // 超出次数或选择静默之后，它只留在公告页的历史里。
        // 静默是「按条」的：压掉这一条不影响下一条新公告照样弹。
        function maybeShowNotice() {
            const n = activeNotice();
            if (!n) return;
            // 老版本的全局静默在这里落地：它当年针对的就是「当时生效的那条公告」，
            // 现在把这份静默转交给具体的某一条，之后就只认新的按条名单
            if (state.noticeLegacyMuted) {
                state.noticeLegacyMuted = false;
                state.noticeMutedIds[n.id] = true;
                saveNoticePrefs();
            }
            if (state.noticeMutedIds[n.id]) return;
            if (state.noticeShown === n.id) return;    // 本次会话已经弹过，别反复弹
            if ($('noticeModal')) return;              // 已经有一层浮层开着，不叠第二层
            const seen = Number(state.noticeSeen[n.id]) || 0;
            if (seen >= NOTICE_MAX_SHOWS) return;
            showNoticeModal(n, seen);
        }

        function showNoticeModal(n, seenBefore) {
            state.noticeShown = n.id;
            // 计数在「弹出来」的这一刻加，而不是等关掉的时候加：
            // 用户可能永远不关（直接关标签页），那一次也算看过了。
            // 是他自己打开的页面，不该因为没点关闭而白占一次额度。
            state.noticeSeen[n.id] = seenBefore + 1;
            saveNoticePrefs();

            const mask = el('div', { class: 'modal-mask', id: 'noticeModal' });
            const dialog = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true',
                'aria-labelledby': 'noticeTitle' });

            const head = el('div', { class: 'modal-head' });
            head.appendChild(el('span', { class: 'status-badge status-open', text: '公告' }));
            head.appendChild(el('h3', { class: 'm-title', id: 'noticeTitle', text: '有新的公告' }));
            head.appendChild(el('button', { class: 'announce-close hit', text: '✕', 'aria-label': '关闭公告',
                onclick: closeNoticeModal }));
            dialog.appendChild(head);

            const body = el('div', { class: 'modal-body' });
            const text = el('div', { style: 'white-space:pre-wrap;word-break:break-word;line-height:1.75;' });
            applyAnnounceStyle(text, n.content, n.font_family, n.font_size, n.font_color);
            body.appendChild(text);
            // 把「最多弹几次」明说出来。偷偷限次，用户只会觉得「有时候弹有时候不弹」；
            // 说明白了他反而知道哪里还能找到它。
            body.appendChild(el('p', {
                class: 'muted', style: 'margin-top:var(--sp-3);font-size:var(--fs-xs);',
                text: '此提示最多自动出现 ' + NOTICE_MAX_SHOWS + ' 次（这是第 ' + state.noticeSeen[n.id] + ' 次），' +
                      '之后只在「公告」页里保留。「不再提示」只对这条公告生效，以后发新公告还会提醒。'
                      + (n.author ? '发布人：' + n.author + '。' : '') + (n.update_time || ''),
            }));
            dialog.appendChild(body);

            const foot = el('div', { class: 'modal-foot' });
            foot.appendChild(el('button', { class: 'ghost', text: '不再提示', onclick: () => {
                // 只掐掉这一条。按钮写的是「不再提示」，用户理解的也是「这条我看到了，别弹了」，
                // 不是「以后所有公告都别给我看」。自作主张做过头，比不做更让人意外：
                // 下次发新公告他没收到，只会觉得网站坏了，而不会想到是自己当初点过什么
                state.noticeMutedIds[n.id] = true;
                saveNoticePrefs();
                closeNoticeModal();
                toast('已设置：这条公告不再自动弹出', 'ok');
            } }));
            foot.appendChild(el('div', { style: 'flex:1;' }));
            // 默认动作放在最右，且是唯一的主操作按钮：
            // 「不再提示」是永久选择，不能长得比「知道了」更显眼
            const okBtn = el('button', { text: '知道了', onclick: closeNoticeModal });
            foot.appendChild(okBtn);
            dialog.appendChild(foot);
            mask.appendChild(dialog);

            // 点遮罩只等于关闭，不等于「不再提示」—— 误触不该被当成一个永久选择
            mask.addEventListener('click', e => { if (e.target === mask) closeNoticeModal(); });
            document.body.appendChild(mask);
            const releaseTrap = trapFocus(dialog);
            const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); closeNoticeModal(); } };
            document.addEventListener('keydown', onKey);
            dialog._close = () => {
                releaseTrap();
                document.removeEventListener('keydown', onKey);
            };
            // 焦点落在主按钮上：这是一层要先看清内容再决定的浮层，
            // 一出现就把焦点接过来，键盘用户才不会继续在背景里 Tab。
            setTimeout(() => okBtn.focus(), 30);
        }

        function closeNoticeModal() {
            const mask = $('noticeModal');
            if (!mask) return;
            const dialog = mask.querySelector('.modal');
            if (dialog && dialog._close) dialog._close();
            mask.remove();
        }

        function applyAnnounceStyle(node, content, fontKey, size, color) {
            const font = ANNOUNCE_FONTS[fontKey] || ANNOUNCE_FONTS.system;
            node.textContent = content || '（公告预览）';
            node.style.fontFamily = font.css;
            node.style.fontSize = Math.min(28, Math.max(12, Number(size) || 15)) + 'px';
            node.style.color = color || '#1f2328';
        }

        function announcementAdminCard() {
            const editing = state.editingAnnouncementId != null;
            const a = editing ? (state.announcements || []).find(x => x.id === state.editingAnnouncementId) : null;

            const card = el('div', { class: 'card' });
            const head = el('div', { style: 'display:flex;align-items:center;gap:10px;flex-wrap:wrap;' });
            head.appendChild(el('h3', { text: editing ? '✏️ 修改公告' : '📢 发布公告', style: 'margin:0;' }));
            head.appendChild(el('div', { style: 'flex:1;' }));
            if (editing) {
                head.appendChild(el('button', { class: 'ghost', text: '取消修改', onclick: () => {
                    state.editingAnnouncementId = null;
                    redraw();
                } }));
            }
            card.appendChild(head);

            const content = el('textarea', {
                rows: 3, placeholder: '输入公告内容，例如：今晚 22:00-23:00 打印机保养，暂停接单',
                style: 'resize:vertical;line-height:1.6;',
            });

            const fontSel = el('select');
            Object.keys(ANNOUNCE_FONTS).forEach(k => fontSel.appendChild(el('option', { value: k, text: ANNOUNCE_FONTS[k].label })));
            const sizeInput = el('input', { type: 'number', min: 12, max: 28, value: 15 });
            const colorInput = el('input', { type: 'color', value: '#1f2328', style: 'height:38px;padding:2px;' });

            // 三个控件各有一个可见的说明文字，用 aria-label 把它们变成控件的可访问名，
            // 不然读屏软件只会念「组合框」「数字输入框」
            fontSel.setAttribute('aria-label', '字体');
            sizeInput.setAttribute('aria-label', '字号，12 到 28');
            colorInput.setAttribute('aria-label', '文字颜色');
            const styleRow = el('div', { class: 'style-row' }, [
                el('label', { for: fontSel.id }, [el('div', { class: 'muted', text: '字体' }), fontSel]),
                el('label', { for: sizeInput.id }, [el('div', { class: 'muted', text: '字号 (12-28)' }), sizeInput]),
                el('label', { for: colorInput.id }, [el('div', { class: 'muted', text: '颜色' }), colorInput]),
            ]);
            [content, fontSel, sizeInput, colorInput].forEach((n, i) => {
                if (!n.id) n.id = uid('ann');
                n.setAttribute('data-fk', 'announce-' + i);
            });

            const preview = el('div', { class: 'announce-preview', 'aria-live': 'off' });
            function syncPreview() {
                applyAnnounceStyle(preview, content.value.trim(), fontSel.value, sizeInput.value, colorInput.value);
            }
            content.addEventListener('input', syncPreview);
            fontSel.addEventListener('change', syncPreview);
            sizeInput.addEventListener('input', syncPreview);
            colorInput.addEventListener('input', syncPreview);

            card.appendChild(field('公告内容', content));
            card.appendChild(styleRow);
            card.appendChild(el('div', { class: 'field' }, [
                el('div', { class: 'muted', id: 'announcePreviewLabel', text: '效果预览' }), preview,
            ]));
            preview.setAttribute('aria-labelledby', 'announcePreviewLabel');

            const msg = el('div', { class: 'msg', id: 'announceAdminMsg' });
            const actions = el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;' }, [
                el('button', { text: editing ? '保存修改' : '发布公告', onclick: submit }),
            ]);
            card.appendChild(el('div', { class: 'field' }, [actions, msg]));

            const list = el('div', { id: 'announceList', style: 'margin-top:6px;' });
            card.appendChild(list);

            // 预填要编辑的公告（放在最后，保证上面的 preview 等节点已就位）
            if (a) {
                content.value = a.content || '';
                fontSel.value = ANNOUNCE_FONTS[a.font_family] ? a.font_family : 'system';
                sizeInput.value = a.font_size || 15;
                colorInput.value = ANNOUNCE_COLOR_RE.test(a.font_color || '') ? a.font_color : '#1f2328';
            }
            syncPreview();

            async function submit() {
                const text = content.value.trim();
                if (!text) {
                    setMsg('announceAdminMsg', '❌ 公告内容不能为空', 'err');
                    markInvalid(content, 'announceAdminMsg');
                    content.focus();
                    return;
                }
                clearInvalid(content);
                const body = {
                    content: text,
                    font_family: fontSel.value,
                    font_size: Number(sizeInput.value) || 15,
                    font_color: colorInput.value,
                };
                // 编辑走 PUT（不改变是否生效），发布走 POST（自动成为当前生效公告）
                const data = editing
                    ? await api('/api/admin/announcements/' + state.editingAnnouncementId, { method: 'PUT', body: JSON.stringify(body) })
                    : await api('/api/admin/announcements', { method: 'POST', body: JSON.stringify(body) });
                if (reportResult('announceAdminMsg', data)) {
                    state.editingAnnouncementId = null;
                    await fetchNotices();
                    await redraw();
                }
            }
            return card;
        }

        async function loadAnnouncementsAdmin() {

            if (!list) return;
            showLoading(list, () => emptyState('公告列表加载中…', '⏳'));
            const data = await api('/api/admin/announcements');
            list.textContent = '';
            if (data.code !== 0) {
                list.appendChild(emptyState('公告列表加载失败', '⚠️'));

            }

            if (!data.announcements.length) {
                list.appendChild(emptyState('暂无历史公告', '📭'));

            list.appendChild(el('h4', { text: '历史公告', style: 'margin:var(--sp-3) 0 0;' }));
            data.announcements.forEach(a => {

                const main = el('div', { class: 't-main' });

                ]));
                main.appendChild(el('div', { class: 't-preview' },
                    [el('span', { text: (a.author ? '发布人：' + a.author + ' · ' : '') + (a.update_time || '') })]));

                acts.appendChild(el('button', { class: (a.is_active ? 'ghost ' : '') + 'hit',
                    text: a.is_active ? '停用' : '启用',
                    'aria-label': (a.is_active ? '停用公告：' : '启用公告：') + a.content.slice(0, 20),

                acts.appendChild(el('button', { class: 'danger hit', text: '删除',
