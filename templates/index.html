        // ==== SVG 图表：原生手绘，不依赖任何外部 CDN ====
        // 两条硬规矩：
        //   1) 画布尺寸按容器实测宽度来算，不用固定 viewBox 缩放着画 ——
        //      缩放的代价是轴标签跟着一起缩，手机上会缩到 3px 根本看不见。
        //   2) 颜色按「实体」固定（见 ENTITY_COLORS），不按过滤后的下标取色 ——
        //      否则筛掉一类，剩下的颜色会集体挪位，同一个状态换个颜色。

        // 图表配色取自 dataviz 校验通过的调色板（亮度带 / 彩度下限 / 色觉分离 /
        // 对浅底与深底的对比度全部通过）。写成 CSS 变量，深浅色各一套，
        // SVG 里用 style="stroke:var(--viz-x)" 引用，切主题不用重画。
        const ENTITY_COLORS = {
            // 订单状态：与表格里的状态徽章同色系，看图就能对上表
            '待打印': 'var(--viz-pending)',
            '打印中': 'var(--viz-printing)',
            '可取了': 'var(--viz-ready)',
            '已取件': 'var(--viz-done)',
            // 角色：超管 / 管理员 / 普通用户
            'super': 'var(--viz-a)',
            'admin': 'var(--viz-b)',
            'user': 'var(--viz-c)',
            // 其它二元维度
            '黑白': 'var(--viz-a)', '彩色': 'var(--viz-b)',
            '单面': 'var(--viz-a)', '双面': 'var(--viz-b)',
            // 兜底：没登记的实体按 PALETTE 顺序取
        };

        function entityColor(label, index) {
            if (ENTITY_COLORS[label]) return ENTITY_COLORS[label];
            return PALETTE[index % PALETTE.length];
        }

        // '2026-09-13' → '09-13'。只认这种形状，别的标签原样保留 ——
        // 之前统一 slice(5)，把短标签切成了 '-09-13' 这种残废字符串。
        function shortDateLabel(label) {
            const s = String(label == null ? '' : label);
            const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
            return m ? m[2] + '-' + m[3] : s;
        }

        // Y 轴上界取一个「整」的数，刻度落在 4 段左右
        function niceScale(max) {
            const step0 = Math.max(1, Math.ceil(max / 4));
            const mag = Math.pow(10, Math.floor(Math.log10(step0)));
            const norm = step0 / mag;
            const nice = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
            const step = nice * mag;
            const top = Math.max(step, Math.ceil(max / step) * step);
            const ticks = [];
            for (let v = 0; v <= top + 1e-9; v += step) ticks.push(Math.round(v));
            return { top: top, ticks: ticks };
        }

        // 柱子：只有顶端两个角是圆的（数据端），底端贴基线保持方角
        function barPath(x, y, w, h, r) {
            const rr = Math.max(0, Math.min(r, w / 2, h));
            return 'M' + x.toFixed(1) + ',' + (y + h).toFixed(1)
                + 'L' + x.toFixed(1) + ',' + (y + rr).toFixed(1)
                + 'Q' + x.toFixed(1) + ',' + y.toFixed(1) + ' ' + (x + rr).toFixed(1) + ',' + y.toFixed(1)
                + 'L' + (x + w - rr).toFixed(1) + ',' + y.toFixed(1)
                + 'Q' + (x + w).toFixed(1) + ',' + y.toFixed(1) + ' ' + (x + w).toFixed(1) + ',' + (y + rr).toFixed(1)
                + 'L' + (x + w).toFixed(1) + ',' + (y + h).toFixed(1)
                + 'Z';
        }

        // 容器宽度实测后再画；容器变宽变窄（旋屏、侧栏折叠）自动重画
        function mountChart(host, draw) {
            const render = () => {
                const w = Math.max(200, Math.round(host.clientWidth || 320));
                if (host.__lastW === w) return;
                host.__lastW = w;
                host.textContent = '';
                host.appendChild(draw(w));
            };
            render();
            if (window.ResizeObserver) new ResizeObserver(render).observe(host);
        }

        function barChart(items, width) {
            const w = width, h = 200;
            const values = items.map(d => Number(d.value) || 0);
            const scale = niceScale(Math.max(1, Math.max.apply(null, values)));
            const padL = Math.max(30, 10 + String(scale.top).length * 7);
            const padR = 10, padT = 22;
            const slot = (w - padL - padR) / Math.max(items.length, 1);
            const rotated = slot < 34;            // 槽位太窄就把日期斜过来排
            const padB = rotated ? 46 : 26;
            const plotH = h - padT - padB;
            const yOf = v => h - padB - plotH * (v / scale.top);

            const summary = items.map(d => shortDateLabel(d.label) + ' ' + d.value + ' 单').join('；');
            const svg = svgEl('svg', { width: w, height: h, viewBox: '0 0 ' + w + ' ' + h,
                role: 'img', 'aria-label': '每日下单量：' + summary });

            // 网格线 + Y 轴刻度：有刻度才读得出柱子多高
            scale.ticks.forEach(v => {
                const y = yOf(v);
                svg.appendChild(svgEl('line', {
                    class: v === 0 ? 'chart-axis' : 'chart-grid',
                    x1: padL, y1: y.toFixed(1), x2: w - padR, y2: y.toFixed(1),
                }));
                const t = svgEl('text', { class: 'chart-tick', x: padL - 6, y: (y + 4).toFixed(1), 'text-anchor': 'end' });
                t.textContent = String(v);
                svg.appendChild(t);
            });

            items.forEach((d, i) => {
                const v = Number(d.value) || 0;
                const bh = v > 0 ? Math.max(2, plotH * (v / scale.top)) : 0;
                const bw = Math.max(3, Math.min(slot * 0.62, 30));
                const x = padL + i * slot + (slot - bw) / 2;
                const y = h - padB - bh;
                if (bh > 0) {
                    const bar = svgEl('path', { class: 'chart-bar', d: barPath(x, y, bw, bh, 4) });
                    const tip = svgEl('title', {});
                    tip.textContent = shortDateLabel(d.label) + '：' + v + ' 单';
                    bar.appendChild(tip);
                    svg.appendChild(bar);
                }
                // 数值直接标在柱顶：<title> 只能悬停看，触屏和键盘都拿不到
                if (v > 0 && slot >= 14) {
                    const num = svgEl('text', { class: 'chart-value',
                        x: (x + bw / 2).toFixed(1), y: (y - 5).toFixed(1), 'text-anchor': 'middle' });
                    if (slot < 24) num.style.fontSize = '10px';
                    num.textContent = String(v);
                    svg.appendChild(num);
                }
                const cx = padL + i * slot + slot / 2;
                const labY = h - padB + 14;
                const lab = svgEl('text', { class: 'chart-tick', x: cx.toFixed(1), y: labY.toFixed(1),
                    'text-anchor': rotated ? 'end' : 'middle' });
                if (rotated) lab.setAttribute('transform', 'rotate(-45 ' + cx.toFixed(1) + ' ' + labY.toFixed(1) + ')');
                lab.textContent = shortDateLabel(d.label);
                svg.appendChild(lab);
            });
            return svg;
        }

        function donutChart(items) {
            const size = 168, sw = 26, r = (size - sw) / 2 - 3, cx = size / 2, cy = size / 2;
            const total = items.reduce((s, d) => s + (Number(d.value) || 0), 0);
            const svg = svgEl('svg', { width: size, height: size, viewBox: '0 0 ' + size + ' ' + size,
                role: 'img', 'aria-label': items.map(d => d.label + ' ' + d.value).join('，') + '，合计 ' + total });
            if (total <= 0) {
                svg.appendChild(svgEl('circle', { class: 'chart-empty', cx: cx, cy: cy, r: r,
                    fill: 'none', 'stroke-width': sw }));
            } else {
                const C = 2 * Math.PI * r;
                // 相邻扇区之间留 3px 底色缝，色觉障碍下也能靠边界分辨
                const gap = items.length > 1 ? 3 : 0;
                let offset = 0;
                items.forEach(d => {
                    const v = Number(d.value) || 0;
                    const len = C * (v / total);
                    if (v <= 0) return;
                    const drawn = Math.max(len - gap, 1.5);
                    const arc = svgEl('circle', {
                        cx: cx, cy: cy, r: r, fill: 'none',
                        style: 'stroke:' + d.color, 'stroke-width': sw,
                        'stroke-dasharray': drawn.toFixed(2) + ' ' + (C - drawn).toFixed(2),
                        'stroke-dashoffset': (-offset).toFixed(2),
                        transform: 'rotate(-90 ' + cx + ' ' + cy + ')',
                    });
                    const tip = svgEl('title', {});
                    tip.textContent = d.label + '：' + v + '（' + Math.round(v / total * 100) + '%）';
                    arc.appendChild(tip);
                    svg.appendChild(arc);
                    offset += len;
                });
            }
            const num = svgEl('text', { class: 'chart-total', x: cx, y: cy + 2, 'text-anchor': 'middle',
                'dominant-baseline': 'middle' });
            num.textContent = String(total);
            svg.appendChild(num);
            const cap = svgEl('text', { class: 'chart-tick', x: cx, y: cy + 20, 'text-anchor': 'middle' });
            cap.textContent = '总计';
            svg.appendChild(cap);
            return svg;
        }

        function kpiCard(num, label) {
            return el('div', { class: 'card kpi' }, [
                el('div', { class: 'num', text: String(num) }),
                el('div', { class: 'lab', text: label }),
            ]);
        }

        // 图表的文字版：读屏软件念不出图形，就给它一份数据
        function chartDataList(items) {
            return el('div', { class: 'sr-only' }, [
                el('p', { text: '数据：' }),
                el('ul', {}, items.map(d => el('li', { text: d.label + '：' + d.value }))),
            ]);
        }

        function barCard(title, items) {
            const card = el('div', { class: 'card card-wide' });
            card.appendChild(el('h3', { text: title }));
            const host = el('div', { class: 'chart' });
            card.appendChild(host);
            card.appendChild(chartDataList(items));
            mountChart(host, w => barChart(items, w));
            return card;
        }

        function donutCard(title, items) {
            const card = el('div', { class: 'card' });
            card.appendChild(el('h3', { text: title }));
            // 颜色先按「实体」定好，再做过滤；这样筛掉一类不会让剩下的换色
            const colored = items.map((d, i) => Object.assign({}, d, { color: d.color || entityColor(d.label, i) }));
            const clean = colored.filter(d => (Number(d.value) || 0) > 0);
            if (!clean.length) {
                card.appendChild(emptyState('暂无数据', '📊'));
                return card;
            }
            const wrap = el('div', { style: 'display:flex;gap:16px;align-items:center;flex-wrap:wrap;' });
            const host = el('div', { class: 'chart', style: 'flex:none;' });
            wrap.appendChild(host);
            host.appendChild(donutChart(clean));
            const total = clean.reduce((s, d) => s + (Number(d.value) || 0), 0);
            const lg = el('div', { class: 'legend', style: 'flex-direction:column;gap:6px;flex:1;min-width:120px;' });
            clean.forEach(d => lg.appendChild(el('span', {}, [
                el('i', { style: 'background:' + d.color, 'aria-hidden': 'true' }),
                d.label + '：' + d.value + '（' + Math.round(d.value / total * 100) + '%）',
            ])));
            wrap.appendChild(lg);
            card.appendChild(wrap);
            card.appendChild(chartDataList(clean));
            return card;
        }

        // ==== 管理员 / 超管：数据可视化 ====
        async function loadStats() {
            const box = $('statsBox');
            if (!box) return;
            showLoading(box, () => el('div', { class: 'card' }, [emptyState('统计数据加载中…', '⏳')]));
            const data = await api('/api/admin/stats');
            box.textContent = '';
            if (data.code !== 0) {
                box.appendChild(el('div', { class: 'card' }, [emptyState('统计数据加载失败', '⚠️')]));
                return;
            }
            const kpis = el('div', { class: 'kpi-grid', style: 'margin-bottom:var(--sp-4);' });
            kpis.appendChild(kpiCard(data.users.total, '注册账号总数'));
            kpis.appendChild(kpiCard(data.users.active, '启用账号'));
            kpis.appendChild(kpiCard(data.users.disabled, '已禁用账号'));
            kpis.appendChild(kpiCard(data.users.new_7d, '近 7 天新增账号'));
            kpis.appendChild(kpiCard(data.orders.total, '订单总数'));
            kpis.appendChild(kpiCard(data.orders.claimed, '已被接单'));
            kpis.appendChild(kpiCard(data.orders.unclaimed, '待接单'));
            box.appendChild(kpis);

            const charts = el('div', { class: 'grid' });
            charts.appendChild(barCard('每日下单量（近 14 天）', (data.daily || []).map(d => ({ label: d.date, value: d.count }))));
            // 颜色按角色实体给，不按数组下标 —— 顺序变了颜色也不会跟着挪
            charts.appendChild(donutCard('账号角色分布', ROLE_ORDER.map(r => ({
                label: roleLabel(r), value: (data.users.by_role || {})[r] || 0, color: entityColor(r, 0),
            }))));
            charts.appendChild(donutCard('订单状态分布', STATUSES.map(s => ({
                label: s, value: (data.orders.by_status || {})[s] || 0, color: entityColor(s, 0),
            }))));
            charts.appendChild(donutCard('打印类别分布', [
                { label: '黑白', value: (data.orders.by_color || {}).black || 0 },
                { label: '彩色', value: (data.orders.by_color || {}).color || 0 },
            ]));
            charts.appendChild(donutCard('单 / 双面分布', [
                { label: '单面', value: (data.orders.by_duplex || {}).single || 0 },
                { label: '双面', value: (data.orders.by_duplex || {}).double || 0 },
            ]));
            box.appendChild(charts);

            const top = el('div', { class: 'card' });
            top.appendChild(el('h3', { text: '接单排行 Top 5' }));
            const list = data.top_claimers || [];
            if (!list.length) {
                top.appendChild(emptyState('暂无接单记录', '🏅'));
            } else {
                list.forEach((t, i) => top.appendChild(el('div', { style: 'padding:4px 0;',
                    text: (i + 1) + '. ' + t.nickname + ' —— ' + t.c + ' 单' })));
            }
            box.appendChild(top);
        }

        // ==== 管理员 / 超管：账号管理 ====
        // 两种角色共用同一张表，列由 userColumns() 按角色现算：
        //   密码列默认不存在，只有超管点开查看密码才出现；
        //   操作列只有超管有（改角色 / 禁用 / 删除都是超管专属）。
        function userColumns() {
            const cols = ['ID', '昵称', '姓名', '学号', '宿舍', '联系方式'];
            if (state.showPasswords) cols.push('密码');
            cols.push('角色', '状态', '下单数', '接单数', '注册时间', '最后登录');
            if (state.user && state.user.role === 'super') cols.push('操作');
            return cols;
        }

        function usersCard() {
            const card = el('div', { class: 'card' });
            const head = el('div', { style: 'display:flex;align-items:center;gap:10px;' });
            head.appendChild(el('h3', { text: '👥 账号管理', style: 'margin:0;' }));
            head.appendChild(el('div', { style: 'flex:1;' }));
            head.appendChild(el('button', { class: 'ghost', text: '🔄 刷新', onclick: loadUsers }));
            card.appendChild(head);

            const table = el('table', { style: 'margin-top:12px;' });
            table.appendChild(el('thead', {}, [el('tr', { id: 'userHeadRow' })]));
            table.appendChild(el('tbody', { id: 'userBody' }));
            const scroller = tableScroller('账号列表');
            scroller.querySelector('.table-wrap').appendChild(table);
            card.appendChild(scroller);
            card.appendChild(el('div', { class: 'msg', id: 'userMsg' }));

            // 查看密码故意做得很不起眼，塞在右下角，默认没人会注意到，
            // 需要时超管自己点一下，列表才切成带密码的版本。
            if (state.user && state.user.role === 'super') {
                const foot = el('div', { style: 'text-align:right;margin-top:var(--sp-1);' });
                foot.appendChild(el('button', {
                    id: 'pwToggle', class: 'pw-toggle hit',
                    text: state.showPasswords ? '🔒 隐藏密码' : '🔑 查看密码',
                    'data-fk': 'pwToggle',
                    onclick: togglePasswords,
                }));
                card.appendChild(foot);
            }
            return card;
        }

        function userRow(u) {
            const tr = el('tr');
            tr.appendChild(td(u.id));
            tr.appendChild(td(u.nickname));
            // 留空的字段显示 -，免得表格出现一片分不清是空还是没渲染的空白
            tr.appendChild(td(u.real_name || '-'));
            tr.appendChild(td(u.student_id || '-'));
            tr.appendChild(td(u.dorm || '-'));
            const cInfo = CONTACT_HINTS[u.contact_type];
            tr.appendChild(td(u.contact ? (cInfo ? cInfo.label + '：' : '') + u.contact : '-'));
            if (state.showPasswords) {
                tr.appendChild(el('td', {}, [el('span', { class: 'pw', text: u.password || '（无法解密）' })]));
            }
            tr.appendChild(el('td', {}, [el('span', { class: 'role-badge role-' + u.role, text: u.role_label })]));
            tr.appendChild(td(u.status === 'active' ? '启用' : '已禁用'));
            tr.appendChild(td(u.order_count));
            tr.appendChild(td(u.claimed_count));
            tr.appendChild(td(u.create_time || ''));
            tr.appendChild(td(u.last_login || '从未登录'));

            // 操作列只有超管有：改角色 / 禁用 / 删除都是超管专属
            if (!(state.user && state.user.role === 'super')) return tr;

            const box = el('div', { class: 'row-actions' });
            const isSelf = state.user && u.id === state.user.id;
            if (u.role === 'super') {
                box.appendChild(el('span', { class: 'muted', text: '超级管理员' }));
            } else {
                if (u.role === 'user') {
                    box.appendChild(el('button', { class: 'hit', text: '升为管理员',
                        'aria-label': '把 ' + u.nickname + ' 升为管理员', onclick: () => setRole(u.id, 'admin') }));
                } else {
                    box.appendChild(el('button', { class: 'ghost hit', text: '降为普通用户',
                        'aria-label': '把 ' + u.nickname + ' 降为普通用户', onclick: () => setRole(u.id, 'user') }));
                }
                if (!isSelf) {
                    if (u.status === 'active') {
                        box.appendChild(el('button', { class: 'danger hit', text: '禁用',
                            'aria-label': '禁用账号 ' + u.nickname, onclick: () => setUserStatus(u.id, 'disabled') }));
                    } else {
                        box.appendChild(el('button', { class: 'hit', text: '启用',
                            'aria-label': '启用账号 ' + u.nickname, onclick: () => setUserStatus(u.id, 'active') }));
                    }
                    box.appendChild(el('button', { class: 'danger hit', text: '删除',
                        'aria-label': '删除账号 ' + u.nickname, onclick: () => deleteUser(u) }));
                }
            }
            tr.appendChild(el('td', { class: 'col-actions' }, [box]));
            return tr;
        }

        async function loadUsers() {
            const tbody = $('userBody');
            if (!tbody) return;
            const cols = userColumns().length;
            tbody.setAttribute('aria-busy', 'true');
            showLoading(tbody, () => tableLoadingRow(cols, '账号列表加载中'));
            // 密码要显式申请；服务器只认超管的这个参数，管理员带了也拿不到
            const data = await api('/api/admin/users' + (state.showPasswords ? '?with_password=1' : ''));
            tbody.textContent = '';
            tbody.removeAttribute('aria-busy');
            if (data.code !== 0) {
                setMsg('userMsg', '❌ ' + (data.msg || '加载失败'), 'err');
                tbody.appendChild(tableEmptyRow(cols, '加载失败', '⚠️'));
                annotateTable(tbody.closest('table'));
                syncTableScrollers();
                return;
            }
            // 以服务器返回为准同步开关，避免前端状态和实际拿到的数据对不上
            state.showPasswords = !!data.with_password;
            syncPasswordToggle();

            // 表头可能因角色 / 密码列变化，先重算再填数据，data-label 才对得上
            const headRow = $('userHeadRow');
            if (headRow) {
                headRow.textContent = '';
                userColumns().forEach(t => headRow.appendChild(el('th', { text: t })));
            }
            setMsg('userMsg', '共 ' + data.total_users + ' 个账号', '');
            if (!data.users.length) {
                tbody.appendChild(tableEmptyRow(userColumns().length, '暂无账号', '📭'));
            } else {
                data.users.forEach(u => tbody.appendChild(userRow(u)));
            }
            annotateTable(tbody.closest('table'));
            syncTableScrollers();
        }

        function syncPasswordToggle() {
            const btn = $('pwToggle');
            if (btn) btn.textContent = state.showPasswords ? '🔒 隐藏密码' : '🔑 查看密码';
        }

        async function togglePasswords() {
            state.showPasswords = !state.showPasswords;
            syncPasswordToggle();
            await loadUsers();
        }

        async function setRole(id, role) {
            const data = await api('/api/admin/user/' + id + '/role', {
                method: 'PUT', body: JSON.stringify({ role: role }),
            });
            setMsg('userMsg', (data.code === 0 ? '✅ ' : '❌ ') + (data.msg || ''), data.code === 0 ? 'ok' : 'err');
            if (data.code === 0) { await loadUsers(); await loadStats(); }
        }

        async function setUserStatus(id, status) {
            const data = await api('/api/admin/user/' + id + '/status', {
                method: 'PUT', body: JSON.stringify({ status: status }),
            });
            setMsg('userMsg', (data.code === 0 ? '✅ ' : '❌ ') + (data.msg || ''), data.code === 0 ? 'ok' : 'err');
            if (data.code === 0) { await loadUsers(); await loadStats(); }
        }

        async function deleteUser(u) {
            const who = u.nickname + (u.real_name ? '（' + u.real_name + '）' : '');
            if (!window.confirm('确定删除账号「' + who + '」吗？该账号的订单会保留但解除归属。')) return;
            const data = await api('/api/admin/user/' + u.id, { method: 'DELETE' });
            setMsg('userMsg', (data.code === 0 ? '✅ ' : '❌ ') + (data.msg || ''), data.code === 0 ? 'ok' : 'err');
            if (data.code === 0) { await loadUsers(); await loadStats(); }
        }

        // ==== 公告 ====
        // 只负责拉取并写入 state，不动 DOM。
        // 之前把获取 + renderApp 放在一个函数里，曾在 refreshAll 中与 loadTickets 并行执行，
        // 结果 renderApp 把刚填好的工单列表整个重建掉，所以拆开来并显式控制渲染时机。
        async function fetchAnnouncement() {
            const data = await api('/api/announcement');
            if (data.code !== 0) return;
            const before = state.announcement ? state.announcement.id : null;
            state.announcement = data.announcement;
            // 换了一条新公告就重新弹出来，同一条则尊重用户之前已关闭的选择
            if (!state.announcement || state.announcement.id !== before) state.announcementHidden = false;
        }

        function announcementBar() {
            const a = state.announcement;
            const font = ANNOUNCE_FONTS[a.font_family] || ANNOUNCE_FONTS.system;
            // role="status"：公告是页面加载后可能突然出现的，读屏软件要主动播报
            const barEl = el('div', { class: 'announce-bar', role: 'status' });
            barEl.appendChild(el('span', { class: 'announce-icon', text: '📢', 'aria-hidden': 'true' }));
            // 内容只用 textContent：即使管理员写了 HTML 也只会当普通文字展示
            barEl.appendChild(el('div', {
                class: 'announce-body',
                text: a.content,
                style: 'font-family:' + font.css + ';font-size:' + a.font_size + 'px;color:' + a.font_color + ';',
            }));
            barEl.appendChild(el('button', {
                class: 'announce-close hit', text: '✕', title: '关闭公告',
                'aria-label': '关闭公告',
                onclick: () => setAnnouncementHidden(true),
            }));
            return barEl;
        }

        // 只动公告栏和顶栏按钮这两个节点，不重建整页
        function setAnnouncementHidden(hidden) {
            state.announcementHidden = hidden;
            const app = $('app');
            const barNode = app.querySelector('.announce-bar');
            const trigger = document.activeElement;
            if (hidden) {
                if (barNode) barNode.remove();
            } else if (state.announcement && !barNode) {
                app.insertBefore(announcementBar(), app.firstChild);
            }
            const toggle = $('announceToggle');
            if (toggle) toggle.style.display = (state.announcement && hidden) ? '' : 'none';
            // 公告栏关掉后，触发它关闭的那个按钮也一起没了，焦点得送到接替它的节点上，
            // 否则焦点会掉回 body，键盘用户从这里开始就迷路了
            if (hidden && trigger && !document.contains(trigger)) {
                const next = $('announceToggle') || $('app').querySelector('button');
                if (next) next.focus();
            }
        }

        function applyAnnounceStyle(node, content, fontKey, size, color) {
            const font = ANNOUNCE_FONTS[fontKey] || ANNOUNCE_FONTS.system;
            node.textContent = content || '（公告预览）';
            node.style.fontFamily = font.css;
            node.style.fontSize = Math.min(28, Math.max(12, Number(size) || 15)) + 'px';
            node.style.color = color || '#1f2328';
        }

        function announcementAdminCard() {
            const editing = state.editingAnnouncementId != null;
            const a = editing ? (state.announcements || []).find(x => x.id === state.editingAnnouncementId) : null;

            const card = el('div', { class: 'card' });
            const head = el('div', { style: 'display:flex;align-items:center;gap:10px;flex-wrap:wrap;' });
            head.appendChild(el('h3', { text: editing ? '✏️ 修改公告' : '📢 发布公告', style: 'margin:0;' }));
            head.appendChild(el('div', { style: 'flex:1;' }));
            if (editing) {
                head.appendChild(el('button', { class: 'ghost', text: '取消修改', onclick: () => {
                    state.editingAnnouncementId = null;
                    redraw();
                } }));
            }
            card.appendChild(head);

            const content = el('textarea', {
                rows: 3, placeholder: '输入公告内容，例如：今晚 22:00-23:00 打印机保养，暂停接单',
                style: 'resize:vertical;line-height:1.6;',
            });

            const fontSel = el('select');
            Object.keys(ANNOUNCE_FONTS).forEach(k => fontSel.appendChild(el('option', { value: k, text: ANNOUNCE_FONTS[k].label })));
            const sizeInput = el('input', { type: 'number', min: 12, max: 28, value: 15 });
            const colorInput = el('input', { type: 'color', value: '#1f2328', style: 'height:38px;padding:2px;' });

            // 三个控件各有一个可见的说明文字，用 aria-label 把它们变成控件的可访问名，
            // 不然读屏软件只会念「组合框」「数字输入框」
            fontSel.setAttribute('aria-label', '字体');
            sizeInput.setAttribute('aria-label', '字号，12 到 28');
            colorInput.setAttribute('aria-label', '文字颜色');
            const styleRow = el('div', { class: 'style-row' }, [
                el('label', { for: fontSel.id }, [el('div', { class: 'muted', text: '字体' }), fontSel]),
                el('label', { for: sizeInput.id }, [el('div', { class: 'muted', text: '字号 (12-28)' }), sizeInput]),
                el('label', { for: colorInput.id }, [el('div', { class: 'muted', text: '颜色' }), colorInput]),
            ]);
            [content, fontSel, sizeInput, colorInput].forEach((n, i) => {
                if (!n.id) n.id = uid('ann');
                n.setAttribute('data-fk', 'announce-' + i);
            });

            const preview = el('div', { class: 'announce-preview', 'aria-live': 'off' });
            function syncPreview() {
                applyAnnounceStyle(preview, content.value.trim(), fontSel.value, sizeInput.value, colorInput.value);
            }
            content.addEventListener('input', syncPreview);
            fontSel.addEventListener('change', syncPreview);
            sizeInput.addEventListener('input', syncPreview);
            colorInput.addEventListener('input', syncPreview);

            card.appendChild(field('公告内容', content));
            card.appendChild(styleRow);
            card.appendChild(el('div', { class: 'field' }, [
                el('div', { class: 'muted', id: 'announcePreviewLabel', text: '效果预览' }), preview,
            ]));
            preview.setAttribute('aria-labelledby', 'announcePreviewLabel');

            const msg = el('div', { class: 'msg', id: 'announceAdminMsg' });
            const actions = el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;' }, [
                el('button', { text: editing ? '保存修改' : '发布公告', onclick: submit }),
            ]);
            card.appendChild(el('div', { class: 'field' }, [actions, msg]));

            const list = el('div', { id: 'announceList', style: 'margin-top:6px;' });
            card.appendChild(list);

            // 预填要编辑的公告（放在最后，保证上面的 preview 等节点已就位）
            if (a) {
                content.value = a.content || '';
                fontSel.value = ANNOUNCE_FONTS[a.font_family] ? a.font_family : 'system';
                sizeInput.value = a.font_size || 15;
                colorInput.value = ANNOUNCE_COLOR_RE.test(a.font_color || '') ? a.font_color : '#1f2328';
            }
            syncPreview();

            async function submit() {
                const text = content.value.trim();
                if (!text) {
                    setMsg('announceAdminMsg', '❌ 公告内容不能为空', 'err');
                    markInvalid(content, 'announceAdminMsg');
                    content.focus();
                    return;
                }
                clearInvalid(content);
                const body = {
                    content: text,
                    font_family: fontSel.value,
                    font_size: Number(sizeInput.value) || 15,
                    font_color: colorInput.value,
                };
                // 编辑走 PUT（不改变是否生效），发布走 POST（自动成为当前生效公告）
                const data = editing
                    ? await api('/api/admin/announcements/' + state.editingAnnouncementId, { method: 'PUT', body: JSON.stringify(body) })
                    : await api('/api/admin/announcements', { method: 'POST', body: JSON.stringify(body) });
                setMsg('announceAdminMsg', (data.code === 0 ? '✅ ' : '❌ ') + (data.msg || ''), data.code === 0 ? 'ok' : 'err');
                if (data.code === 0) {
                    state.announceFlash = { text: '✅ ' + (data.msg || ''), type: 'ok' };
                    state.editingAnnouncementId = null;
                    await fetchAnnouncement();
                    await redraw();
                }
            }
            return card;
        }

        async function loadAnnouncementsAdmin() {
            const list = $('announceList');
            if (!list) return;
            // 操作成功后会发生整页重绘、提示条也会被重建，所以用 flash 把结果重新贴回去
            if (state.announceFlash) {
                setMsg('announceAdminMsg', state.announceFlash.text, state.announceFlash.type);
                state.announceFlash = null;
            }
            showLoading(list, () => emptyState('公告列表加载中…', '⏳'));
            const data = await api('/api/admin/announcements');
            list.textContent = '';
            if (data.code !== 0) {
                list.appendChild(emptyState('公告列表加载失败', '⚠️'));
                return;
            }
            state.announcements = data.announcements;
            if (!data.announcements.length) {
                list.appendChild(emptyState('暂无历史公告', '📭'));
                return;
            }
            list.appendChild(el('h4', { text: '历史公告', style: 'margin:var(--sp-3) 0 0;' }));
            data.announcements.forEach(a => {
                const row = el('div', { class: 'ticket-item' });
                const main = el('div', { class: 't-main' });
                main.appendChild(el('div', { class: 't-subject' }, [
                    el('span', { class: 'status-badge ' + (a.is_active ? 'status-open' : 'status-closed'),
                        text: a.is_active ? '生效中' : '已停用' }),
                    el('span', { text: a.content.length > 26 ? a.content.slice(0, 26) + '…' : a.content }),
                ]));
                main.appendChild(el('div', { class: 't-preview' },
                    [el('span', { text: (a.author ? '发布人：' + a.author + ' · ' : '') + (a.update_time || '') })]));
                row.appendChild(main);
                const acts = el('div', { class: 'row-actions' });
                acts.appendChild(el('button', { class: 'hit', text: '编辑',
                    'aria-label': '编辑公告：' + a.content.slice(0, 20),
                    onclick: () => { state.editingAnnouncementId = a.id; redraw(); } }));
                acts.appendChild(el('button', { class: (a.is_active ? 'ghost ' : '') + 'hit',
                    text: a.is_active ? '停用' : '启用',
                    'aria-label': (a.is_active ? '停用公告：' : '启用公告：') + a.content.slice(0, 20),
                    onclick: () => setAnnouncementActive(a.id, !a.is_active) }));
                acts.appendChild(el('button', { class: 'danger hit', text: '删除',
                    'aria-label': '删除公告：' + a.content.slice(0, 20),
                    onclick: () => deleteAnnouncement(a.id) }));
                row.appendChild(acts);
                list.appendChild(row);
            });
        }

        async function setAnnouncementActive(id, active) {
            const data = await api('/api/admin/announcements/' + id + '/active', {
                method: 'PUT', body: JSON.stringify({ active: active }),
            });
            setMsg('announceAdminMsg', (data.code === 0 ? '✅ ' : '❌ ') + (data.msg || ''), data.code === 0 ? 'ok' : 'err');
            if (data.code === 0) {
                state.announceFlash = { text: '✅ ' + (data.msg || ''), type: 'ok' };
                await fetchAnnouncement();
                await redraw();
            }
        }

        async function deleteAnnouncement(id) {
            if (!window.confirm('确定删除这条公告吗？此操作不可恢复。')) return;
            const data = await api('/api/admin/announcements/' + id, { method: 'DELETE' });
            setMsg('announceAdminMsg', (data.code === 0 ? '✅ ' : '❌ ') + (data.msg || ''), data.code === 0 ? 'ok' : 'err');
            if (data.code === 0) {
                if (state.editingAnnouncementId === id) state.editingAnnouncementId = null;
                state.announceFlash = { text: '✅ ' + (data.msg || ''), type: 'ok' };
                await fetchAnnouncement();
                await redraw();
            }
        }

        // ==== 工单（站内信） ====
        function ticketsCard(isStaff) {
            const card = el('div', { class: 'card' });
            const head = el('div', { style: 'display:flex;align-items:center;gap:10px;flex-wrap:wrap;' });
            head.appendChild(el('h3', { text: '🎫 工单', style: 'margin:0;' }));
            head.appendChild(el('span', { class: 'badge-dot', id: 'ticketBadge', style: 'display:none;' }));
            head.appendChild(el('div', { style: 'flex:1;' }));
            if (isStaff) {
                const sel = el('select', { style: 'width:auto;', 'aria-label': '工单状态筛选',
                    'data-fk': 'ticket-filter',
                    onchange: (e) => {
                        state.ticketFilter = e.target.value;
                        loadTickets();
                    } }, [
                    el('option', { value: '', text: '全部状态' }),
                    el('option', { value: 'open', text: '进行中' }),
                    el('option', { value: 'closed', text: '已关闭' }),
                ]);
                sel.value = state.ticketFilter;
                head.appendChild(sel);
            }
            head.appendChild(el('button', { class: 'ghost', text: '🔄 刷新', onclick: loadTickets }));
            card.appendChild(head);

            if (!isStaff) {
                const subject = el('input', { type: 'text', placeholder: '一句话描述问题，例如：打印出来缺页' });
                const body = el('textarea', { rows: 3, placeholder: '详细描述：文件名 / 打印要求 / 出现的问题', style: 'resize:vertical;' });
                // aria-expanded / aria-controls 让读屏软件知道这是一块可展开的区域
                const toggleBtn = el('button', { text: '＋ 发起工单', 'aria-expanded': 'false',
                    'aria-controls': 'ticketForm', onclick: () => toggle() });
                const formBox = el('div', { id: 'ticketForm', style: 'display:none;', });
                formBox.appendChild(field('标题', subject, { fk: 'ticket-subject' }));
                formBox.appendChild(field('详细描述', body, { fk: 'ticket-body' }));
                const msg = el('div', { class: 'msg', id: 'ticketMsg' });
                formBox.appendChild(el('div', { class: 'field' }, [el('button', { text: '提交工单', onclick: submit }), msg]));
                card.appendChild(el('div', { style: 'margin-top:var(--sp-3);' }, [toggleBtn]));
                card.appendChild(formBox);

                function toggle() {
                    const box = $('ticketForm');
                    const opening = box.style.display === 'none';
                    box.style.display = opening ? 'block' : 'none';
                    toggleBtn.textContent = opening ? '✕ 收起' : '＋ 发起工单';
                    toggleBtn.setAttribute('aria-expanded', opening ? 'true' : 'false');
                    if (opening) subject.focus();
                }
                async function submit() {
                    const s = subject.value.trim();
                    const b = body.value.trim();
                    if (s.length < 2) {
                        setMsg('ticketMsg', '❌ 标题至少 2 个字', 'err');
                        markInvalid(subject, 'ticketMsg'); subject.focus(); return;
                    }
                    if (b.length < 2) {
                        setMsg('ticketMsg', '❌ 描述至少 2 个字', 'err');
                        markInvalid(body, 'ticketMsg'); body.focus(); return;
                    }
                    clearInvalid(formBox);
                    const data = await api('/api/tickets', {
                        method: 'POST', body: JSON.stringify({ subject: s, body: b }),
                    });
                    setMsg('ticketMsg', (data.code === 0 ? '✅ ' : '❌ ') + (data.msg || ''), data.code === 0 ? 'ok' : 'err');
                    if (data.code === 0) {
                        subject.value = ''; body.value = '';
                        await loadTickets();
                        openTicket(data.id);
                    }
                }
            }

            card.appendChild(el('div', { id: 'ticketList', style: 'margin-top:var(--sp-1);' }));
            return card;
        }

        async function loadTickets() {
            const list = $('ticketList');
            if (!list) return;
            list.setAttribute('aria-busy', 'true');
            showLoading(list, () => emptyState('工单加载中…', '⏳'));
            const data = await api('/api/tickets' + (state.ticketFilter ? '?status=' + encodeURIComponent(state.ticketFilter) : ''));
            list.textContent = '';
            list.removeAttribute('aria-busy');
            if (data.code !== 0) {
                list.appendChild(emptyState('工单加载失败', '⚠️'));
                return;
            }
            state.tickets = data.tickets;
            const badge = $('ticketBadge');
            if (badge) {
                badge.textContent = data.unread_total;
                badge.style.display = data.unread_total ? 'inline-block' : 'none';
                badge.setAttribute('aria-label', '未读 ' + data.unread_total + ' 条');
            }
            if (!data.tickets.length) {
                list.appendChild(emptyState(data.staff ? '暂无工单' : '还没有工单，遇到问题可以点上面「＋ 发起工单」', '📭'));
                return;
            }
            data.tickets.forEach(t => {
                // 条目是可点的，就得能用键盘打开：给它 tabindex + 按钮语义 + Enter/Space
                const item = el('div', {
                    class: 'ticket-item is-clickable', role: 'button', tabindex: '0',
                    'aria-label': (t.status === 'open' ? '进行中' : '已关闭') + '工单：' + t.subject
                        + (t.unread ? '，' + t.unread + ' 条未读' : ''),
                    onclick: () => openTicket(t.id),
                    onkeydown: (e) => {
                        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
                            e.preventDefault();
                            openTicket(t.id);
                        }
                    },
                });
                const main = el('div', { class: 't-main' });
                const sub = el('div', { class: 't-subject' });
                sub.appendChild(el('span', { class: 'status-badge ' + (t.status === 'open' ? 'status-open' : 'status-closed'),
                    text: t.status === 'open' ? '进行中' : '已关闭' }));
                sub.appendChild(el('span', { text: t.subject }));
                if (t.unread) sub.appendChild(el('span', { class: 'badge-dot', text: t.unread }));
                main.appendChild(sub);
                main.appendChild(el('div', { class: 't-preview', text: t.last_body || '' }));
                item.appendChild(main);
                const meta = el('div', { class: 't-meta' });
                if (data.staff && t.owner_nickname) meta.appendChild(el('div', { text: '👤 ' + t.owner_nickname }));
                meta.appendChild(el('div', { text: t.update_time || '' }));
                meta.appendChild(el('div', { text: t.msg_count + ' 条消息' }));
                item.appendChild(meta);
                list.appendChild(item);
            });
        }

        async function openTicket(id) {
            // 记下是谁打开的、排在第几行：关掉之后焦点要还给这张卡片，键盘用户才不用从头找起。
            // 记位置而不是记节点，是因为关窗时列表会整块重建，原来的节点已经不在文档里了。
            const opener = document.activeElement;
            const openerList = $('ticketList');
            const openerIndex = openerList
                ? Array.from(openerList.querySelectorAll('.ticket-item')).indexOf(opener) : -1;
            const data = await api('/api/tickets/' + id);
            if (data.code !== 0) {
                toast('❌ ' + (data.msg || '打开工单失败'), 'err');
                return;
            }
            const t = data.ticket;
            const titleId = uid('mt');
            const mask = el('div', { class: 'modal-mask', onclick: (e) => { if (e.target === mask) close(); } });
            const modal = el('div', {
                class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titleId,
            });

            const head = el('div', { class: 'modal-head' });
            head.appendChild(el('span', { class: 'status-badge ' + (t.status === 'open' ? 'status-open' : 'status-closed'),
                text: t.status === 'open' ? '进行中' : '已关闭' }));
            head.appendChild(el('span', { class: 'm-title', id: titleId, text: t.subject }));
            head.appendChild(el('button', { class: 'announce-close hit', text: '✕', 'aria-label': '关闭工单窗口',
                onclick: () => close() }));
            modal.appendChild(head);

            const bodyEl = el('div', { class: 'modal-body' });
            if (!data.messages.length) {
                bodyEl.appendChild(emptyState('暂无消息', '💬'));
            }
            data.messages.forEach(m => {
                // 气泡左右按是不是自己发的决定
                const mine = m.sender_id === state.user.id;
                // 署名要同时看谁发的和发送者身份：
                // 只看 sender_id 会把管理员发给我的回复也标成我，必须再按 sender_role 区分。
                const senderIsStaff = m.sender_role !== 'user';
                let who;
                if (mine) who = senderIsStaff ? '我（管理员）' : '我';
                else if (senderIsStaff) who = state.user.role === 'user' ? '客服' : '管理员 ' + (m.sender_nickname || '');
                else who = '用户 ' + (m.sender_nickname || '');
                const row = el('div', { class: 'bubble-row' + (mine ? ' mine' : '') });
                row.appendChild(el('div', { class: 'bubble-meta', text: who + ' · ' + (m.create_time || '') }));
                row.appendChild(el('div', { class: 'bubble', text: m.body }));
                bodyEl.appendChild(row);
            });
            modal.appendChild(bodyEl);

            const replyBox = el('input', { type: 'text', 'aria-label': '回复内容',
                placeholder: t.status === 'closed' ? '工单已关闭' : '输入回复…',
                disabled: t.status === 'closed' });
            const foot = el('div', { class: 'modal-foot' });
            foot.appendChild(replyBox);
            // 工单关闭时连发送按钮一起禁用，避免看起来还能发但实际发不出去
            foot.appendChild(el('button', { text: '发送', disabled: t.status === 'closed', onclick: send }));
            foot.appendChild(el('button', { class: t.status === 'open' ? 'ghost' : '',
                text: t.status === 'open' ? '关闭工单' : '重新打开', onclick: toggleStatus }));
            // 弹窗里的报错就地显示：把用户看的内容换掉去弹 alert 会打断阅读
            const modalMsg = el('div', { class: 'msg', id: 'ticketModalMsg' });
            foot.appendChild(modalMsg);
            modal.appendChild(foot);

            mask.appendChild(modal);
            document.body.appendChild(mask);
            const releaseTrap = trapFocus(modal);
            // Esc 关窗；焦点陷阱只拦 Tab，这里单独处理退出键
            const onKey = (e) => {
                if (e.key === 'Escape') { e.preventDefault(); close(); }
            };
            document.addEventListener('keydown', onKey);
            bodyEl.scrollTop = bodyEl.scrollHeight;
            setTimeout(() => replyBox.focus(), 30);

            let closed = false;
            function close() {
                if (closed) return;
                closed = true;
                releaseTrap();
                document.removeEventListener('keydown', onKey);
                mask.remove();
                // 先刷新列表（已读状态、未读数都会变），列表重建完再把焦点还回原来那一行
                loadTickets().then(() => {
                    const list = $('ticketList');
                    if (!list) return;
                    const items = Array.from(list.querySelectorAll('.ticket-item'));
                    if (!items.length) return;
                    const target = items[openerIndex] || items[0];
                    if (target) target.focus();
                });
            }
            async function send() {
                const text = replyBox.value.trim();
                if (!text) {
                    setMsg('ticketModalMsg', '❌ 请输入回复内容', 'err');
                    markInvalid(replyBox, 'ticketModalMsg');
                    replyBox.focus();
                    return;
                }
                const res = await api('/api/tickets/' + id + '/messages', {
                    method: 'POST', body: JSON.stringify({ body: text }),
                });
                if (res.code !== 0) {
                    setMsg('ticketModalMsg', '❌ ' + (res.msg || '发送失败'), 'err');
                    return;
                }
                replyBox.value = '';
                close();
                openTicket(id);
            }
            async function toggleStatus() {
                const next = t.status === 'open' ? 'closed' : 'open';
                const res = await api('/api/tickets/' + id + '/status', {
                    method: 'PUT', body: JSON.stringify({ status: next }),
                });
                if (res.code !== 0) {
                    setMsg('ticketModalMsg', '❌ ' + (res.msg || '操作失败'), 'err');
                    return;
                }
                close();
                // 重开弹窗，让用户立刻看到状态变化（按钮也会跟着变）
                openTicket(id);
            }
        }

        // ==== 启动 ====
        bootstrap();
    </script>
</body>
</html>
