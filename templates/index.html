<!DOCTYPE html>
<html lang="zh">
<head>
    <!-- ⚠️ 这是经典版界面，**当前路由不到**：app.py 里 UI_SWITCH_ENABLED = False，
         全站只跑新版（frontend/src/）。保留它只是留一条退路。
         把开关改成 True 之前，先读 app.py 里那一段「复活前必须先补上」的清单：
         这个单文件模板不认识计费（待计费 → 接单人填金额）、身份审核、预设打印 /
         纸张规格、大文件分片上传，账号管理页还会平铺渲染全站明文密码。
         改开关不会有任何报错，缺口会直接暴露给用户。 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小猫娘打印服务</title>
    <!-- 图标。缺了这条，浏览器每次整页加载都会额外去要 /favicon.ico，拿到 404
         并被打成 WARNING 记进访问日志 —— 那个级别是留给参数错/未登录/越权的，
         不该被缺图标刷屏。
         指到 static/app/favicon.svg，也就是新版界面在用的那一份：同一个物理文件
         两套界面共用，不另存一份，否则两个图标早晚各改各的。
         路径照样走 url_for，将来静态目录挪地方只改这一行。 -->
    <link rel="icon" href="{{ url_for('static', filename='app/favicon.svg') }}" type="image/svg+xml">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        /* ==================== 设计令牌 ====================
           颜色、间距、圆角、字号一律走变量，组件里不再出现硬编码值。
           间距 4px 基准 6 档，圆角 3 档，字号 5 档（另有 1 个只给 KPI 大数字的展示号）。 */
        :root {
            /* ============ 品牌色：粉 → 紫 融合 ============
               粉取自参考页「二次元风格表单页」（#F6947D → #F37F96），
               紫取自参考页「左右滑动风格表单页-2」（#775CE5）。
               渐变分三档用途，别互相顶替：
                 · --brand-grad       装饰用亮色渐变（插图蒙层、色块、细装饰条），不承载文字
                 · --brand-grad-text  标题渐变文字，每一档都验过对白底 ≥3:1（大字 AA）
                 · --btn-grad         按钮底色渐变，每一档都验过白字 ≥4.5:1（小字 AA）
               参考页那种「亮粉底 + 白字」实测只有 2.2:1，直接用是不合格的。 */
            --brand-pink: #f6947d;
            --brand-magenta: #f37f96;
            --brand-purple: #775ce5;
            --brand-grad: linear-gradient(120deg, #f6947d 0%, #f37f96 45%, #a97bea 100%);
            --brand-grad-text: linear-gradient(100deg, #c9542f 0%, #c93f6b 50%, #6b46d8 100%);
            /* 按钮渐变单独一条：紫 → 洋红，不带橙。
               不带橙不是审美问题，是对比度问题：亮橙要配白字就得压到发赭（#b8452c），
               那种砖红色和整页的清透粉紫完全不搭。换成紫→洋红后三档实测 5.1 / 4.7 / 4.8:1，
               既过了标，又和背景照片里的紫藤、粉樱同一个色系。 */
            --btn-grad: linear-gradient(100deg, #7a52dd 0%, #9a4fd6 55%, #c0457f 100%);
            --btn-grad-hover: linear-gradient(100deg, #6d46cf 0%, #8c42c9 55%, #b23a73 100%);
            --brand-grad-soft: linear-gradient(120deg, rgba(246,148,125,.16) 0%, rgba(247,127,150,.16) 45%, rgba(169,123,234,.18) 100%);
            /* 背景照片：整页固定铺满。路径由 Jinja 生成，换图只改 static/img 下的文件 */
            --bg-photo: url("{{ url_for('static', filename='img/sakura-bg.jpg') }}");
            /* 表面：卡片做成半透明玻璃，让樱花背景透出来，同时不牺牲正文对比度 */
            --bg: #faf5fb;
            --surface: rgba(255,255,255,.90);
            --surface-solid: #ffffff;    /* 需要完全不透明的地方（<input type=color> 之类） */
            --surface-sunken: rgba(250,244,252,.82);   /* 卡片里的凹陷区：表头、模态正文 */
            --surface-soft: rgba(245,238,251,.92);     /* 淡底：次级按钮、未选中标签 */
            --surface-hover: rgba(253,243,249,.92);
            /* 文字与描边 */
            --ink: #2c2431;
            --ink-muted: #6d6277;        /* 白底 5.7:1，小字也过 AA */
            --line: rgba(119,92,229,.20);
            --line-soft: rgba(119,92,229,.12);
            --edge: rgba(58,38,80,.14);  /* 横向滚动提示的渐隐 */
            --edge-0: rgba(58,38,80,0);
            /* 强调色：品牌紫一系。全站只有这一套，不再有第二个强调色 */
            --accent: #775ce5;
            --accent-strong: #6a4ed4;    /* hover，比基准更深，白字 5.5:1 */
            --accent-soft: rgba(119,92,229,.12);
            --accent-line: rgba(119,92,229,.30);
            --accent-ink: #5a3fc7;       /* 淡底上的文字 */
            --on-accent: #ffffff;
            --focus-color: #775ce5;
            --focus-ring: 0 0 0 3px rgba(119,92,229,.30);
            /* 语义状态：底色 / 文字成对，徽章和提示共用。
               这一组刻意不跟品牌色走 —— 成功/失败/警告的色相是有含义的，
               染成粉紫反而认不出来。只在明度上做了一点暖调，好和背景融得住。 */
            --ok: #146c37;      --ok-bg: #e2f6e9;
            --err: #b3261e;     --err-bg: #fde8e7;
            --warn: #8a5300;    --warn-bg: #fdefd8;
            --info: #0f6076;    --info-bg: #e0f4f8;
            --neutral: #4a4351; --neutral-bg: #efeaf4;
            /* 角色徽章：只有普通用户和管理员两种。
               这一层刻意不留第三档配色 —— 配色一旦存在，早晚会有人把某个角色接上去，
               「两种角色」这个对外口径从样式表就开始保持。 */
            --role-user-ink: #5a3fc7;  --role-user-bg: #ece4fd;
            --role-admin-ink: #8a5300; --role-admin-bg: #fdeecd;
            /* 图表配色：按「实体」固定，深浅色各一套。
               每一档都跑过 dataviz 的调色板校验（亮度带 / 彩度下限 / 色觉分离 /
               对浅底与深底的对比度），换色前请重新跑一遍再改。 */
            --viz-bar: #7c5ce0;       /* 单序列柱状图专用色。
                                          它不在分类调色板 PALETTE 里，没有「和别的颜色区分」的任务，
                                          只要求图形对比度 ≥3:1。实测白底 4.71:1、暗底 6.10:1，
                                          所以可以直接换成品牌紫，让唯一的图形元素和整页粉色咬合。
                                          其余 --viz-* 是供饼图区分实体的分类色，不动。 */
            --viz-pending: #b45309;   /* 待打印 */
            --viz-printing: #0369a1;  /* 打印中 */
            --viz-ready: #16a34a;     /* 可取件 */
            --viz-done: #7c3aed;      /* 已取件 */
            --viz-a: #2a78d6;         /* 通用第 1 类 */
            --viz-b: #eb6834;         /* 通用第 2 类 */
            --viz-c: #1baf7a;         /* 通用第 3 类 */
            /* 公告纸面：故意不跟随暗色模式 —— 正文颜色由管理员自定，配浅底才可读 */
            --paper: #ffffff;
            --paper-soft: #fff8fc;
            --paper-tint: #fdeef6;
            --paper-line: #f7d9e8;
            --paper-ink: #2c2431;
            --paper-muted: #6d6277;
            /* 红底上的文字：浅色模式用白，深色模式的 --err 是浅红，得反过来用深字 */
            --on-err: #ffffff;
            /* 间距 */
            --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
            /* 圆角：比改造前松一档，配合玻璃质感 */
            --r-sm: 10px; --r-md: 16px; --r-pill: 999px;
            /* 字号 */
            --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px;
            --fs-display: 26px;
            /* 动效 */
            --dur-fast: 110ms; --dur: 180ms; --dur-slow: 260ms;
            --ease: cubic-bezier(.2, .7, .3, 1);
            /* 阴影：带一点紫调，别用纯黑 —— 纯黑压在粉色背景上会发脏 */
            --shadow-1: 0 1px 2px rgba(74,45,110,.06), 0 2px 8px rgba(74,45,110,.06);
            --shadow-2: 0 6px 18px rgba(74,45,110,.10), 0 1px 3px rgba(74,45,110,.06);
            --shadow-3: 0 20px 52px rgba(74,45,110,.24), 0 2px 8px rgba(74,45,110,.10);
            /* 玻璃拟态：卡片统一用这套，改一个地方全站生效 */
            --glass-blur: saturate(140%) blur(14px);
            --glass-edge: rgba(255,255,255,.60);   /* 卡片顶部那道高光 */
            /* 触控目标：视觉可以小，热区不能小于这个。
               --tap 给表单控件用；--tap-dense / --hit 给表格行内的小按钮用，
               鼠标场景可以松一档，触摸场景由下面的媒体查询抬回 44。 */
            --tap: 44px;
            --tap-dense: 26px;   /* 表格行内小按钮的视觉高度，和改造前一致 */
            --hit: 32px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* 深色不是把浅色翻过来，是按深紫底重新取的一档 */
                --bg: #16111c;
                --surface: rgba(38,29,49,.84);
                --surface-solid: #221a2c;
                --surface-sunken: rgba(28,21,37,.78);
                --surface-soft: rgba(56,44,71,.88);
                --surface-hover: rgba(56,44,71,.66);
                --ink: #f2ebf7;
                --ink-muted: #b0a2bf;        /* 深底 7.0:1 */
                --line: rgba(178,150,220,.22);
                --line-soft: rgba(178,150,220,.13);
                --edge: rgba(255,255,255,.14);
                --edge-0: rgba(255,255,255,0);
                /* 品牌渐变在深色下整体提亮一档，不然压在暗背景上像块煤 */
                --brand-grad: linear-gradient(120deg, #f7a68f 0%, #f58fa4 45%, #b48ff0 100%);
                --brand-grad-text: linear-gradient(100deg, #f8a184 0%, #f78ea8 50%, #b79bf2 100%);
                --brand-grad-soft: linear-gradient(120deg, rgba(246,148,125,.18) 0%, rgba(247,127,150,.18) 45%, rgba(169,123,234,.22) 100%);
                --accent: #6d50dc;           /* 深色下压暗，保证按钮上的白字仍过 5:1 */
                --accent-strong: #7d61e8;
                --accent-soft: rgba(119,92,229,.24);
                --accent-line: rgba(154,123,240,.42);
                --accent-ink: #cbb8ff;
                --on-accent: #ffffff;
                --focus-color: #b9a3ff;
                --focus-ring: 0 0 0 3px rgba(185,163,255,.35);
                --ok: #7ee2a8;      --ok-bg: #12301f;
                --err: #f7a3a3;     --err-bg: #3a1519;
                --warn: #f3c97a;    --warn-bg: #3a2c12;
                --info: #7fd8ea;    --info-bg: #0d2f3a;
                --neutral: #c6bdd0; --neutral-bg: #2a2334;
                --role-user-ink: #cbb8ff;  --role-user-bg: #2a1f4d;
                --role-admin-ink: #f2cd7a; --role-admin-bg: #3a2f10;
                --paper: #fff8fc;
                --paper-soft: #fff8fc;
                --paper-tint: #fdeef6;
                --paper-line: #f7d9e8;
                --paper-ink: #2c2431;
                --paper-muted: #6d6277;
                --glass-edge: rgba(255,255,255,.10);
                --on-err: #2a1013;
                /* 深色不是把浅色翻过来，是按深底重新取的一档，同样验过 */
                --viz-bar: #a98cf0;
                --viz-pending: #d97706;
                --viz-printing: #0d9fe0;
                --viz-ready: #16a34a;
                --viz-done: #9085e9;
                --viz-a: #3987e5;
                --viz-b: #d95926;
                --viz-c: #199e70;
                --shadow-1: 0 1px 2px rgba(0,0,0,.40);
                --shadow-2: 0 4px 14px rgba(0,0,0,.45);
                --shadow-3: 0 18px 48px rgba(0,0,0,.60);
            }
        }

        html { -webkit-text-size-adjust: 100%; background-color: var(--bg); }
        body {
            font-family: system-ui, "Microsoft YaHei", Arial, sans-serif;
            font-size: var(--fs-md); line-height: 1.5;
            max-width: 1180px; margin: 0 auto; padding: var(--sp-4);
            /* 背景交给下面那层固定的 .bg-photo，body 自己保持透明 ——
               否则 max-width:1080px 会连背景一起限宽，照片缩成中间一条 */
            background: transparent; color: var(--ink);
        }

        /* ==================== 装饰层：樱花背景 + 飘落花瓣 ====================
           两层都是纯装饰：aria-hidden、pointer-events:none、z-index 负值，
           保证它们永远不参与交互，也永远不会盖住任何可点元素。 */
        .bg-photo {
            position: fixed; inset: 0; z-index: -2;
            background-image: var(--bg-photo);
            background-position: center; background-repeat: no-repeat; background-size: cover;
            background-color: var(--bg);
        }
        /* 蒙层：照片本身明暗很杂，直接往上放字会有一段看不清。
           但也不该盖死 —— 这张图是特意找来的，盖成白墙就白找了。
           所以只压一层很轻的纱：真正承载文字的卡片自己有 90% 不透明底，
           不靠这层蒙纱保证可读性。 */
        .bg-photo::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(255,252,254,.52) 0%, rgba(255,250,253,.34) 40%, rgba(250,242,255,.62) 100%);
        }
        @media (prefers-color-scheme: dark) {
            /* 深色模式两步走：先把照片本身压暗（filter 改的是像素，比黑纱自然），
               再用深紫纱把残余的亮部拉下来 */
            .bg-photo { filter: brightness(.62) saturate(.85); }
            .bg-photo::after {
                background: linear-gradient(180deg, rgba(22,17,28,.55) 0%, rgba(22,17,28,.44) 40%, rgba(22,17,28,.70) 100%);
            }
        }
        /* 花瓣画布：像素尺寸由 JS 按 devicePixelRatio 算，这里只管铺满和置底 */
        .sakura-canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none; }

        /* 玻璃质感：全站容器共用这一处，改一个地方全站生效。
           不支持 backdrop-filter 的浏览器退回 --surface 自带的半透明色，
           不会退化成全透明，所以文字不会被照片吃掉。 */
        @supports (backdrop-filter: blur(1px)) {
            .card, .topbar, .side, .modal, .auth-card {
                backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            }
        }
        h1 { font-size: var(--fs-xl); margin: 0; line-height: 1.25; letter-spacing: -.01em; }
        h3 { margin: 0 0 var(--sp-3); font-size: var(--fs-lg); line-height: 1.3; letter-spacing: -.005em; }
        h4 { margin: 0 0 var(--sp-2); font-size: var(--fs-md); }
        p { margin: 0 0 var(--sp-2); }

        /* 只给读屏软件的文本 */
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

        /* 卡片：玻璃面 + 顶部一道内高光，边缘就不会像贴上去的一张白纸 */
        .card { background: var(--surface); padding: var(--sp-4); border: 1px solid var(--line-soft);
            box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow-1);
            border-radius: var(--r-md); margin-bottom: var(--sp-4); }

        label { font-size: var(--fs-sm); color: var(--ink-muted); display: inline-block; }

        input, select, textarea, button {
            padding: 9px 11px; margin: var(--sp-1) 0; border: 1px solid var(--line);
            border-radius: var(--r-sm); font-size: var(--fs-md); font-family: inherit;
            color: var(--ink); background: var(--surface);
            transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease),
                        box-shadow var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
        }
        input:not([type=checkbox]):not([type=radio]), select, textarea { min-height: var(--tap); }
        input:not([type=checkbox]):not([type=radio]), select, textarea { width: 100%; }
        input::placeholder, textarea::placeholder { color: var(--ink-muted); opacity: .75; }
        /* 文本类控件在鼠标点击时也算 focus-visible（规范如此），所以这里只管外观 */
        input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: none; border-color: var(--accent); box-shadow: var(--focus-ring);
        }
        input:disabled, select:disabled, textarea:disabled { background: var(--surface-sunken); color: var(--ink-muted); cursor: not-allowed; }
        input[aria-invalid="true"], textarea[aria-invalid="true"], select[aria-invalid="true"] {
            border-color: var(--err); box-shadow: 0 0 0 3px var(--err-bg);
        }

        /* 文件选择框：全站就剩它还是浏览器原生的灰白方块，一排控件里最扎眼。
           里面的「选择文件」按钮要用伪元素 ::file-selector-button 才能改，普通选择器够不着。

           ⚠️ 易踩的坑：别把 ::file-selector-button 和旧别名 ::-webkit-file-upload-button
           写进同一个逗号选择器列表里。Firefox 不认识 -webkit- 那个伪元素，
           而「选择器列表里只要有一个无效，整条规则就被丢掉」——
           结果在 Firefox 里两条都没生效，按钮又变回灰白色。
           拆成两条独立规则，各自承担，互不牵连。 */
        input[type="file"] {
            display: block; width: 100%; min-height: var(--tap);
            padding: var(--sp-2) var(--sp-3);
            background: var(--surface-sunken);
            border: 1px dashed var(--line);
            color: var(--ink-muted); font-size: var(--fs-sm);
        }
        input[type="file"]:hover { border-color: var(--accent-line); background: var(--surface-soft); }
        input[type="file"]:focus-visible { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }
        input[type="file"]::file-selector-button {
            margin: 0 var(--sp-3) 0 0; padding: 7px 14px; min-height: 34px;
            appearance: none; -webkit-appearance: none; cursor: pointer;
            font: inherit; font-weight: 600; color: var(--on-accent);
            background-color: var(--accent); background-image: var(--btn-grad);
            border: none; border-radius: var(--r-sm);
            box-shadow: 0 2px 10px rgba(119,92,229,.24);
            transition: background-color var(--dur-fast) var(--ease);
        }
        input[type="file"]::-webkit-file-upload-button {
            margin: 0 var(--sp-3) 0 0; padding: 7px 14px; min-height: 34px;
            appearance: none; -webkit-appearance: none; cursor: pointer;
            font: inherit; font-weight: 600; color: var(--on-accent);
            background-color: var(--accent); background-image: var(--btn-grad);
            border: none; border-radius: var(--r-sm);
            box-shadow: 0 2px 10px rgba(119,92,229,.24);
            transition: background-color var(--dur-fast) var(--ease);
        }
        input[type="file"]::file-selector-button:hover { background-image: var(--btn-grad-hover); }
        input[type="file"]::-webkit-file-upload-button:hover { background-image: var(--btn-grad-hover); }

        button {
            width: auto; min-height: 40px; color: var(--on-accent);
            border: 1px solid transparent; cursor: pointer; font-weight: 500;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            /* 主按钮走品牌渐变（粉→紫）。
               底下那行 background-color 是兼容兼帯：渐变是 background-image，
               万一浏览器不支持，底色仍是一个合格的颜色。
               下面那些例外按钮（.ghost / .danger / .tabs button …）用的都是
               background 简写，会直接把 background-image 重置成 none，
               所以不需要逐个去关掉渐变。 */
            background-color: var(--accent); background-image: var(--btn-grad);
            box-shadow: 0 2px 10px rgba(119,92,229,.24);
        }
        button:hover:not(:disabled) { background-color: var(--accent-strong); background-image: var(--btn-grad-hover);
            box-shadow: 0 4px 16px rgba(119,92,229,.32); }
        button:active:not(:disabled) { transform: scale(.97); }
        button.ghost { background: var(--surface-soft); color: var(--ink); border-color: var(--line); box-shadow: none; }
        button.ghost:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-ink); box-shadow: none; }
        /* 「次级实心」：给订单行里那一排「→ 打印中 / → 可取件」用。
           之前它们和「接单」一样是通体渐变，一行里四五个同样饱和的按钮互相抢，
           主操作（接单）反而喊不出来。现在按钮分三档，一眼能看出轻重：
             实心渐变 = 主操作（接单、发送、提交）
             淡紫底    = 次级（改状态）——有颜色但压得住
             中性底    = 辅助（释放、下载、取消）
           悬停时次级直接变成实心渐变，等于预告「它也能成为主操作」。 */
        button.soft { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); box-shadow: none; }
        button.soft:hover:not(:disabled) { background: var(--accent); background-image: var(--btn-grad);
            color: var(--on-accent); border-color: transparent; box-shadow: 0 2px 10px rgba(119,92,229,.28); }
        button.danger { background: var(--err-bg); color: var(--err); border-color: transparent; box-shadow: none; }
        button.danger:hover:not(:disabled) { background: var(--err); color: var(--surface-solid); box-shadow: none; }
        /* 禁用态也要可读：深灰底 + 次级文字，白底 4.9:1 */
        button:disabled { background: var(--neutral-bg); color: var(--ink-muted); cursor: not-allowed; }
        button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid var(--focus-color); outline-offset: 2px;
        }

        /* 扩大热区但不撑大视觉：伪元素把可点区域撑到 --hit。
           触摸设备上 --hit 是 44px；鼠标设备上收到 32px（仍高于 WCAG 2.5.8 的
           24px 下限）—— 44 是触摸标准，桌面表格里每行都按 44 排会把
           「一屏 12 单」挤成「一屏 4 单」。 */
        .hit { position: relative; }
        .hit::after {
            content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: max(100%, var(--hit)); height: max(100%, var(--hit));
        }

        /* ---------- 表格：宽表容器内横向滚动，窄屏改卡片堆叠 ---------- */
        .table-scroll { position: relative; }
        .table-scroll::before, .table-scroll::after {
            content: ''; position: absolute; top: 2px; bottom: 2px; width: 18px; z-index: 1;
            pointer-events: none; opacity: 0; transition: opacity var(--dur) var(--ease); border-radius: var(--r-sm);
        }
        .table-scroll.is-scrollable:not(.at-end)::after {
            opacity: 1; right: 2px; background: linear-gradient(to left, var(--edge), var(--edge-0));
        }
        .table-scroll.is-scrollable:not(.at-start)::before {
            opacity: 1; left: 2px; background: linear-gradient(to right, var(--edge), var(--edge-0));
        }
        .table-scroll .scroll-hint { display: none; color: var(--ink-muted); font-size: var(--fs-xs);
            margin-top: var(--sp-2); text-align: center; }
        .table-scroll.is-scrollable .scroll-hint { display: block; }
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--r-sm); }
        .table-wrap:focus-visible { outline: 2px solid var(--focus-color); outline-offset: 2px; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 9px var(--sp-2); border-bottom: 1px solid var(--line); text-align: left;
            font-size: var(--fs-sm); vertical-align: top;
            /* break-word 只在真的放不下时才断词，不影响列的 min-content 宽度；
               anywhere 会把每列都压到最小内容宽，10 列的表格会被挤成一条竖线 */
            overflow-wrap: break-word; }
        th { color: var(--accent-ink); font-weight: 600; background: var(--surface-sunken); white-space: nowrap; }
        tbody tr:hover { background: var(--surface-hover); }

        .status-badge, .role-badge { padding: 3px 9px; border-radius: var(--r-pill);
            font-size: var(--fs-xs); line-height: 1.4; white-space: nowrap; display: inline-block; }
        .st-待打印 { background: var(--warn-bg); color: var(--warn); }
        .st-打印中 { background: var(--info-bg); color: var(--info); }
        .st-可取件 { background: var(--ok-bg); color: var(--ok); }
        .st-已取件 { background: var(--neutral-bg); color: var(--neutral); }
        .role-user  { background: var(--role-user-bg);  color: var(--role-user-ink); }
        .role-admin { background: var(--role-admin-bg); color: var(--role-admin-ink); }
        .status-open   { background: var(--info-bg); color: var(--info); }
        .status-closed { background: var(--neutral-bg); color: var(--neutral); }

        /* 统一反馈通道：把结果写进 .msg，不再用 alert() */
        .msg { margin-top: var(--sp-2); font-size: var(--fs-sm); min-height: 18px; color: var(--ink-muted); }
        .msg.ok { color: var(--ok); }
        .msg.err { color: var(--err); }
        .muted { color: var(--ink-muted); font-size: var(--fs-xs); }

        .topbar { position: relative; overflow: hidden; display: flex; align-items: center; gap: var(--sp-3);
            background: var(--surface); padding: var(--sp-3) var(--sp-4); border: 1px solid var(--line-soft);
            border-radius: var(--r-md); box-shadow: var(--shadow-2); margin-bottom: var(--sp-4); flex-wrap: wrap; }
        /* 顶栏底部一道品牌渐变：全站唯一一处固定出现的彩色饰条，做「品牌钉」 */
        .topbar::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
            background: var(--brand-grad); }
        .topbar h1 { color: var(--accent-ink); }
        @supports (background-clip: text) or (-webkit-background-clip: text) {
            .topbar h1 { background: var(--brand-grad-text); -webkit-background-clip: text;
                background-clip: text; color: transparent; }
        }
        .topbar .spacer { flex: 1; }

        /* ==================== 主界面骨架：侧边栏 + 单页内容 ====================
           之前所有面板堆在一列里，滚到哪儿算哪儿。问题不在长，而在「没有落点」：
           十张表格同时存在于 DOM，数据也要一次性全拉，用户想找工单得先划过订单和统计。
           现在拆成一页一功能，导航固定在左边，任何时刻屏幕上只有一个功能的内容。 */
        .layout { display: flex; align-items: flex-start; gap: var(--sp-4); }
        /* sticky 而不是 fixed：fixed 要自己算边距，内容区一改就得跟着改数字；
           sticky 交给布局自己算，顶栏高度变化也不会错位。 */
        .side { flex: 0 0 184px; position: sticky; top: var(--sp-3);
            background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-md);
            box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow-1); padding: var(--sp-2); }
        .side-nav { display: flex; flex-direction: column; gap: 2px; }
        /* 导航项不做成药丸：竖排一列时，每项各带一块底色会把一列切成一段一段的按钮堆，
           视线没有连续的通道。这里用左对齐的「行」，只有选中项铺渐变，层级一眼分明。 */
        .side-nav button { display: flex; align-items: center; gap: var(--sp-2); width: 100%;
            justify-content: flex-start; text-align: left; padding: 8px 10px; min-height: var(--tap);
            font-weight: 500; color: var(--ink); border-color: transparent;
            /* background 简写会一并清掉基础 button 规则里的 background-image（--btn-grad），
               否则未选中的导航项也会带着渐变底色 */
            background: none; box-shadow: none; }
        .side-nav button:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent-ink);
            border-color: transparent; box-shadow: none; }
        .side-nav button[aria-current="page"],
        .side-nav button[aria-current="page"]:hover:not(:disabled) {
            background-color: var(--accent); background-image: var(--btn-grad); color: var(--on-accent);
            box-shadow: 0 2px 10px rgba(119,92,229,.28); }
        .side-nav .si { flex: none; width: 1.25em; text-align: center; font-size: var(--fs-md); }
        /* min-width:0 是必须的：flex 子项默认 min-width:auto，
           内容里的宽表格会把它顶出去，整页长出横向滚动条 */
        .content { flex: 1; min-width: 0; }
        .page-head { margin-bottom: var(--sp-4); }
        /* 页面标题用实色而不是渐变字：渐变字在整站里只属于顶栏那一个品牌标记，
           每换一页就多一处渐变，那个标记就不值钱了 */
        .page-head .page-title { margin: 0; font-size: var(--fs-xl); font-weight: 600; color: var(--accent-ink); }
        .page-head .page-desc { margin-top: 2px; }

        .grid { display: grid; gap: var(--sp-4); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
        /* 时间序列图占满一整行：14 个点挤在 220px 里，日期标签只能斜着排还互相压 */
        .grid > .card-wide { grid-column: 1 / -1; }
        /* KPI 是短数字，用更小的下限，免得手机上 7 张卡竖着排一屏 */
        .kpi-grid { display: grid; gap: var(--sp-3); grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); }
        /* 卡片装进网格后，外边距交给 gap 管，别再各留各的 */
        .grid > .card, .kpi-grid > .card { margin-bottom: 0; }

        /* 分段控件：和登录页的「登录/注册」切换同一个观感 —— 一条淡紫轨道 + 一个渐变选中项。
           这里不用 .auth-switch 那个滑动 thumb：.tabs 的选中项由 JS 重建，
           轨道里塞绝对定位的滑块容易在重绘后错位，直接给选中项铺渐变底色更稳。
           注意 background 简写会把基础 button 规则里的 background-image（--btn-grad）一并清掉，
           否则未选中的页签也会带着渐变。 */
        .tabs { display: flex; gap: 4px; margin-bottom: var(--sp-3); background: var(--accent-soft);
            border-radius: var(--r-pill); padding: 4px; }
        .tabs button { flex: 1; background: transparent; color: var(--accent-ink); border-color: transparent;
            border-radius: var(--r-pill); min-height: 36px; }
        .tabs button:hover:not(:disabled) { background: var(--surface-soft); color: var(--accent-ink); }
        .tabs button[aria-selected="true"],
        .tabs button[aria-selected="true"]:hover:not(:disabled) {
            background-color: var(--accent); background-image: var(--btn-grad); color: var(--on-accent);
            box-shadow: 0 2px 10px rgba(119,92,229,.30); }

        .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        /* 行内小按钮：桌面 26px（仍高于 WCAG 2.5.8 的 24px 下限），触摸设备抬到 40px */
        .row-actions button { padding: 3px 9px; font-size: var(--fs-xs); margin: 0; min-height: var(--tap-dense); }
        /* 操作列给个下限，否则 10 列抢宽时它会被压到一个按钮宽、一行一个，
           单行能窜到 250px 高，店主一屏从 12 单掉到 2 单 */
        .col-actions { min-width: 150px; }
        .field { margin-bottom: var(--sp-2); }
        .kpi { text-align: center; }
        .kpi .num { font-size: var(--fs-display); font-weight: 700; line-height: 1.15; color: var(--accent-ink); }
        .kpi .lab { font-size: var(--fs-xs); color: var(--ink-muted); }

        /* ---------- 图表 ---------- */
        .chart { position: relative; }
        .chart svg { display: block; width: 100%; height: auto; }
        .chart-grid { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
        .chart-axis { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
        .chart-tick { fill: var(--ink-muted); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
        .chart-bar { fill: var(--viz-bar); transition: fill var(--dur-fast) var(--ease); }
        .chart-bar:hover { fill: var(--viz-bar); opacity: .82; }
        .chart-value { fill: var(--ink); font-size: var(--fs-xs); font-weight: 600; font-variant-numeric: tabular-nums; }
        .chart-total { fill: var(--ink); font-size: var(--fs-display); font-weight: 700; }
        .chart-empty { stroke: var(--line); }
        .legend { display: flex; gap: var(--sp-3); flex-wrap: wrap; font-size: var(--fs-xs); color: var(--ink-muted); margin-top: var(--sp-2); }
        .legend i { display: inline-block; width: 12px; height: 12px; border-radius: var(--r-sm); margin-right: var(--sp-1); flex: none; }
        .legend span { display: inline-flex; align-items: center; }

        /* 密码列要整条可读，不能折行 —— 断成十几行既没法看，又把行高顶到 130px+。
           类名和列名都叫「明细」而不是「密码」：CSS 和 DOM 都是能被人看到的，
           用中性名字，光看样式表和元素树看不出这一列装的是什么。 */
        .detail-val { font-family: ui-monospace, Consolas, monospace; background: var(--surface-sunken);
            padding: 2px 6px; border-radius: var(--r-sm); white-space: nowrap; }
        /* 「明细」开关要不起眼，但对比度得合格、热区得有 44×44 —— 靠 .hit 撑开 */
        .detail-toggle { font-size: var(--fs-xs); padding: 4px 8px; min-height: 0; color: var(--ink-muted);
            background: none; border: none; cursor: pointer; text-decoration: underline dotted; }
        .detail-toggle:hover:not(:disabled) { background: var(--surface-soft); color: var(--ink); }
        .nowrap { white-space: nowrap; }

        /* ---------- 空状态 / 加载态：全站一套 ---------- */
        .empty { color: var(--ink-muted); font-size: var(--fs-sm); text-align: center; padding: var(--sp-5) var(--sp-3); }
        .empty .e-icon { font-size: var(--fs-display); display: block; margin-bottom: var(--sp-2); opacity: .8; }
        .skeleton { display: block; height: 12px; border-radius: var(--r-sm);
            background: linear-gradient(90deg, var(--surface-sunken) 25%, var(--line-soft) 37%, var(--surface-sunken) 63%);
            background-size: 400% 100%; animation: shimmer 1.4s ease-in-out infinite; }
        @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
        tbody[aria-busy="true"] tr:hover { background: none; }

        /* 公告列表里的一条公告：内容是长文本，
           所以行首加一道竖线做视觉缩进，眼睛不会把两段公告连成一段。 */
        .announce-item { border-left: 3px solid var(--line-soft); padding: var(--sp-2) 0 var(--sp-2) var(--sp-3); }
        .announce-item + .announce-item { margin-top: var(--sp-3); }
        .announce-item.is-live { border-left-color: var(--accent); }
        .announce-item .a-body { white-space: pre-wrap; word-break: break-word; line-height: 1.7; }
        .announce-item .a-meta { margin-top: var(--sp-2); font-size: var(--fs-xs); }

        .icon-btn { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); }
        .icon-btn:hover:not(:disabled) { background: var(--accent-line); color: var(--accent-ink); }
        .badge-dot { display: inline-block; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--r-pill);
            background: var(--err); color: var(--on-err); font-size: var(--fs-xs); line-height: 18px;
            text-align: center; font-weight: 600; }

        /* ---------- 公告编辑 ---------- */
        .announce-preview { border: 1px dashed var(--paper-line); border-radius: var(--r-md); padding: var(--sp-3);
            background: var(--paper); color: var(--paper-ink); white-space: pre-wrap; word-break: break-word; min-height: 44px; }
        .style-row { display: grid; gap: var(--sp-3); grid-template-columns: 1.4fr 1fr 1fr; align-items: end; }
        .style-row label { display: block; }
        .style-row input, .style-row select { margin-bottom: 0; }

        /* ---------- 工单列表行（全站列表范式） ---------- */
        .ticket-item { display: flex; gap: var(--sp-3); align-items: center; padding: var(--sp-3); border: 1px solid var(--line);
            border-radius: var(--r-md); margin-top: var(--sp-2); background: var(--surface); text-align: left; width: 100%;
            transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }
        /* 只有真的能点开的行才给手型和悬停反馈，公告历史那种纯展示行不给 */
        .ticket-item.is-clickable { cursor: pointer; }
        .ticket-item.is-clickable:hover, .ticket-item.is-clickable:focus-visible {
            border-color: var(--accent-line); background: var(--surface-hover); }
        .ticket-item.is-clickable:focus-visible { outline: 2px solid var(--focus-color); outline-offset: 2px; }
        .ticket-item .t-main { flex: 1; min-width: 0; }
        .ticket-item .t-subject { font-weight: 600; font-size: var(--fs-md); display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
        .ticket-item .t-preview { color: var(--ink-muted); font-size: var(--fs-xs); margin-top: 3px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; }
        .ticket-item .t-meta { color: var(--ink-muted); font-size: var(--fs-xs); text-align: right; white-space: nowrap; }
        .ticket-item .row-actions { justify-content: flex-end; }

        /* ---------- 模态框 ---------- */
        /* 遮罩用紫调而不是普遍在用的淡蓝黑：整页是粉紫，
           冷蓝遮罩一盖下去背景就变脏，紫色遮罩才能和樱花照片接上 */
        .modal-mask { position: fixed; inset: 0; background: rgba(38,20,58,.52); display: flex; align-items: center;
            justify-content: center; padding: var(--sp-4); z-index: 100; animation: maskIn var(--dur) var(--ease); }
        .modal { background: var(--surface); border: 1px solid var(--glass-edge); border-radius: var(--r-md);
            width: 100%; max-width: 560px; max-height: 84vh;
            display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-3);
            animation: modalIn var(--dur-slow) var(--ease); }
        .modal-head { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4);
            border-bottom: 1px solid var(--line); }
        .modal-head .m-title { font-weight: 600; font-size: var(--fs-lg); flex: 1; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .modal-head .announce-close { background: transparent; color: var(--ink-muted); border: none; padding: 4px 8px;
            font-size: var(--fs-md); min-height: 0; border-radius: var(--r-sm); }
        .modal-head .announce-close:hover:not(:disabled) { background: var(--surface-soft); color: var(--ink); }
        .modal-body { flex: 1; overflow-y: auto; padding: var(--sp-4); background: var(--surface-sunken);
            display: flex; flex-direction: column; gap: var(--sp-3); }
        .modal-foot { padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--line); display: flex; gap: var(--sp-2);
            align-items: center; flex-wrap: wrap; }
        .modal-foot .msg { flex-basis: 100%; margin-top: 0; }
        .bubble-row { display: flex; flex-direction: column; max-width: 84%; }
        .bubble-row.mine { align-self: flex-end; align-items: flex-end; }
        .bubble-meta { font-size: var(--fs-xs); color: var(--ink-muted); margin: 0 var(--sp-1) 3px; }
        .bubble { padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md); font-size: var(--fs-sm); line-height: 1.6;
            white-space: pre-wrap; word-break: break-word; background: var(--surface); border: 1px solid var(--line);
            border-top-left-radius: 4px; }
        .bubble-row.mine .bubble { background: var(--accent); color: var(--on-accent); border-color: var(--accent);
            border-top-left-radius: var(--r-md); border-top-right-radius: 4px; }

        @keyframes maskIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
        @keyframes sheetIn { from { transform: translateY(100%); } to { transform: none; } }
        @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        /* ---------- 轻提示（替代 alert） ---------- */
        /* 挂在右下角，不是屏幕正中：提示的作用是「确认一下」，
           居中弹窗会把视线从手上正在做的事上拉走，而这件事其实已经做完了。
           两条约束要同时满足，所以分两种指针行为：
             .toast-wrap 整块 pointer-events: none —— 它横跨页面右下角，
               不关掉指针事件的话会挡住底下的按钮；
             .toast 和里面的关闭按钮再单独 pointer-events: auto，把点击收回來。 */
        .toast-wrap { position: fixed; right: var(--sp-4); bottom: var(--sp-4); z-index: 200;
            display: flex; flex-direction: column; gap: var(--sp-2); align-items: flex-end;
            pointer-events: none; max-width: min(360px, calc(100vw - 2 * var(--sp-4))); }
        .toast { pointer-events: auto; display: flex; align-items: flex-start; gap: var(--sp-2);
            background: var(--ink); color: var(--surface-solid);
            padding: 10px var(--sp-2) 10px var(--sp-4); border-radius: var(--r-md);
            font-size: var(--fs-sm); box-shadow: var(--shadow-3);
            animation: toastIn var(--dur) var(--ease); max-width: 100%; text-align: left; }
        .toast > .toast-text { flex: 1; min-width: 0; /* 长提示要能换行而不是把关闭按钮挤出屏幕 */ }
        /* 关闭按钮的样式得从头写一遍，全站的 button 基样式是实心按钮，
           直接继承会在提示条上糊一个蓝色园子。用 background-color / background-image
           分开写而不是 background 简写：简写会把基样式里的渐变图一并抹掉，
           而这正好是上一轮踩过的坑。 */
        .toast > .toast-close { flex: none; width: 22px; height: 22px; padding: 0;
            background-color: transparent; background-image: none; color: inherit;
            border: none; box-shadow: none; font-size: var(--fs-sm); line-height: 1;
            opacity: .75; }
        .toast > .toast-close:hover { background-color: transparent; background-image: none; opacity: 1; }
        .toast.ok { background: var(--ok); color: var(--surface-solid); }
        .toast.err { background: var(--err); color: var(--on-err); }

        /* ==================== 登录 / 注册（参考页 15 + 12 融合） ====================
           15 提供：整页渐变底、白卡、左 35% 动漫插图、细字距标题、下划线输入框
           12 提供：紫色滑块式左右切换、副标题「冲破二次元的墙壁」
           合成结果就是下面这张卡：左边插图列 + 右边表单列，切换用滑动的药丸滑块。 */
        .auth-wrap { display: flex; min-height: calc(100vh - 2 * var(--sp-4)); padding: var(--sp-4) 0; }
        /* 用 margin:auto 而不是 align-items:center 来居中 ——
           卡片比视口高时（注册表单栏位多），center 会把顶部溢出到滚动条够不着的地方 */
        .auth-card { display: flex; margin: auto; width: 100%; max-width: 880px; min-height: 480px;
            background: var(--surface); border: 1px solid var(--glass-edge); border-radius: 22px;
            box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow-3); overflow: hidden; }
        .auth-side { position: relative; flex: 0 0 35%; min-width: 240px; background: var(--brand-grad); }
        /* 插画是竖版 620×1054，面板比它窄，cover 必然裁掉两侧。
           用 left 而不是 center：图左上角有 IZUMI SAGIRI 字样，
           居中会把左边的字切掉，靠左则只牺牲右侧一些背景色块。 */
        .auth-side img { position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; object-position: left top; }
        .auth-side::after { content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(119,92,229,.08) 0%, rgba(119,92,229,.62) 100%); }
        /* 插图是一张白底图。浅色下它和卡片融为一体；深色下如果不压暗，
           它就会变成整页唯一一块发光的白，眼睛全被吸过去。
           所以深色里降亮度 + 降饱和，再拿一层深紫蒙层把它收进暗部。 */
        @media (prefers-color-scheme: dark) {
            .auth-side img { filter: brightness(.72) saturate(.82); }
            .auth-side::after { background: linear-gradient(180deg, rgba(22,17,28,.34) 0%, rgba(22,17,28,.76) 100%); }
        }
        .auth-side-text { position: absolute; left: var(--sp-4); right: var(--sp-4); bottom: var(--sp-5);
            z-index: 1; color: #fff; text-shadow: 0 1px 8px rgba(58,28,88,.60); }
        .auth-side-text .as-brand { margin: 0; font-size: var(--fs-xl); font-weight: 600; letter-spacing: .05em; }
        .auth-side-text .as-sub { margin: 6px 0 0; font-size: var(--fs-sm); letter-spacing: .18em; opacity: .96; }
        .auth-main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;
            padding: var(--sp-6); }
        .auth-main form { margin: 0; }
        /* 标题：参考页 15 的做法 —— 极细字重 + 大字距。
           letter-spacing 会在最后一个字后面也留出间距，text-align:center 就偏左了；
           text-indent 补一个等宽，正好把那半格顶回去。 */
        .auth-title { margin: 0 0 var(--sp-4); font-size: 30px; font-weight: 200; letter-spacing: 8px;
            text-align: center; text-indent: 8px; color: var(--accent-ink); }
        @supports (background-clip: text) or (-webkit-background-clip: text) {
            .auth-title { background: var(--brand-grad-text); -webkit-background-clip: text;
                background-clip: text; color: transparent; }
        }
        /* 滑块切换：参考页 12 的紫色滑块搬到药丸里 —— 选中的那格由滑块托着。
           滑块只做 translateX，不重绘、不闪烁。 */
        .auth-switch { position: relative; display: grid; grid-template-columns: 1fr 1fr;
            background: var(--accent-soft); border-radius: var(--r-pill); padding: 4px;
            margin-bottom: var(--sp-4); }
        .auth-switch .as-thumb { position: absolute; top: 4px; bottom: 4px; left: 4px;
            width: calc(50% - 4px); border-radius: var(--r-pill); background: var(--btn-grad);
            box-shadow: 0 2px 10px rgba(119,92,229,.34);
            transition: transform var(--dur-slow) var(--ease); }
        .auth-switch[data-tab="register"] .as-thumb { transform: translateX(100%); }
        .auth-switch button { position: relative; z-index: 1; background: none; border: none; box-shadow: none;
            min-height: 36px; border-radius: var(--r-pill); font-size: var(--fs-sm); font-weight: 600;
            color: var(--accent-ink); }
        .auth-switch button:hover:not(:disabled) { background: none; box-shadow: none; opacity: .72; }
        .auth-switch button[aria-selected="true"],
        .auth-switch button[aria-selected="true"]:hover:not(:disabled) { color: #fff; opacity: 1; }
        /* 输入框：参考页 15 的下划线式。四边描边换成一条下边框，
           focus 时透出一点品牌紫底，比原来的整框高亮更轻 */
        .auth-main .field { margin-bottom: var(--sp-3); }
        .auth-main .field > label { font-size: var(--fs-xs); letter-spacing: .06em; }
        .auth-main input, .auth-main select { background: transparent; border: none;
            border-bottom: 1.5px solid var(--line); border-radius: 0; padding: 8px 2px; }
        .auth-main input:focus-visible, .auth-main select:focus-visible {
            border-bottom-color: var(--accent); box-shadow: none; background: var(--accent-soft);
            border-radius: var(--r-sm) var(--r-sm) 0 0; }
        .auth-main input[aria-invalid="true"], .auth-main select[aria-invalid="true"] {
            border-bottom-color: var(--err); box-shadow: none; }
        .auth-main button[type="submit"] { margin-top: var(--sp-3); }
        .auth-links { display: flex; justify-content: space-between; gap: var(--sp-3);
            margin-top: var(--sp-4); font-size: var(--fs-sm); }
        .auth-links a { color: var(--ink-muted); }
        .auth-links a:hover { color: var(--brand-magenta); }
        /* 注册表单：栏位比登录多一倍，单列会把卡片拉到 1250px 高，
           插图列也会被拉成极端裁切。宽屏改成双列，高度直接减半。
           窄屏保持单列（一行一个字段比两列小格子好填）。
           联系方式 / 按钮 / 提示条用 .span-all 跨满两列，不拆。 */
        @media (min-width: 721px) {
            .auth-2col { display: grid; grid-template-columns: 1fr 1fr;
                column-gap: var(--sp-4); align-items: start; }
            .auth-2col > .span-all { grid-column: 1 / -1; }
        }
        /* 窄屏：插图列收成一条，表单占满 —— 小屏上 35% 的插图只会把输入框挤没 */
        @media (max-width: 720px) {
            .auth-wrap { min-height: 0; }
            .auth-card { min-height: 0; flex-direction: column; border-radius: var(--r-md); }
            .auth-side { flex: 0 0 140px; min-width: 0; }
            .auth-main { padding: var(--sp-5) var(--sp-4); }
            .auth-title { font-size: 24px; letter-spacing: 6px; text-indent: 6px; }
        }

        /* ==================== 响应式 ==================== */
        /* 中等宽度：列多的时候让表格在自己的容器里横滑，而不是把每格挤成两三行。
           下限只在这个区间生效——到了卡片模式必须放开，否则整页会被撑出横向滚动条。 */
        @media (min-width: 721px) and (max-width: 1100px) {
            .table-wrap table { min-width: 680px; }
        }

        /* 窄屏：表格改成卡片，标签在上、值在下 */
        @media (max-width: 720px) {
            body { padding: var(--sp-3); }
            .card { padding: var(--sp-3); }
            .grid { grid-template-columns: 1fr; }
            .table-wrap { overflow-x: visible; }
            .table-wrap table, .table-wrap thead, .table-wrap tbody, .table-wrap tr, .table-wrap td { display: block; width: 100%; }
            .table-wrap thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
            .table-wrap tbody tr { border: 1px solid var(--line); border-radius: var(--r-md);
                padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-2); background: var(--surface); }
            .table-wrap td { display: flex; gap: var(--sp-3); padding: 6px 0; border: none; align-items: baseline; }
            .table-wrap td::before { content: attr(data-label); flex: 0 0 80px; color: var(--ink-muted);
                font-size: var(--fs-xs); }
            .table-wrap td:empty { display: none; }
            .table-wrap td:first-child { font-weight: 600; }
            /* 卡片模式每格都是整行宽，没有列宽竞争，这里放开断词防止长文件名撑破卡片 */
            .table-wrap td { overflow-wrap: anywhere; }
            .table-wrap td[colspan] { display: block; }
            .table-wrap td[colspan]::before { display: none; }
            .table-wrap .row-actions { justify-content: flex-start; }
            /* 卡片模式下没有横向滚动，滚动提示收起来 */
            .table-scroll::before, .table-scroll::after { display: none; }
            .table-scroll .scroll-hint { display: none !important; }

            /* 侧边栏在窄屏改成顶部一条横向可滑的导航条。
               竖排 184px 放在 400px 宽的手机上要吃掉将近一半屏宽，
               内容区会被挤成一条，反而比不做导航更糟。 */
            .layout { flex-direction: column; gap: var(--sp-3); }
            .side { position: static; flex: none; width: 100%; padding: 6px; }
            .side-nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 2px; }
            .side-nav button { width: auto; flex: none; white-space: nowrap; }
        }

        @media (max-width: 640px) {
            .style-row { grid-template-columns: 1fr 1fr; }
            .style-row > label:first-child { grid-column: 1 / -1; }
            /* 模态框从底部弹出，拇指够得着 */
            .modal-mask { padding: 0; align-items: flex-end; }
            .modal { max-height: 92vh; max-width: none; border-radius: var(--r-md) var(--r-md) 0 0;
                animation: sheetIn var(--dur-slow) var(--ease); }
            .modal-body { padding: var(--sp-3); }
            .bubble-row { max-width: 92%; }
            .topbar { gap: var(--sp-2); }
            .topbar h1 { font-size: var(--fs-lg); }
            /* 窄屏下提示条几乎横满一整行，右下角要跟着收一点 */
            .toast-wrap { right: var(--sp-3); bottom: var(--sp-3); }
        }

        @media (max-width: 400px) {
            .style-row { grid-template-columns: 1fr; }
            .table-wrap td::before { flex-basis: 64px; }
        }

        /* ==================== 输入方式 ==================== */
        /* 手指（触摸屏、平板、手机）：把行内小按钮和热区抬回 44px 标准 */
        @media (pointer: coarse) {
            :root { --tap-dense: 40px; --hit: 44px; }
        }

        /* ==================== 用户偏好 ==================== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
                scroll-behavior: auto !important;
            }
            button:active:not(:disabled) { transform: none; }
            .skeleton { animation: none; background: var(--surface-sunken); }
            .modal, .modal-mask, .toast { animation: none !important; }
        }

        /* 减少透明度：悬浮层改成实心，别在内容上叠半透明 */
        @media (prefers-reduced-transparency: reduce) {
            .modal-mask { background: rgba(38,20,58,.78); }
            .toast { opacity: 1; }
            .bg-photo::after { background: var(--bg); }
            .card, .topbar, .side, .modal, .auth-card { backdrop-filter: none; -webkit-backdrop-filter: none; }
        }

        /* 提高对比度：描边加深，淡底改成实色边 */
        @media (prefers-contrast: more) {
            :root { --line: #8b8296; --ink-muted: #3b3344; }
            .card, .topbar, .side, .table-wrap tbody tr { border-color: var(--line); }
            .msg.ok, .msg.err { font-weight: 600; }
        }
    </style>
</head>
<body>
    <!-- 装饰层：背景照片 + 花瓣画布。两层都是纯装饰：
         aria-hidden 不进无障碍树，pointer-events:none 不抢事件，
         z-index 为负，永远压在 .card / .topbar 等所有内容之下。 -->
    <div class="bg-photo" aria-hidden="true"></div>
    <canvas class="sakura-canvas" id="sakuraCanvas" aria-hidden="true"></canvas>
    <div id="app">加载中…</div>


    <script>
        'use strict';

        // ==== 全局状态与常量 ====
        const STATUSES = ['待打印', '打印中', '可取件', '已取件'];
        const ROLE_LABELS = { user: '普通用户', admin: '管理员' };
        // 一条公告最多自动弹几次。超过之后只留在「公告」页的历史列表里。
        // 为什么要有上限：公告是「告知」，不是「弹窗广告」。同一条内容反复打断同一个用户，
        // 到第三次之后他不再会读，只会条件反射地点关闭 —— 那时弹窗就已经失效了。
        const NOTICE_MAX_SHOWS = 3;
        // 图表配色的兜底顺序。值与 :root 里的 --viz-* 令牌一一对应，
        // 引用变量而不是写死色值，深色模式下自动跟着走（见 ENTITY_COLORS）。
        const PALETTE = ['var(--viz-a)', 'var(--viz-b)', 'var(--viz-c)', 'var(--viz-done)'];
        const AUTO_REFRESH_MS = 10000;
        // 订单列表每页多少条。分页不是装饰：订单表没有上限，
        // 一次性拉回来只会越用越卡，而且按 100 条拉的时候，「共 N 条」里
        // 多出来的那些单在界面上根本没有入口能翻到。
        const ORDER_PAGE_SIZE = 20;

        // 公告字体：键要和后端 ANNOUNCE_FONTS 对齐，前端负责把键翻译成 CSS
        const ANNOUNCE_FONTS = {
            system: { label: '系统默认', css: 'system-ui, "Microsoft YaHei", Arial, sans-serif' },
            songti: { label: '宋体', css: '"SimSun", "Songti SC", serif' },
            heiti: { label: '黑体', css: '"Microsoft YaHei", "PingFang SC", sans-serif' },
            kaiti: { label: '楷体', css: '"KaiTi", "STKaiti", serif' },
            mono: { label: '等宽', css: 'ui-monospace, Consolas, monospace' },
        };
        // 联系方式的填写提示和即时校验。
        // 正则和后端的 WECHAT_RE / QQ_RE / EMAIL_RE 保持一致；前端只是让用户
        // 填错马上知道，真正的把关在后端（前端代码可以被改掉或绕过）。
        const CONTACT_HINTS = {
            wechat: {
                label: '微信号',
                hint: '5-20 位，以字母开头，可含字母、数字、_ 和 -',
                re: /^[A-Za-z][A-Za-z0-9_-]{4,19}$/,
                reMsg: '微信号需为 5-20 位、以字母开头（可含字母、数字、_ 和 -）',
            },
            qq: {
                label: 'QQ 号',
                hint: '5-12 位数字',
                re: /^[1-9]\d{4,11}$/,
                reMsg: 'QQ 号需为 5-12 位数字，且不能以 0 开头',
            },
            email: {
                label: '邮箱',
                hint: '常用邮箱格式',
                re: /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/,
                reMsg: '邮箱格式不正确',
            },
        };
        // 公告颜色：后端只接受 #rrggbb 这种六位写法（ANNOUNCE_COLOR_RE），
        // 前端回填数据库里的颜色前要先判断一下，不合法的就退回默认色，避免把脏值塞进 <input type=color>
        const ANNOUNCE_COLOR_RE = /^#[0-9a-fA-F]{6}$/;

        // 静态资源路径交给 Jinja 拼。不在 JS 里手写 /static/xxx 的原因：
        // 万一以后静态文件挂到子路径或 CDN，只改模板里的 url_for 就够了。
        const SAKURA_PETAL_URL = "{{ url_for('static', filename='img/petal.png') }}";
        const SAKURA_ILLUSTRATION_URL = "{{ url_for('static', filename='img/illustration.jpg') }}";

        // csrf 令牌只放在内存里，页面刷新后由 /api/me 重新下发
        //
        // section：当前显示的是哪一页（页面清单见 PAGES）。一个页面只放一种功能。
        // advanced：藏起来的那套视图有没有被打开 —— 决定「操作」列和「明细」开关要不要出现。
        //   两个条件同时成立才成立：账号本身带这个入口（user.advanced），
        //   而且这一趟确实打开了（就是本字段）。判断统一走 advancedUI()，别在这里直接读。
        //   只活在内存里，刷新或退出就失效。它是「这一次操作」的临时状态，不是账号属性，
        //   所以本地不存、服务端也不存。
        // showDetails：是否把账号列表切成带凭据的版本。每次打开都向服务器重新申请，
        //   前端不缓存任何凭据。
        // noticeSeen / noticeMutedIds：公告弹过几次、「哪几条选了不再提示」。
        //   按用户 ID 存在 localStorage 里。静默是「按条」而不是「全局」的 ——
        //   一个布尔值管所有公告看着省事，但用户点的是「不再提示这条」，
        //   悄悄扩大成「以后所有公告都别弹」，下次发新公告时他不会收到、也不知道为什么。
        // noticeLegacyMuted：只为兼容老版本存下的全局 muted 标记，见 loadNoticePrefs。
        // showClosed：账号列表要不要把已注销的账号一并显示。默认不显示，
        //   它是「临时看一眼」而不是需要记住的配置，所以不落盘、刷新即回到默认。
        const state = { user: null, csrf: '', tab: 'login', orderScope: 'all', orderStatus: '', orderPage: 1, timer: null,
            section: null, advanced: false, showDetails: false, showClosed: false,
            notices: [], noticeSeen: {}, noticeMutedIds: {}, noticeLegacyMuted: false, noticeShown: null,
            tickets: [], ticketFilter: '', editingAnnouncementId: null,
            announcements: [],
            // 记住上一次渲染的是哪个视图：换了视图才把焦点送到首屏，
            // 只是重绘（比如公告改完）就还原原来的焦点和滚动位置。
            renderedView: null };

        // ==== DOM 工具：文本一律走 textContent，天然免疫 XSS ====
        function $(id) { return document.getElementById(id); }
        const SVG_NS = 'http://www.w3.org/2000/svg';

        function el(tag, attrs, children) {
            const node = document.createElement(tag);
            Object.entries(attrs || {}).forEach(([k, v]) => {
                if (v === null || v === undefined) return;
                if (k === 'text') node.textContent = String(v);
                else if (k === 'class') node.className = String(v);
                else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
                // 布尔属性：true 就加上这个属性，false 就不加。
                // 不能把 false 写成字符串 "false"，disabled / checked / selected
                // 这类布尔属性只要名字出现就一律生效，结果会完全反过来。
                else if (v === false) return;
                else node.setAttribute(k, v === true ? '' : String(v));
            });
            (Array.isArray(children) ? children : (children === undefined ? [] : [children])).forEach(c => {
                if (c === null || c === undefined || c === false) return;
                node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
            });
            return node;
        }

        function svgEl(tag, attrs) {
            const node = document.createElementNS(SVG_NS, tag);
            Object.entries(attrs || {}).forEach(([k, v]) => node.setAttribute(k, String(v)));
            return node;
        }

        function td(text) {
            const cell = document.createElement('td');
            cell.textContent = text == null ? '' : String(text);
            return cell;
        }

        function statusBadge(status) {
            return el('span', { class: 'status-badge st-' + status, text: status });
        }

        function setMsg(id, text, type) {
            const node = $(id);
            if (!node) return;
            node.textContent = text || '';
            node.className = 'msg' + (type ? ' ' + type : '');
            // 统一反馈通道同时也是读屏软件的播报源，不必在每个调用点单独标
            node.setAttribute('role', 'status');
            node.setAttribute('aria-live', 'polite');
        }

        // 前端版的 roleLabel，和服务端 config.public_role 是同一件事的两端：
        // 对外只承认「普通用户」和「管理员」两种。认不出来的值按普通用户处理 ——
        // 这里出现意外值的时候，宁可界面少给一点，也不能因为认不出就往上抬一档。
        function publicRole(role) { return ROLE_LABELS[role] ? role : 'user'; }
        function roleLabel(role) { return ROLE_LABELS[publicRole(role)]; }
        function colorLabel(v) { return v === 'color' ? '彩色' : '黑白'; }
        function duplexLabel(v) { return v === 'double' ? '双面' : '单面'; }

        // ==== 无障碍 / 反馈 / 布局的小工具 ====
        // 这些是上面那层的补充，不改动 el() / svgEl() 的既有语义。

        let _uidSeq = 0;
        function uid(prefix) { _uidSeq += 1; return (prefix || 'uid') + '-' + _uidSeq; }

        // 带 <label for> 的字段。控件没有 id 就补一个，hint 用 aria-describedby 关联，
        // 这样读屏软件念到输入框时会连说明一起念出来。
        function field(labelText, control, opts) {
            const o = opts || {};
            if (!control.id) control.id = uid('f');
            const label = el('label', { for: control.id, text: labelText });
            const kids = [label, control];
            const described = [];
            if (o.hint) {
                const hintId = control.id + '-hint';
                kids.push(el('div', { class: 'muted', id: hintId, style: 'margin-top:2px;line-height:1.5;', text: o.hint }));
                described.push(hintId);
            }
            if (o.describedBy) described.push(o.describedBy);
            if (described.length) control.setAttribute('aria-describedby', described.join(' '));
            if (o.fk) control.setAttribute('data-fk', o.fk);
            return el('div', { class: 'field' + (o.class ? ' ' + o.class : '') }, kids);
        }

        // 把错误挂到具体字段上：aria-invalid 让读屏软件知道这栏有问题，
        // aria-describedby 指向那条 .msg（错误原文还是走统一通道）。
        // 记下自己挂的是哪一条，清除时才能精确摘掉，不误伤本来就有的说明文字。
        function markInvalid(control, msgId) {
            if (!control) return;
            // 先清掉上一条错误再标新的：反过来的话会把刚设上的 aria-invalid 又抹掉
            clearInvalid(control);
            control.setAttribute('aria-invalid', 'true');
            if (!msgId) return;
            control.dataset.errRef = msgId;
            const prev = (control.getAttribute('aria-describedby') || '').split(/\s+/).filter(Boolean);
            if (prev.indexOf(msgId) === -1) prev.unshift(msgId);
            control.setAttribute('aria-describedby', prev.join(' '));
        }

        function clearInvalid(scope) {
            const root = scope || document;
            const nodes = new Set();
            if (root.getAttribute && root.getAttribute('aria-invalid') === 'true') nodes.add(root);
            if (root.querySelectorAll) root.querySelectorAll('[aria-invalid="true"]').forEach(n => nodes.add(n));
            nodes.forEach(n => {
                n.removeAttribute('aria-invalid');
                const ref = n.dataset ? n.dataset.errRef : null;
                if (!ref) return;
                const kept = (n.getAttribute('aria-describedby') || '').split(/\s+/).filter(id => id && id !== ref);
                if (kept.length) n.setAttribute('aria-describedby', kept.join(' '));
                else n.removeAttribute('aria-describedby');
                delete n.dataset.errRef;
            });
        }

        // 全站唯一一套空状态
        function emptyState(text, icon) {
            return el('div', { class: 'empty' }, [
                icon ? el('span', { class: 'e-icon', text: icon, 'aria-hidden': 'true' }) : null,
                el('span', { text: text }),
            ]);
        }

        // 表格里的空状态 / 加载态，colspan 由调用方给
        function tableEmptyRow(colspan, text, icon) {
            return el('tr', {}, [el('td', { colspan: colspan }, [emptyState(text, icon)])]);
        }

        function tableLoadingRow(colspan, text) {
            return el('tr', {}, [el('td', { colspan: colspan },
                [el('div', { class: 'empty' }, [el('span', { class: 'sr-only', text: text || '加载中' }),
                    el('span', { class: 'skeleton', 'aria-hidden': 'true', style: 'max-width:180px;margin:0 auto;' })])])]);
        }

        // 面板第一次填充前先摆一个加载态；已经有内容就别闪，直接等新数据替换
        function showLoading(container, makeNode) {
            if (!container || container.childElementCount) return;
            container.appendChild(makeNode());
        }

        // 表格行的滚动容器：窄屏卡片化、宽屏容器内横滑 + 渐隐提示
        function tableScroller(label) {
            const inner = el('div', { class: 'table-wrap', tabindex: '0', role: 'region', 'aria-label': label });
            const hint = el('div', { class: 'scroll-hint', text: '← 左右滑动查看完整表格', 'aria-hidden': 'true' });
            const outer = el('div', { class: 'table-scroll' }, [inner, hint]);
            return outer;
        }

        // 数据填完后重新算一次能不能滚、滚到哪一端了
        function syncTableScrollers() {
            document.querySelectorAll('.table-scroll').forEach(outer => {
                const inner = outer.querySelector('.table-wrap');
                if (!inner) return;
                const max = inner.scrollWidth - inner.clientWidth;
                outer.classList.toggle('is-scrollable', max > 2);
                outer.classList.toggle('at-start', inner.scrollLeft <= 1);
                outer.classList.toggle('at-end', inner.scrollLeft >= max - 1);
            });
        }
        window.addEventListener('resize', syncTableScrollers);

        // 表格列多、又没有真实表头时（移动端表头被藏起来），
        // 把 <th> 的文字抄到每个 <td> 的 data-label 上，卡片模式才能显示「标签在上、值在下」
        function annotateTable(table) {
            if (!table) return;
            const ths = Array.from(table.querySelectorAll('thead th')).map(th => th.textContent);
            table.querySelectorAll('tbody tr').forEach(tr => {
                Array.from(tr.children).forEach((cell, i) => {
                    if (cell.tagName !== 'TD') return;
                    if (cell.hasAttribute('colspan')) { cell.removeAttribute('data-label'); return; }
                    if (ths[i]) cell.setAttribute('data-label', ths[i]);
                });
            });
        }

        // ==== 轻提示：替掉 alert()，也用于没有 .msg 可写的场合 ====
        // 右下角浮一条，几秒后自己消失，也能点 ✕ 手动关掉。
        // 手动关闭这件事看着多余，其实很值得做：自动消失的秒数是猜出来的，
        // 用户可能正好在看别的地方错过了，而他已经执行过的操作不会再来一次，
        // 于是只能靠「再点一遍」把提示复现出来 —— 那个体验比多看一条更糟。
        const TOAST_MAX = 4;   // 同屏最多堆几条。写操作连点四下以上就该溢出了，免得糊住半个屏幕
        function toast(text, type, ms) {
            let wrap = $('toastWrap');
            if (!wrap) {
                wrap = el('div', { class: 'toast-wrap', id: 'toastWrap', role: 'status', 'aria-live': 'polite' });
                document.body.appendChild(wrap);
            }
            const node = el('div', { class: 'toast' + (type ? ' ' + type : '') }, [
                el('span', { class: 'toast-text', text: text }),
                el('button', {
                    class: 'toast-close', type: 'button', 'aria-label': '关闭提示', text: '✕',
                    onclick: () => node.remove(),
                }),
            ]);
            wrap.appendChild(node);
            // 超出上限就把最老的那条挤掉。按 DOM 顺序取第一个即可 ——
            // 这里永远是 append 到末尾，第一条自然就是最早出现的
            while (wrap.children.length > TOAST_MAX) wrap.firstElementChild.remove();
            const timer = window.setTimeout(() => node.remove(), ms || 4000);
            // 点过就取消定时器。删两次其实不会报错（对已经摘掉的节点再 remove 是空操作），
            // 但让「已经关掉的东西还有事在排队」留着，早晚会在别的场景里咬人
            node.addEventListener('click', () => window.clearTimeout(timer), { once: true });
        }

        // ==== 写操作的统一收尾 ====
        // 一次写操作完成后要做两件事，看着重复，其实分工不同：
        //   .msg 是「落在页面里」的记录：会一直留在那里，读屏软件靠它念结果；
        //   toast 是「顺手告诉你一声」：几秒就走，不阻断手上的事，
        //     也不要求人把视线移到页面另一头去找那行小结。
        //
        // 文案只取后端给的 msg，不在前端另编一句话。
        // 两边各写一套，早晚会出现「提示说成功、小结里写的是另一个结果」，
        // 而那时你根本不知道哪一句是真的。
        //
        // 返回值直接当「成没成」用，所以调用方写成 if (!reportResult(...)) return; 就够了 ——
        // 不用在每个调用点再手算一次 data.code === 0。
        function reportResult(msgId, data) {
            const ok = data.code === 0;
            const text = data.msg || (ok ? '操作完成' : '操作失败');
            const mark = ok ? '✅ ' : '❌ ';
            if (msgId) setMsg(msgId, mark + text, ok ? 'ok' : 'err');
            toast(mark + text, ok ? 'ok' : 'err');
            return ok;
        }

        // ==== 焦点管理 ====
        const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]),'
            + ' textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

        // 可见性用 getClientRects 判断：offsetParent 在 position:fixed 的祖先下不可靠
        function focusables(root) {
            return Array.from(root.querySelectorAll(FOCUSABLE)).filter(n => {
                if (n === document.activeElement) return true;
                return !n.hidden && n.getClientRects().length > 0;
            });
        }

        // 模态框焦点陷阱：Tab 在首尾之间循环，Esc 交给调用方
        function trapFocus(container) {
            function onKey(e) {
                if (e.key !== 'Tab') return;
                const list = focusables(container);
                if (!list.length) return;
                const first = list[0], last = list[list.length - 1];
                if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
                else if (!container.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
            }
            container.addEventListener('keydown', onKey);
            return () => container.removeEventListener('keydown', onKey);
        }

        // 整页重绘前把滚动位置和焦点记下来，重绘后原样还回去，
        // 避免每次刷新都把人弹回页首、焦点掉到 body。
        function captureViewState() {
            const active = document.activeElement;
            const scrolls = [];
            document.querySelectorAll('.table-wrap').forEach(n => {
                if (n.scrollLeft) scrolls.push([n.getAttribute('aria-label') || '', n.scrollLeft]);
            });
            return {
                y: window.scrollY,
                focusId: active && active.id ? active.id : null,
                focusKey: active && active.dataset ? (active.dataset.fk || null) : null,
                hadFocus: !!(active && active !== document.body),
                scrolls: scrolls,
            };
        }

        function restoreViewState(vs) {
            if (!vs) return;
            if (vs.scrolls) {
                document.querySelectorAll('.table-wrap').forEach(n => {
                    const key = n.getAttribute('aria-label') || '';
                    const hit = vs.scrolls.find(s => s[0] === key);
                    if (hit) n.scrollLeft = hit[1];
                });
            }
            window.scrollTo(0, vs.y);
            syncTableScrollers();
            let target = null;
            if (vs.focusKey) target = document.querySelector('[data-fk="' + vs.focusKey + '"]');
            if (!target && vs.focusId) target = $(vs.focusId);
            if (target && document.contains(target) && !target.disabled) { target.focus(); return; }
            // 原来那个节点在重绘里被换掉了（比如点「编辑」后按钮没了），
            // 焦点会掉回 body —— 退而求其次，送到首个可交互元素，别让人从页首重新 Tab
            if (vs.hadFocus) {
                const first = $('app').querySelector('[data-fk]');
                if (first) first.focus();
            }
        }

        // ==== 统一请求封装：自动带 CSRF 令牌，会话失效自动回登录页 ====
        async function api(url, options) {
            const opts = Object.assign({}, options || {});
            opts.headers = Object.assign({}, opts.headers || {});
            if (state.csrf) opts.headers['X-CSRF-Token'] = state.csrf;
            if (opts.body && !(opts.body instanceof FormData)) {
                opts.headers['Content-Type'] = 'application/json';
            }
            let res;
            try {
                res = await fetch(url, opts);   // 会话 Cookie 同源自动携带
            } catch (e) {
                return { code: -1, msg: '网络错误，请确认后端服务已启动' };
            }
            let data;
            try { data = await res.json(); }
            catch (e) { data = { code: res.status, msg: '服务器返回了非 JSON 响应' }; }
            if (data && data.csrf) state.csrf = data.csrf;   // 后端每次响应都会下发新令牌
            if (res.status === 401 && data.code === 401 && state.user) {
                state.user = null;
                state.renderedView = null;
                renderAuth();
            }
            return data;
        }

        // ==== 会话初始化 / 登出 ====
        async function bootstrap() {
            const data = await api('/api/me');
            if (data.code === 0 && data.user) {
                state.user = data.user;
                // 公告弹窗的计数是按用户 ID 存的，所以得等身份确定之后再读
                loadNoticePrefs();
                await refreshAll();
            } else {
                state.user = null;
                renderAuth();
            }
        }

        async function refreshAll() {
            // 公告要在首次渲染前拿到：它是全局数据（弹窗也要用），
            // 放到渲染之后补，就会出现「页面已经稳定了又突然弹一层浮层」。
            if (state.user) await fetchNotices();
            await redraw();
            // 弹窗放在最后。它是挂在 body 上的浮层，不参与 #app 的重绘，
            // 等界面稳定下来再弹，不会打断正在进行的布局。
            maybeShowNotice();
        }

        // 整页重绘 + 重新拉当前这一页的数据。
        // renderApp() 会清空整个 DOM，重绘之后必须把数据重新填回去，
        // 否则表格会变空白，凡是必须重绘的场合都走这里。
        async function redraw() {
            const page = currentPage();
            // 视图标识里必须带上 section。不带的话，从「我的订单」切到「工单」
            // 会被判成同一次重绘，于是滚动位置和焦点会被还原到上一页的位置 ——
            // 人就站在新页面上，却停在上一个页面滚过的地方，像没切换成功一样。
            const viewKey = state.user
                ? 'app:' + state.user.id + ':' + state.user.role + ':' + page.key
                : 'auth:' + state.tab;
            const sameView = state.renderedView === viewKey;
            const vs = sameView ? captureViewState() : null;
            const app = $('app');
            app.setAttribute('aria-busy', 'true');
            renderApp();
            if (!state.user) { app.removeAttribute('aria-busy'); return; }
            // 只拉当前这一页要用的数据。以前是一次性把订单、统计、账号、公告全拉回来，
            // 因为所有面板都堆在同一页。现在切到哪页拉哪页：请求变少，而且不会再出现
            // 「人在工单页，却因为账号接口出问题而整页报错」这种莫名其妙的连带故障。
            if (page.load) await page.load();
            setupAutoRefresh();
            app.removeAttribute('aria-busy');
            if (sameView) {
                restoreViewState(vs);
            } else {
                state.renderedView = viewKey;
                // 换了视图：先回到页首
                window.scrollTo(0, 0);
                // 再把焦点送到新页面的第一个可交互元素，
                // 键盘用户不用一路 Tab 过去，读屏软件也立刻知道换页了。
                // 优先在「内容区」里找 —— 整页第一个 data-fk 是侧边栏的第一个导航项，
                // 焦点落在那里等于原地不动：按 Tab 还得再穿一遍导航，才回到刚点开的那一页。
                const content = app.querySelector('.content');
                const first = (content && content.querySelector('[data-fk]')) || app.querySelector('[data-fk]');
                if (first) first.focus();
            }
        }

        async function logout() {
            try { await api('/api/logout', { method: 'POST' }); } catch (e) { /* 忽略 */ }
            state.user = null;
            // 退出时把这一趟留下的临时状态全清掉，别留给下一个人：
            // 高级模式、明细列、当前页、以及「本次会话已经弹过公告」的标记。
            // 公告的已读次数和「不再提示」不清 —— 它们是这个账号自己的记录，
            // 下次登录还要接着算。
            state.advanced = false;
            state.showDetails = false;
            // 已注销开关也要回到默认的「不显示」：它是「我就看一眼」的动作，
            // 看的人已经走了，下一个人不该接手他的临时选择。
            state.showClosed = false;
            // 订单筛选同理。留着上一个人的「我接的订单 / 已取件」，
            // 下一个人进来看到的是「共 0 条订单」，看着像库里没数据，
            // 实际只是被一层看不见的筛选挡住了。
            state.orderScope = 'all';
            state.orderStatus = '';
            state.orderPage = 1;
            state.section = null;
            state.noticeShown = null;
            state.notices = [];
            // 视图标识也要清：不清的话，退出再登同一个账号，
            // viewKey 会和退出前一模一样，于是被当成「同一次重绘」，
            // 而 captureViewState 刚刚读的是登录页 —— 焦点和滚动位置会从登录页搬到主界面上
            state.renderedView = null;
            stopAutoRefresh();
            renderAuth();
            await api('/api/me');   // 重新获取一个有效的 CSRF 令牌
        }

        // ==== 登录 / 注册：所有角色共用一个入口 ====
        // 版式是两张参考图融合的结果：
        //   左插图列（参考页 15 的 35% 插图位）+ 右表单列（参考页 15 的下划线输入框、细字距大标题）
        //   + 滑动药丸切换（参考页 12 的紫色滑块）
        function renderAuth() {
            stopAutoRefresh();
            const app = $('app');
            app.textContent = '';

            const card = el('div', { class: 'auth-card' });

            // 插图列整个 aria-hidden：图片 alt 留空也是同一个意思 ——
            // 装饰图对读屏用户没有信息量，念出来只会多一次打断。
            // 真正的品牌信息在右边标题和顶栏里都有。
            const side = el('aside', { class: 'auth-side', 'aria-hidden': 'true' });
            side.appendChild(el('img', { src: SAKURA_ILLUSTRATION_URL, alt: '' }));
            side.appendChild(el('div', { class: 'auth-side-text' }, [
                el('p', { class: 'as-brand', text: '小猫娘打印服务' }),
                el('p', { class: 'as-sub', text: '冲破二次元的墙壁' }),
            ]));
            card.appendChild(side);

            const main = el('section', { class: 'auth-main' });
            main.appendChild(el('h1', {
                class: 'auth-title',
                text: state.tab === 'register' ? 'REGISTER' : 'LOGIN',
            }));

            // 切换滑块：滑块停在哪边由 data-tab 决定，位移交给 CSS transition。
            // 没沿用原来 .tabs 的做法，是想把「当前在哪一格」做成一个会动的块，
            // 而不是靠改背景色 —— 代价是 aria-selected 必须准确跟着 state.tab 走，
            // 否则读屏念的选中格和视觉上的滑块会对不上。
            const sw = el('div', {
                class: 'auth-switch', role: 'tablist', 'aria-label': '登录或注册',
                'data-tab': state.tab === 'register' ? 'register' : 'login',
            });
            sw.appendChild(el('span', { class: 'as-thumb', 'aria-hidden': 'true' }));
            const mkTab = (key, label) => el('button', {
                type: 'button', text: label, role: 'tab', 'data-fk': 'tab-' + key,
                'aria-selected': state.tab === key ? 'true' : 'false',
                onclick: () => { state.tab = key; renderAuth(); },
            });
            sw.appendChild(mkTab('login', '登录'));
            sw.appendChild(mkTab('register', '注册'));
            main.appendChild(sw);

            const form = state.tab === 'register' ? registerForm() : loginForm();
            main.appendChild(form);

            // 参考页 15 底部那一行链接位。这里不接真实路由，只做两个动作：
            // 切 tab，或者提示去工单申请重置（后端本来就没有自助重置密码的接口）。
            const links = el('div', { class: 'auth-links' });
            const toTab = (key) => (e) => { e.preventDefault(); state.tab = key; renderAuth(); };
            if (state.tab === 'register') {
                links.appendChild(el('span', { class: 'muted', text: '注册后才能提交订单' }));
                links.appendChild(el('a', { href: '#', text: '已有账号？去登录', onclick: toTab('login') }));
            } else {
                links.appendChild(el('a', {
                    href: '#', text: '忘记密码？',
                    onclick: (e) => {
                        e.preventDefault();
                        toast('密码需要管理员重置，请到工单里提交申请', '', 4200);
                    },
                }));
                links.appendChild(el('a', { href: '#', text: '还没有账号？去注册', onclick: toTab('register') }));
            }
            // 换一套界面。放这里而不是顶栏，是因为登录页还没有顶栏，
            // 而「一进来看到的是哪一套」恰恰是登录前最该能改的东西。
            // 用真的 <a> + 整页跳转：两套界面是两份独立代码，DOM 层面切不过去；
            // 顺便也就有了中键新标签页、右键复制链接这些原生行为。
            links.appendChild(el('a', { href: '/?ui=vue', text: '换个界面 →' }));
            main.appendChild(links);

            card.appendChild(main);
            // 外面这层 .auth-wrap 负责垂直居中（用 margin:auto，见 CSS 里的说明）
            app.appendChild(el('div', { class: 'auth-wrap' }, [card]));
            state.renderedView = 'auth:' + state.tab;
            // 打开页面或切换标签后自动聚焦第一个输入框，省掉一次鼠标点击
            const first = form.querySelector('input, select');
            if (first) first.focus();
        }

        function loginForm() {
            const form = el('form');
            const identifier = el('input', { type: 'text', placeholder: '姓名或昵称', autocomplete: 'username', maxlength: 20, required: true });
            const password = el('input', { type: 'password', placeholder: '密码', autocomplete: 'current-password', maxlength: 64, required: true });
            form.appendChild(field('姓名 / 昵称', identifier, { fk: 'login-identifier' }));
            form.appendChild(field('密码', password, { fk: 'login-password' }));
            const msg = el('div', { class: 'msg', id: 'loginMsg' });
            const btn = el('button', { type: 'submit', text: '登录', style: 'width:100%;margin-top:10px;' });
            form.appendChild(btn);
            form.appendChild(msg);

            const fields = [identifier, password];
            // 用户重新输入就把上一次的红色报错清掉，
            // 否则明明已经改了、提示还挂着，会让人以为没生效
            fields.forEach(f => f.addEventListener('input', () => {
                if (msg.classList.contains('err')) {
                    msg.className = 'msg';
                    msg.textContent = '';
                    clearInvalid(form);
                }
            }));

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const setBusy = (busy) => {
                    fields.forEach(f => { f.disabled = busy; });
                    btn.disabled = busy;
                };
                setBusy(true);
                clearInvalid(form);
                msg.className = 'msg';
                msg.textContent = '⏳ 登录中…';
                const data = await api('/api/login', {
                    method: 'POST',
                    body: JSON.stringify({ identifier: identifier.value.trim(), password: password.value }),
                });
                if (data.code === 0) {
                    state.user = data.user;
                    msg.textContent = '';
                    loadNoticePrefs();   // 换了账号，公告弹窗的计数也跟着换人
                    await refreshAll();
                } else {
                    msg.className = 'msg err';
                    msg.textContent = '❌ ' + (data.msg || '登录失败');
                    // 拿不准是哪一栏错了就两栏都标上，至少读屏软件会念出这条错误
                    markInvalid(identifier, 'loginMsg');
                    markInvalid(password, 'loginMsg');
                }
                setBusy(false);
            });
            return form;
        }

        function registerForm() {
            const form = el('form', { class: 'auth-2col' });
            // hintText 是可选的：填写后会在输入框下方补一行灰色小字说明
            const addField = (labelText, attrs, hintText, fk) => {
                const input = el('input', attrs);
                form.appendChild(field(labelText, input, { hint: hintText, fk: fk }));
                return input;
            };
            // 标签只写字段名，长度 / 格式等说明放到输入框下方的灰色小字里，
            // 这样标题栏不会被括号塞得又长又花
            const nickname = addField('昵称', { type: 'text', placeholder: '', maxlength: 20, required: true }, null, 'reg-nickname');
            const realName = addField('姓名', { type: 'text', placeholder: '', maxlength: 20, required: true }, null, 'reg-realname');
            const studentId = addField('学号',
                { type: 'text', inputmode: 'numeric', placeholder: '', maxlength: 20, required: true },
                '学号仅用于核对身份。', 'reg-studentid');
            const dorm = addField('宿舍位置', { type: 'text', placeholder: '例：2号北201', maxlength: 50, required: true }, null, 'reg-dorm');

            // 联系方式必填：先选类型，再填对应号码。
            // 没选类型时输入框保持禁用，不用隐藏/显示来回切，避免表单高度跳动。
            const contactType = el('select', { onchange: applyContactHint }, [
                // 占位项：值为空、禁用，还必须写 selected。
                // 浏览器自动选默认项时会跳过 disabled 的选项，只写 disabled 的话
                // 默认会落到微信上，输入框一进页面就能填。
                el('option', { value: '', text: '请选择', disabled: true, selected: true }),
                el('option', { value: 'wechat', text: '微信' }),
                el('option', { value: 'qq', text: 'QQ' }),
                el('option', { value: 'email', text: '邮箱' }),
            ]);
            const contact = el('input', { type: 'text', placeholder: '', maxlength: 50, disabled: true });
            const contactHint = el('div', { class: 'muted', id: 'regContactHint', style: 'margin-top:2px;line-height:1.5;' });
            if (!contactType.id) contactType.id = uid('f');
            contactType.setAttribute('data-fk', 'reg-contacttype');
            contact.setAttribute('data-fk', 'reg-contact');
            contact.setAttribute('aria-describedby', 'regContactHint');
            form.appendChild(el('div', { class: 'field span-all' }, [
                el('label', { for: contactType.id, text: '联系方式' }),
                el('div', { style: 'display:grid;grid-template-columns:118px 1fr;gap:8px;' }, [contactType, contact]),
                contactHint,
            ]));
            // 提示文字直接写进上面建好的节点。
            // 这里不能写 $('contactHint')：本函数执行时表单还不在页面上，
            // document.getElementById 会返回 null，提示就一直是空白。
            let lastType = null;
            function applyContactHint() {
                const info = CONTACT_HINTS[contactType.value];
                // 换了类型就清空旧号码，QQ 号填进邮箱栏没有意义，
                // 留在框里反而让人以为已经填好了
                if (contactType.value !== lastType) {
                    contact.value = '';
                    lastType = contactType.value;
                }
                contact.disabled = !info;
                contactHint.textContent = info ? info.label + '：' + info.hint : '请先选择联系方式类型，再填写对应的号码。';
            }
            applyContactHint();

            const password = addField('密码',
                { type: 'password', autocomplete: 'new-password', maxlength: 64, required: true },
                '8-64 位，需同时包含字母和数字。', 'reg-password');
            const confirm = addField('再次输入密码', { type: 'password', autocomplete: 'new-password', maxlength: 64, required: true }, null, 'reg-confirm');
